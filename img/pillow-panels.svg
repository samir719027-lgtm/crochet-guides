<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Three panels, one envelope</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Three panels, one envelope</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The opening is wherever the two backs overlap</text><rect x="56" y="196" width="150" height="150" rx="3" fill="#33586B" opacity="0.16" stroke="#33586B"/><text x="131" y="186" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#33586B" text-anchor="middle" letter-spacing="0.3">FRONT PANEL</text><text x="131" y="276" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="middle">17in / 43cm square</text><rect x="290" y="196" width="150" height="78" rx="3" fill="#D8A23C" opacity="0.18" stroke="#D8A23C"/><text x="365" y="240" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#D8A23C" text-anchor="middle" letter-spacing="0.3">BACK A</text><rect x="290" y="268" width="150" height="78" rx="3" fill="#A63B4A" opacity="0.18" stroke="#A63B4A"/><text x="365" y="312" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#A63B4A" text-anchor="middle" letter-spacing="0.3">BACK B</text><rect x="290" y="236" width="150" height="70" fill="none" stroke="#22404F" stroke-width="2" stroke-dasharray="6 4"/><text x="365" y="276" font-family="Fraunces, Georgia, serif" font-size="11" font-weight="600" fill="#22404F" text-anchor="middle">overlap 4in</text><text x="460" y="240" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">back A is right side up,</text><text x="460" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">back B over the top,</text><text x="460" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">overlapping by 4in</text><text x="460" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">left unseamed as</text><text x="460" y="316" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the opening</text><text x="24" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every panel is chain 55 and 54 stitches in BLO. An envelope back needs no notion and no</text><text x="24" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">separate sewing skill, and the opening is simply wherever the two panels meet.</text></svg>