<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="'Work Sans', -apple-system, sans-serif"><title>Colour and grip</title><rect width="640" height="540" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Colour and grip</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Pooling, and staying put on the floor</text><rect x="24.0" y="264" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="264" width="4" height="80" rx="2" fill="#33586B"/><text x="40.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Backing spray</text><text x="40.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Real grip on hardwood and</text><text x="40.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">tile with no change to the</text><rect x="228.0" y="264" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="264" width="4" height="80" rx="2" fill="#33586B"/><text x="244.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Rubber pad</text><text x="244.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Cut to match the round</text><text x="244.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">outline and attach</text><rect x="432.0" y="264" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="264" width="4" height="80" rx="2" fill="#33586B"/><text x="448.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Both reapply</text><text x="448.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Especially after washing,</text><text x="448.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">which loosens most backings</text><text x="24" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A high-traffic entryway or kitchen spot wants the most durable option, since that is where</text><text x="24" y="390" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the spills and repeated compression happen. A bedroom accent spot has more room for a</text><text x="24" y="406" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">softer, plusher yarn purely for the underfoot feel.</text></svg>