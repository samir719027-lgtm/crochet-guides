<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="'Work Sans', -apple-system, sans-serif"><title>Anatomy of a fingerless glove</title><rect width="640" height="350" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Anatomy of a fingerless glove</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Tube, thumb, cuff</text><path d="M 290 118 L 290 240 q 0 26 54 26 L 342 266 L 342 158" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 346 118 L 346 266 q 4 22 52 22 L 398 240 L 398 158" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="288" y="98" width="112" height="24" rx="3" fill="#A63B4A" opacity="0.8"/><text x="344" y="112" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="middle">cuff</text><path d="M 396 204 q 46 -8 44 26 q -2 30 -40 30" fill="#EDE6D9" stroke="#DDD4C6"/><text x="452" y="234" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="start">thumb</text><text x="248" y="230" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#22404F" text-anchor="start">ch 28, then</text><text x="248" y="246" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#22404F" text-anchor="start">single crochet</text><text x="248" y="262" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#22404F" text-anchor="start">in the round</text><text x="24" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One tube for the hand, a thumb worked off the side, and a ribbed cuff at the opening.</text></svg>