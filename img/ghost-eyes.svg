<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" width="640" height="332" font-family="'Work Sans', -apple-system, sans-serif"><title>Placing safety eyes</title><rect width="640" height="332" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Placing safety eyes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Four steps, and one of them is checking</text><rect x="24.0" y="212" width="286" height="60" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="212" width="4" height="60" rx="2" fill="#33586B"/><text x="40.0" y="234" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Mismatched placement</text><text x="40.0" y="250" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">almost always means one eye went in without</text><text x="40.0" y="263" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">checking the pair</text><rect x="330.0" y="212" width="286" height="60" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="212" width="4" height="60" rx="2" fill="#33586B"/><text x="346.0" y="234" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Under 3?</text><text x="346.0" y="250" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">embroider the eyes instead, and there is no</text><text x="346.0" y="263" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">small part to come loose</text><text x="24" y="294" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Washers are effectively permanent once seated, so there is no second attempt once they are</text><text x="24" y="310" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">on. The cheap part of the job is the check beforehand.</text></svg>