<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" font-family="'Work Sans', -apple-system, sans-serif"><title>Two ways to hold the yarn</title><rect width="640" height="354" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Two ways to hold the yarn</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Where tension lives in each style</text><text x="184" y="96" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#33586B" text-anchor="middle">CONTINENTAL</text><line x1="144" y1="140" x2="224" y2="140" stroke="#E4DACB" stroke-width="14" stroke-linecap="round"/><line x1="154" y1="132" x2="154" y2="176" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><line x1="174" y1="132" x2="174" y2="176" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><line x1="194" y1="132" x2="194" y2="176" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><line x1="214" y1="132" x2="214" y2="176" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><path d="M 184 120 q 10 10 0 20" fill="none" stroke="#33586B" stroke-width="3"/><text x="184" y="202" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">yarn rides over the index</text><text x="184" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">finger; hook flicks it</text><text x="494" y="96" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#A63B4A" text-anchor="middle">ENGLISH</text><path d="M 454 130 q 20 26 0 46 q -20 20 0 40" fill="none" stroke="#E4DACB" stroke-width="10" stroke-linecap="round"/><line x1="450" y1="138" x2="486" y2="144" stroke="#E4DACB" stroke-width="11" stroke-linecap="round"/><line x1="450" y1="154" x2="486" y2="160" stroke="#E4DACB" stroke-width="11" stroke-linecap="round"/><line x1="450" y1="170" x2="486" y2="176" stroke="#E4DACB" stroke-width="11" stroke-linecap="round"/><path d="M 540 154 h -26 m 6 -6 l -6 6 6 6" fill="none" stroke="#A63B4A" stroke-width="3"/><text x="494" y="202" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">yarn wrapped around the</text><text x="494" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">fingers; hook scoops it</text><text x="24" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Same stitches, same yarn - only how you hold and tension the yarn differs.</text></svg>