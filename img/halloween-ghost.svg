<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" font-family="'Work Sans', -apple-system, sans-serif"><title>How the ghost&#x27;s skirt flares</title><rect width="640" height="396" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How the ghost&#x27;s skirt flares</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Leave round 10 open and weave the tail</text><rect x="354.0" y="120" width="85" height="86" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="354.0" y="120" width="4" height="86" rx="2" fill="#33586B"/><text x="370.0" y="142" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Do not close it</text><text x="370.0" y="158" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Pulling</text><text x="370.0" y="171" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the last</text><rect x="454.6666666666667" y="120" width="85" height="86" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="454.6666666666667" y="120" width="4" height="86" rx="2" fill="#33586B"/><text x="470.6666666666667" y="142" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Weave loosely</text><text x="470.6666666666667" y="158" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Thread the</text><text x="470.6666666666667" y="171" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">tail</text><rect x="555.3333333333334" y="120" width="85" height="86" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="555.3333333333334" y="120" width="4" height="86" rx="2" fill="#33586B"/><text x="571.3333333333334" y="142" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Keep it flared</text><text x="571.3333333333334" y="158" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The open</text><text x="571.3333333333334" y="171" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">edge gives</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Fasten off leaving a long tail, then weave it through the last round rather than pulling the</text><text x="24" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">round closed.</text></svg>