<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" width="640" height="362" font-family="'Work Sans', -apple-system, sans-serif"><title>Washing and reshaping</title><rect width="640" height="362" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Washing and reshaping</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Most of the work is done damp</text><rect x="24" y="92" width="168" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="110" r="11" fill="#33586B"/><text x="42" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Gentle cycle</text><text x="36" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">with a machine-washable</text><text x="36" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">cotton yarn</text><path d="M 196 128.0 h 6 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="210" y="92" width="168" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="228" cy="110" r="11" fill="#33586B"/><text x="228" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="248" y="114" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Reshape while damp</text><text x="222" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">coax the brim back into</text><text x="222" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">its flared curve</text><path d="M 382 128.0 h 6 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="396" y="92" width="168" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="414" cy="110" r="11" fill="#33586B"/><text x="414" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="434" y="114" font-family="Fraunces, Georgia, serif" font-size="12.0" font-weight="600" fill="#2A241E" text-anchor="start">Lay flat on a towel</text><text x="408" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rather than draping it</text><text x="408" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">over anything round</text><rect x="24" y="206" width="592" height="96" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24" y="206" width="4" height="96" rx="2" fill="#D8A23C"/><text x="42" y="232" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Why cotton is not interchangeable here</text><text x="42" y="253" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Cotton has less stretch and more structure, which is what helps the brim hold its flared</text><text x="42" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">shape, and a very elastic substitute will relax back toward a straight cylinder. It also stays</text><text x="42" y="283" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">cooler against a head in warm weather.</text><text x="24" y="324" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Draping a damp hat over something round to dry will pull the brim out of shape, which is the</text><text x="24" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">single easiest way to ruin an otherwise good hat.</text></svg>