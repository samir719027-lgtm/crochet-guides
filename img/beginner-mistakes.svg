<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>Common mistakes</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Common mistakes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three, and the first is a hook</text><rect x="24.0" y="268" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="268" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="290" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Four things to start</text><text x="40.0" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A hook in the 2.5-3.5mm</text><text x="40.0" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">range, light worsted cotton</text><rect x="228.0" y="268" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="268" width="4" height="54" rx="2" fill="#22404F"/><text x="244.0" y="290" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Cotton or acrylic</text><text x="244.0" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Cotton holds stitch</text><text x="244.0" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">definition especially well</text><rect x="432.0" y="268" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="268" width="4" height="54" rx="2" fill="#D8A23C"/><text x="448.0" y="290" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Not cotton balls</text><text x="448.0" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">They clump and go lumpy;</text><text x="448.0" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">fiberfill stays fluffy and</text></svg>