<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" font-family="'Work Sans', -apple-system, sans-serif"><title>Edges that stay straight</title><rect width="640" height="276" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Edges that stay straight</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Increase in the first and last stitch every row</text><path d="M 144 216 L -36 126 L 324 126 Z" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M -30 126 m -8 -14 l 14 12 M 318 126 m 8 -14 l -14 12" stroke="#A63B4A" stroke-width="2.5" fill="none"/><text x="52" y="66" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="middle">inc at the</text><text x="52" y="80" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="middle">first stitch</text><text x="236" y="66" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="middle">inc at the</text><text x="236" y="80" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="middle">last stitch</text><text x="24" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stitches on both edges are what keep the sides straight.</text></svg>