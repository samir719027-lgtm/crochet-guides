<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" width="640" height="502" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing reliably</title><rect width="640" height="502" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing reliably</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Measure the head, not the age label</text><rect x="24.0" y="336" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="117.33333333333333" y="370" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#A63B4A" text-anchor="middle">18-19in</text><text x="117.33333333333333" y="390" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">head circumference</text><rect x="226.66666666666666" y="336" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="320.0" y="370" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#D8A23C" text-anchor="middle">1.5-2in</text><text x="320.0" y="390" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">shorter than the head</text><rect x="429.3333333333333" y="336" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="522.6666666666666" y="370" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#33586B" text-anchor="middle">1 to 3</text><text x="522.6666666666666" y="390" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">years, on average</text><text x="24" y="464" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Toddler head sizes vary far more between individual children than adult sizes do, so</text><text x="24" y="480" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">measuring beats treating the age range as a firm number.</text></svg>