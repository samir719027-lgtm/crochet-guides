<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" width="640" height="516" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing by bust measurement</title><rect width="640" height="516" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing by bust measurement</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The same four steps for any size</text><rect x="24" y="96" width="142" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#33586B"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">Measure the bust</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Circumference of</text><text x="36" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the intended wearer</text><path d="M 170 137.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="182" y="96" width="142" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="200" cy="114" r="11" fill="#33586B"/><text x="200" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="220" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Divide by 2</text><text x="194" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The back and the</text><text x="194" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">two fronts make the</text><path d="M 328 137.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="340" y="96" width="142" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="358" cy="114" r="11" fill="#33586B"/><text x="358" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="378" y="118" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Add 1-2in ease</text><text x="352" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">For a relaxed,</text><text x="352" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">non-clingy fit</text><rect x="24" y="208" width="142" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="226" r="11" fill="#33586B"/><text x="42" y="230" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="230" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Multiply by gauge</text><text x="36" y="252" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stitches per inch</text><text x="36" y="266" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">gives the</text><text x="24" y="350" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The same calculation, scaled to the upper arm, sets the sleeve widths</text><rect x="24" y="372" width="592" height="56" rx="4" fill="#EDE6D9"/><text x="40" y="406" font-family="'Space Mono', monospace" font-size="13.5" font-weight="400" fill="#2A241E" text-anchor="start">bust / 2  +  ease  x  stitches per inch  =  panel width</text><text x="24" y="478" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Because it is built from the wearer&#x27;s measurements rather than a size label, the same</text><text x="24" y="494" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">calculation covers everything from XS to XL without a separate size chart.</text></svg>