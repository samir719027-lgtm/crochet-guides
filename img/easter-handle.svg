<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" width="640" height="464" font-family="'Work Sans', -apple-system, sans-serif"><title>The handle</title><rect width="640" height="464" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The handle</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Fourteen worked, twenty-four chains, fourteen skipped</text><rect x="24.0" y="310" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="310" width="4" height="66" rx="2" fill="#33586B"/><text x="40.0" y="332" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">One piece</text><text x="40.0" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">worked with the basket, so</text><text x="40.0" y="361" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">nothing can come unstitched</text><rect x="228.0" y="310" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="310" width="4" height="66" rx="2" fill="#33586B"/><text x="244.0" y="332" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Two strands</text><text x="244.0" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">hold a second strand just</text><text x="244.0" y="361" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">for the handle rounds</text><rect x="432.0" y="310" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="310" width="4" height="66" rx="2" fill="#33586B"/><text x="448.0" y="332" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Firm it</text><text x="448.0" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">or a second row of sc over</text><text x="448.0" y="361" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the handle</text><text x="24" y="426" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The handle is the bit a child actually grips, so it has to survive being swung, tugged, and</text><text x="24" y="442" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">carried at arm&#x27;s length.</text></svg>