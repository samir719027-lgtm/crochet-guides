<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" width="640" height="468" font-family="'Work Sans', -apple-system, sans-serif"><title>Rows wider or narrower than they should be</title><rect width="640" height="468" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Rows wider or narrower than they should be</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">An extra or a missed stitch, usually at the edge</text><rect x="24.0" y="320" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="320" width="4" height="58" rx="2" fill="#33586B"/><text x="40.0" y="342" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Row 1</text><text x="40.0" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">28 stitches, measure it</text><rect x="228.0" y="320" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="320" width="4" height="58" rx="2" fill="#D8A23C"/><text x="244.0" y="342" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Row 2</text><text x="244.0" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">28 again, or not?</text><rect x="432.0" y="320" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="320" width="4" height="58" rx="2" fill="#A63B4A"/><text x="448.0" y="342" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Row 3</text><text x="448.0" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the drift is now visible</text><text x="24" y="430" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A turning chain that is not supposed to be a stitch is the most common cause of rows that</text><text x="24" y="446" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">quietly creep wider.</text></svg>