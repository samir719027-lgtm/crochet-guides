<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" font-family="'Work Sans', -apple-system, sans-serif"><title>The round that makes it a basket</title><rect width="640" height="404" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The round that makes it a basket</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Back loop only, once</text><path d="M 44 104 L 274 104 L 254 224 L 64 224 Z" fill="#EDE6D9" stroke="#DDD4C6"/><text x="159" y="172" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">base</text><path d="M 64 224 L 254 224 L 262 294 L 56 294 Z" fill="#E4DACB" stroke="#DDD4C6"/><text x="159" y="266" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">wall</text><path d="M 64 224 L 254 224" stroke="#A63B4A" stroke-width="4"/><text x="159" y="216" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">one round, back loop only</text><path d="M 264 224 q 26 8 26 34" fill="none" stroke="#A63B4A" stroke-width="2" stroke-dasharray="4 4"/><text x="298" y="276" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="start">crisp fold</text><path d="M 374 128 L 584 128 L 600 164 L 358 164 Z" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 358 164 L 600 164 L 608 294 L 350 294 Z" fill="#E4DACB" stroke="#DDD4C6"/><text x="479" y="118" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">a doily</text><path d="M 616 226 l 22 0 m -8 -6 l 8 6 -8 6" stroke="#33586B" stroke-width="2" fill="none" stroke-linecap="round"/><text x="479" y="318" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#22404F" text-anchor="middle">a basket</text><text x="24" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">That single back-loop round pushes the wall up and creates the crisp fold where the base</text><text x="24" y="382" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">meets the side.</text></svg>