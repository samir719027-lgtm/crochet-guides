<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="'Work Sans', -apple-system, sans-serif"><title>The ruffle</title><rect width="640" height="430" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The ruffle</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Fullness that cannot compress</text><rect x="24" y="244" width="592" height="28" fill="#33586B"/><text x="34" y="263" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Ruffle</text><text x="170" y="263" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Per stitch</text><text x="346" y="263" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Result</text><rect x="24" y="272" width="592" height="30" fill="#FFFFFF"/><text x="34" y="289" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Fuller</text><text x="170" y="289" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">[3 dc, 1 ch]</text><text x="346" y="289" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">More flare</text><line x1="24" y1="302" x2="616" y2="302" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="302" width="592" height="30" fill="#E4DACB"/><text x="34" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">As written</text><text x="170" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">[2 dc, 1 ch]</text><text x="346" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Roughly double the fullness</text><line x1="24" y1="332" x2="616" y2="332" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="332" width="592" height="30" fill="#FFFFFF"/><text x="34" y="349" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Subtler</text><text x="170" y="349" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">[1 dc, 1 ch]</text><text x="346" y="349" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Less flare</text><line x1="24" y1="362" x2="616" y2="362" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="244" width="592" height="118" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">It is not a separate trim sewn on afterwards: it is built into the fabric by changing the</text><text x="24" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stitch-to-stitch ratio for exactly one round.</text></svg>