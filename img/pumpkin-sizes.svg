<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing: bigger or smaller</title><rect width="640" height="296" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing: bigger or smaller</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The symmetric increase logic from the article</text><ellipse cx="174" cy="170.0" rx="23.400000000000002" ry="26.0" fill="#33586B" opacity="0.85"/><ellipse cx="174" cy="170.0" rx="8.892000000000001" ry="26.0" fill="none" stroke="#EDE6D9" stroke-width="2"/><ellipse cx="174" cy="170.0" rx="23.400000000000002" ry="5.72" fill="none" stroke="#EDE6D9" stroke-width="2"/><rect x="170" y="130" width="8" height="14" rx="3" fill="#22404F"/><text x="174" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">Small</text><text x="174" y="236" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">18 sts</text><ellipse cx="334" cy="163.0" rx="29.7" ry="33.0" fill="#D8A23C" opacity="0.85"/><ellipse cx="334" cy="163.0" rx="11.286" ry="33.0" fill="none" stroke="#EDE6D9" stroke-width="2"/><ellipse cx="334" cy="163.0" rx="29.7" ry="7.26" fill="none" stroke="#EDE6D9" stroke-width="2"/><rect x="330" y="116" width="8" height="14" rx="3" fill="#22404F"/><text x="334" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">As written</text><text x="334" y="236" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">24 sts</text><ellipse cx="494" cy="155.0" rx="36.9" ry="41.0" fill="#A63B4A" opacity="0.85"/><ellipse cx="494" cy="155.0" rx="14.022" ry="41.0" fill="none" stroke="#EDE6D9" stroke-width="2"/><ellipse cx="494" cy="155.0" rx="36.9" ry="9.02" fill="none" stroke="#EDE6D9" stroke-width="2"/><rect x="490" y="100" width="8" height="14" rx="3" fill="#22404F"/><text x="494" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">Large</text><text x="494" y="236" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">30 sts</text><text x="24" y="96" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Same pattern, three stopping points</text><text x="24" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stop increasing at 18, 24, or 30 stitches - keep every added round in back loop only.</text></svg>