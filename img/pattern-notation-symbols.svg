<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" width="640" height="266" font-family="'Work Sans', -apple-system, sans-serif"><title>Reading pattern notation</title><rect width="640" height="266" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Reading pattern notation</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The symbols that show up outside stitch names</text><rect x="24" y="96" width="86" height="30" rx="4" fill="#33586B" opacity="0.12"/><text x="67" y="116" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#33586B" text-anchor="middle">*</text><text x="126" y="116" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">repeat everything inside the asterisk</text><rect x="24" y="134" width="86" height="30" rx="4" fill="#A63B4A" opacity="0.12"/><text x="67" y="154" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#A63B4A" text-anchor="middle">(...)</text><text x="126" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">the stitch count at the end of the row</text><rect x="24" y="172" width="86" height="30" rx="4" fill="#33586B" opacity="0.12"/><text x="67" y="192" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#33586B" text-anchor="middle">[]</text><text x="126" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">a size change, worked once or twice</text><rect x="24" y="210" width="86" height="30" rx="4" fill="#A63B4A" opacity="0.12"/><text x="67" y="230" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#A63B4A" text-anchor="middle">[ ] x 6</text><text x="126" y="230" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">repeat the bracketed part six times</text></svg>