<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 406" width="640" height="406" font-family="'Work Sans', -apple-system, sans-serif"><title>Rounding the top</title><rect width="640" height="406" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Rounding the top</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Same decreases, different spacing</text><rect x="24" y="92" width="284" height="146" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="284" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="116" width="284" height="10" fill="#A63B4A"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">DECREASE ROUNDS BACK TO BACK</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">faster to write, faster to work</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">pulls sharply inward</text><text x="38" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">leaves a pointed tip</text><rect x="332" y="92" width="284" height="146" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="332" y="92" width="284" height="34" rx="4" fill="#33586B"/><rect x="332" y="116" width="284" height="10" fill="#33586B"/><text x="346" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">PLAIN ROUND IN BETWEEN</text><text x="346" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a little more work</text><text x="346" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="346" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">room to curve gradually</text><text x="346" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a rounded, even close</text><path d="M 100 40 L 150 8 L 200 40" fill="none" stroke="#A63B4A" stroke-width="3" stroke-linejoin="round"/><text x="150" y="66" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">pointed</text><path d="M 340 40 Q 390 4 440 40" fill="none" stroke="#33586B" stroke-width="3" stroke-linejoin="round"/><text x="390" y="66" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#33586B" text-anchor="middle">rounded</text><line x1="100" y1="288" x2="200" y2="288" stroke="#DDD4C6" stroke-width="1.2"/><line x1="340" y1="288" x2="440" y2="288" stroke="#DDD4C6" stroke-width="1.2"/><text x="320" y="276" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">where your fingertips actually push</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A pointed top concentrates fingertip pressure into a small area and can feel cramped in an</text><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">otherwise correctly sized mitten. Try it on partway through: a well-paced taper should still</text><text x="24" y="384" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">have a little ease around the fingertips.</text></svg>