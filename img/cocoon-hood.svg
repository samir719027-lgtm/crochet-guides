<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>The hood</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The hood</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A rectangle, folded once and seamed</text><rect x="24.0" y="320" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="320" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="342" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Leave one edge open</text><text x="40.0" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The remaining long edge becomes the opening</text><text x="40.0" y="371" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">sewn to the body</text><rect x="330.0" y="320" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="320" width="4" height="54" rx="2" fill="#33586B"/><text x="346.0" y="342" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Centre it</text><text x="346.0" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Sew that open edge to the neck opening,</text><text x="346.0" y="371" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">centred across the front</text><text x="24" y="404" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The hood is a folded, seamed rectangle rather than a shaped dome. That keeps the</text><text x="24" y="420" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">construction genuinely simple, which is why this works as a first garment.</text></svg>