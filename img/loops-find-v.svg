<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" width="640" height="214" font-family="'Work Sans', -apple-system, sans-serif"><title>Finding the two loops</title><rect width="640" height="214" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Finding the two loops</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The V is the stitch; its two strands are the loops</text><path d="M 84 130 L 96 104 M 108 130 L 96 104" stroke="#33586B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="76" y="132" width="40" height="12" rx="3" fill="#EDE6D9"/><path d="M 180 130 L 192 104 M 204 130 L 192 104" stroke="#33586B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="172" y="132" width="40" height="12" rx="3" fill="#EDE6D9"/><path d="M 276 130 L 288 104 M 300 130 L 288 104" stroke="#33586B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="268" y="132" width="40" height="12" rx="3" fill="#EDE6D9"/><path d="M 372 130 L 384 104 M 396 130 L 384 104" stroke="#33586B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="364" y="132" width="40" height="12" rx="3" fill="#EDE6D9"/><path d="M 468 130 L 480 104 M 492 130 L 480 104" stroke="#33586B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="460" y="132" width="40" height="12" rx="3" fill="#EDE6D9"/><path d="M 564 130 L 576 104 M 588 130 L 576 104" stroke="#33586B" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="556" y="132" width="40" height="12" rx="3" fill="#EDE6D9"/><path d="M 96 96 q 8 -14 116 -26" stroke="#A63B4A" stroke-width="2" fill="none"/><text x="122" y="42" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="start">front loop - nearer you</text><text x="122" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#33586B" text-anchor="start">back loop - tipped back</text><text x="24" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every stitch leaves a chain-like V sitting on top of the row.</text></svg>