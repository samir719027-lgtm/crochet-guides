<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 562" width="640" height="562" font-family="'Work Sans', -apple-system, sans-serif"><title>Ties that stay put</title><rect width="640" height="562" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Ties that stay put</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">About a third of the total width per side</text><rect x="144.0" y="410" width="152" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="144.0" y="410" width="4" height="64" rx="2" fill="#33586B"/><text x="160.0" y="432" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Chain them long</text><text x="160.0" y="448" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">longer than you think</text><text x="160.0" y="461" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">you need</text><rect x="316.0" y="410" width="152" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="316.0" y="410" width="4" height="64" rx="2" fill="#D8A23C"/><text x="332.0" y="432" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Cotton holds a knot</text><text x="332.0" y="448" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">favour it over</text><text x="332.0" y="461" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">slippery yarns</text><rect x="488.0" y="410" width="152" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="488.0" y="410" width="4" height="64" rx="2" fill="#A63B4A"/><text x="504.0" y="432" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">A bandana only works</text><text x="504.0" y="448" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">if it actually stays</text><text x="504.0" y="461" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">on</text><text x="24" y="524" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Sizing is done against your own head rather than a fixed measurement: hold the triangle to</text><text x="24" y="540" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">your forehead and stop when the side points reach roughly the nape.</text></svg>