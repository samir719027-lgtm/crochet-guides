<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" font-family="'Work Sans', -apple-system, sans-serif"><title>BLO and ribbing</title><rect width="640" height="312" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">BLO and ribbing</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The anatomy of a stretchy crochet band</text><rect x="164" y="104" width="120" height="12" rx="3" fill="#E4DACB" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="120" width="120" height="12" rx="3" fill="#33586B" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="136" width="120" height="12" rx="3" fill="#E4DACB" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="152" width="120" height="12" rx="3" fill="#33586B" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="168" width="120" height="12" rx="3" fill="#E4DACB" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="184" width="120" height="12" rx="3" fill="#33586B" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="200" width="120" height="12" rx="3" fill="#E4DACB" stroke="#DDD4C6" stroke-width="1"/><rect x="164" y="216" width="120" height="12" rx="3" fill="#33586B" stroke="#DDD4C6" stroke-width="1"/><text x="224" y="94" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="middle">BLO single crochet, worked back and forth</text><text x="224" y="250" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="middle">the stretchy knit-look band</text><text x="24" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">This is how a beanie gets its snug brim without knitting needles.</text></svg>