<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family="'Work Sans', -apple-system, sans-serif"><title>Where the eyes go</title><rect width="640" height="314" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Where the eyes go</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Small placement choices set the expression</text><circle cx="344" cy="168" r="74" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 309 90 l 4 -26 l 22 14 Z" fill="#E4DACB" stroke="#DDD4C6"/><path d="M 335 90 l 4 -26 l 22 14 Z" fill="#E4DACB" stroke="#DDD4C6"/><circle cx="326" cy="144" r="8" fill="#2A241E"/><circle cx="362" cy="144" r="8" fill="#2A241E"/><circle cx="329" cy="141" r="2.4" fill="#FFFFFF"/><circle cx="365" cy="141" r="2.4" fill="#FFFFFF"/><text x="440" y="148" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#33586B" text-anchor="start">eyes closer = younger</text><circle cx="304" cy="202" r="8" fill="#2A241E"/><circle cx="384" cy="202" r="8" fill="#2A241E"/><circle cx="307" cy="199" r="2.4" fill="#FFFFFF"/><circle cx="387" cy="199" r="2.4" fill="#FFFFFF"/><text x="440" y="206" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="start">eyes wider = alert</text><text x="24" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Placement moves the expression more than the stitch pattern does. Angling the ears forward</text><text x="24" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">softens the face too.</text></svg>