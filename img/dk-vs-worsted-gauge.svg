    <path d="M214 138c9 0 9 -18 18 -18"/><path d="M242 138c9 0 9 -18 18 -18"/>
    <path d="M46 180c9 0 9 -18 18 -18"/><path d="M74 170c9 0 9 -18 18 -18"/>
    <path d="M102 170c9 0 9 -18 18 -18"/><path d="M130 170c9 0 9 -18 18 -18"/>
    <path d="M158 170c9 0 9 -18 18 -18"/><path d="M186 170c9 0 9 -18 18 -18"/>
    <path d="M214 170c9 0 9 -18 18 -18"/><path d="M242 170c9 0 9 -18 18 -18"/>
  </g>
  <text x="40" y="208" font-family="Space Mono, monospace" font-size="13" fill="#A63B4A">14 st &#215; 16 rows</text>
  <text x="40" y="224" font-family="Work Sans, sans-serif" font-size="11.5" fill="#5A5148">Tall, loose, holes show</text>

