  <text x="360" y="208" font-family="Space Mono, monospace" font-size="13" fill="#33586B">20 st &#215; 24 rows</text>
  <text x="360" y="224" font-family="Work Sans, sans-serif" font-size="11.5" fill="#5A5148">Short, firm, dense fabric</text>

  <line x1="24" y1="238" x2="616" y2="238" stroke="#DED5C6" stroke-width="1"/>
  <text x="24" y="262" font-family="Work Sans, sans-serif" font-size="12.5" fill="#5A5148">This is why swapping DK for worsted and keeping the same hook changes the size of</text>
  <text x="24" y="280" font-family="Work Sans, sans-serif" font-size="12.5" font-weight="600" fill="#8C5E08">your finished piece. Swatch before you commit, not after.</text>
</svg>
