<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
  <title id="t">The same yarn weight worked at a different hook gives a different result</title>
  <desc id="d">Two swatches of the same yarn. On the left, a larger hook makes tall loose stitches, so a 14 stitch by 16 row swatch is produced and the fabric drapes but looks holey. On the right, a smaller hook makes short dense stitches, so the same yarn gives a 20 stitch by 24 row swatch and produces a firm dense fabric. Same yarn, different hook, different project size.</desc>
  <rect width="640" height="300" fill="#FBF8F2"/>
  <rect width="640" height="44" fill="#E4DACB"/>
  <text x="24" y="29" font-family="Work Sans, sans-serif" font-size="15.5" font-weight="600" fill="#2A241E">Same yarn. Different hook. Different project.</text>

  <text x="24" y="76" font-family="Space Mono, monospace" font-size="11" fill="#A63B4A">BIGGER HOOK</text>
  <text x="344" y="76" font-family="Space Mono, monospace" font-size="11" fill="#33586B">SMALLER HOOK</text>

  <rect x="24" y="88" width="272" height="128" rx="4" fill="#FFFFFF" stroke="#DED5C6"/>
  <g stroke="#B9AE9C" stroke-width="2.2" fill="none" stroke-linecap="round">
