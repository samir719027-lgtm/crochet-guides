<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Shaping the point</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Shaping the point</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Decrease down one side, not all the way round</text><rect x="330.0" y="176" width="82" height="104" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="176" width="4" height="104" rx="2" fill="#A63B4A"/><text x="346.0" y="198" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Decrease a…</text><text x="346.0" y="214" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">sc2tog</text><text x="346.0" y="227" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">every 4-5</text><rect x="432.0" y="176" width="82" height="104" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="176" width="4" height="104" rx="2" fill="#33586B"/><text x="448.0" y="198" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Keep the f…</text><text x="448.0" y="214" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The</text><text x="448.0" y="227" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">un-decreased</text><rect x="534.0" y="176" width="82" height="104" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="534.0" y="176" width="4" height="104" rx="2" fill="#D8A23C"/><text x="550.0" y="198" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Go in stag…</text><text x="550.0" y="214" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Two or</text><text x="550.0" y="227" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">three</text><text x="24" y="322" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Decreasing evenly all the way around gives a neat little cone that stands up stiffly, which</text><text x="24" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">is right for a gnome and wrong for Santa. The point should finish 4-5 inches long, soft</text><text x="24" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">enough to flop rather than stiff enough to stand.</text></svg>