<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Scaling up or down</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Scaling up or down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Every part changes together, or the proportions drift</text><rect x="24" y="242" width="592" height="28" fill="#33586B"/><text x="34" y="261" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4"></text><text x="182" y="261" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">As written</text><text x="330" y="261" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Bigger</text><text x="478" y="261" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Smaller</text><rect x="24" y="270" width="592" height="26" fill="#FFFFFF"/><text x="34" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Head increase</text><text x="182" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">rounds to 24</text><text x="330" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">+1 round</text><text x="478" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">-1 round</text><line x1="24" y1="296" x2="616" y2="296" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="296" width="592" height="26" fill="#E4DACB"/><text x="34" y="313" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Straight rounds</text><text x="182" y="313" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">5 rounds</text><text x="330" y="313" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">same</text><text x="478" y="313" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">shorten slightly</text><line x1="24" y1="322" x2="616" y2="322" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="322" width="592" height="26" fill="#FFFFFF"/><text x="34" y="339" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Ear increases</text><text x="182" y="339" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">4 rounds to 24</text><text x="330" y="339" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">+1 round</text><text x="478" y="339" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">-1 round</text><line x1="24" y1="348" x2="616" y2="348" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="242" width="592" height="106" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Gauge is not critical on this pattern. The goal is tight, even stitches that keep stuffing</text><text x="24" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">from showing through, so if you can see stuffing between stitches, size your hook down.</text></svg>