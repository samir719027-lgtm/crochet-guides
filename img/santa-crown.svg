<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="'Work Sans', -apple-system, sans-serif"><title>The crown</title><rect width="640" height="440" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The crown</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A circle, then straight rounds to length</text><rect x="248" y="176" width="384" height="28" fill="#33586B"/><text x="258" y="195" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4"></text><text x="314" y="195" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Work</text><text x="546" y="195" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Total</text><rect x="248" y="204" width="384" height="26" fill="#FFFFFF"/><text x="258" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 1</text><text x="314" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">MR, 6 sc</text><text x="546" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">6 sts</text><line x1="248" y1="230" x2="632" y2="230" stroke="#DDD4C6" stroke-width="1"/><rect x="248" y="230" width="384" height="26" fill="#E4DACB"/><text x="258" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 2</text><text x="314" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">2 sc in each st</text><text x="546" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">12 sts</text><line x1="248" y1="256" x2="632" y2="256" stroke="#DDD4C6" stroke-width="1"/><rect x="248" y="256" width="384" height="26" fill="#FFFFFF"/><text x="258" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 3</text><text x="314" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sc, 2 sc in next st</text><text x="546" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">18 sts</text><line x1="248" y1="282" x2="632" y2="282" stroke="#DDD4C6" stroke-width="1"/><rect x="248" y="282" width="384" height="26" fill="#E4DACB"/><text x="258" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 4</text><text x="314" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">2 sc, 2 sc in next st</text><text x="546" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24 sts</text><line x1="248" y1="308" x2="632" y2="308" stroke="#DDD4C6" stroke-width="1"/><rect x="248" y="308" width="384" height="26" fill="#FFFFFF"/><text x="258" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Then</text><text x="314" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">+6 sts per round, one more plain stitch each time</text><text x="546" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">42-48 sts</text><line x1="248" y1="334" x2="632" y2="334" stroke="#DDD4C6" stroke-width="1"/><rect x="248" y="176" width="384" height="158" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Keep increasing until the circle comfortably matches the head circumference, then work</text><text x="24" y="384" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">straight rounds until the hat reaches the length you like. Adults stop at 30-36 sts, roughly</text><text x="24" y="400" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">8-9 inches deep; a child stops earlier, at 5-6 inches.</text></svg>