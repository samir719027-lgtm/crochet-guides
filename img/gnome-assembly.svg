<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576" font-family="'Work Sans', -apple-system, sans-serif"><title>Assembly, in order</title><rect width="640" height="576" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Assembly, in order</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Hat, then beard, then a nose if you want one</text><rect x="300" y="92" width="152" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="110" r="11" fill="#33586B"/><text x="318" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="338" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Hat on</text><text x="312" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">place it on top,</text><text x="312" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">angled if you like,</text><rect x="300" y="198" width="152" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="216" r="11" fill="#33586B"/><text x="318" y="220" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="338" y="220" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Beard on</text><text x="312" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">12-15 cream strands,</text><text x="312" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">4in long, folded and</text><rect x="300" y="304" width="152" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="322" r="11" fill="#33586B"/><text x="318" y="326" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="338" y="326" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Trim</text><text x="312" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">level, or leave it</text><text x="312" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">uneven for a shaggier</text><rect x="300" y="410" width="152" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="428" r="11" fill="#33586B"/><text x="318" y="432" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="338" y="432" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Nose</text><text x="312" y="454" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">optional bead or</text><text x="312" y="468" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">pom-pom between hat</text><text x="24" y="538" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stitch the hat in place around the brim rather than gluing it, so the join takes the</text><text x="24" y="554" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">handling a shelf ornament will get.</text></svg>