<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 538" width="640" height="538" font-family="'Work Sans', -apple-system, sans-serif"><title>Quick shopping checklist</title><rect width="640" height="538" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Quick shopping checklist</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Four things to check on the label</text><rect x="24" y="96" width="142" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#33586B"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Weight</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Worsted #4 or DK #3</text><path d="M 170 131.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="182" y="96" width="142" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="200" cy="114" r="11" fill="#33586B"/><text x="200" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="220" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Ply</text><text x="194" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Plied, not a single</text><text x="194" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">strand</text><path d="M 328 131.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="340" y="96" width="142" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="358" cy="114" r="11" fill="#33586B"/><text x="358" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="378" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Fibre</text><text x="352" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Acrylic or</text><text x="352" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">mercerized cotton</text><rect x="24" y="196" width="142" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="214" r="11" fill="#33586B"/><text x="42" y="218" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="218" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Washing</text><text x="36" y="240" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Machine washable if</text><text x="36" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">a child will handle</text><rect x="24" y="330" width="592" height="118" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="38" y="344" width="13" height="13" rx="2" fill="none" stroke="#33586B" stroke-width="2"/><path d="M 41 351 l 3 4 l 5 -8" fill="none" stroke="#33586B" stroke-width="2" stroke-linecap="round"/><text x="64" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Plied, not single-strand: multiple thin strands twisted together, visible if you</text><text x="64" y="369" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">untwist a short length</text><rect x="38" y="378" width="13" height="13" rx="2" fill="none" stroke="#33586B" stroke-width="2"/><path d="M 41 385 l 3 4 l 5 -8" fill="none" stroke="#33586B" stroke-width="2" stroke-linecap="round"/><text x="64" y="388" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Plied yarn holds its stitch shape better under stuffing pressure, and is less likely</text><text x="64" y="403" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">to split</text><rect x="38" y="412" width="13" height="13" rx="2" fill="none" stroke="#33586B" stroke-width="2"/><path d="M 41 419 l 3 4 l 5 -8" fill="none" stroke="#33586B" stroke-width="2" stroke-linecap="round"/><text x="64" y="422" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Bulky yarn works for larger toys, but hides the fine shaping detail that makes faces</text><text x="64" y="437" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">read clearly</text><text x="24" y="500" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">This works from a shop label alone, which matters when you are standing in a shop trying to</text><text x="24" y="516" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">buy for a project you have not planned in detail.</text></svg>