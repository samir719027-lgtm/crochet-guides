<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="'Work Sans', -apple-system, sans-serif"><title>Abbreviations that never change</title><rect width="640" height="280" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Abbreviations that never change</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The eight you will use in every pattern</text><rect x="24" y="92" width="560" height="28" fill="#33586B"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Abbr.</text><text x="114" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Means</text><text x="314" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Abbr.</text><text x="394" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Means</text><rect x="24" y="120" width="560" height="27" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">ch</text><text x="114" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Chain</text><text x="314" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">inc</text><text x="394" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Increase</text><line x1="24" y1="147" x2="584" y2="147" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="147" width="560" height="27" fill="#E4DACB"/><text x="34" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">st</text><text x="114" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Stitch</text><text x="314" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dec</text><text x="394" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Decrease</text><line x1="24" y1="174" x2="584" y2="174" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="174" width="560" height="27" fill="#FFFFFF"/><text x="34" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">rep</text><text x="114" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Repeat</text><text x="314" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">rnd</text><text x="394" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Round</text><line x1="24" y1="201" x2="584" y2="201" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="201" width="560" height="27" fill="#E4DACB"/><text x="34" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sk</text><text x="114" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Skip</text><text x="314" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sp</text><text x="394" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Space</text><line x1="24" y1="228" x2="584" y2="228" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="560" height="136" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="252" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Same in both systems, so these are safe to memorise once.</text></svg>