<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" font-family="'Work Sans', -apple-system, sans-serif"><title>Which method for which yarn</title><rect width="640" height="276" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Which method for which yarn</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Straight from the article&#x27;s chart</text><rect x="24" y="92" width="580" height="28" fill="#33586B"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Fibre</text><text x="184" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Best method</text><rect x="24" y="120" width="580" height="28" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Wool</text><text x="184" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Wet or spray blocking</text><line x1="24" y1="148" x2="604" y2="148" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="148" width="580" height="28" fill="#E4DACB"/><text x="34" y="165" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Cotton</text><text x="184" y="165" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Wet or spray blocking</text><line x1="24" y1="176" x2="604" y2="176" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="176" width="580" height="28" fill="#FFFFFF"/><text x="34" y="193" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Acrylic</text><text x="184" y="193" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Steam blocking - careful, low heat</text><line x1="24" y1="204" x2="604" y2="204" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="204" width="580" height="28" fill="#E4DACB"/><text x="34" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Blends</text><text x="184" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Test a swatch first</text><line x1="24" y1="232" x2="604" y2="232" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="580" height="140" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The method follows the fibre, not the pattern.</text></svg>