<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" width="640" height="246" font-family="'Work Sans', -apple-system, sans-serif"><title>Attaching and shaping the beard</title><rect width="640" height="246" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Attaching and shaping the beard</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Twelve to fifteen strands, spaced and curved</text><rect x="260.0" y="110" width="105" height="72" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="260.0" y="110" width="4" height="72" rx="2" fill="#33586B"/><text x="276.0" y="132" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Fold each in h…</text><text x="276.0" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">then a lark&#x27;s</text><text x="276.0" y="161" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">head knot</text><rect x="385.3333333333333" y="110" width="105" height="72" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="385.3333333333333" y="110" width="4" height="72" rx="2" fill="#33586B"/><text x="401.3333333333333" y="132" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Space them out</text><text x="401.3333333333333" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">evenly across</text><text x="401.3333333333333" y="161" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the front,</text><rect x="510.66666666666663" y="110" width="105" height="72" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="510.66666666666663" y="110" width="4" height="72" rx="2" fill="#33586B"/><text x="526.6666666666666" y="132" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Trim to a curve</text><text x="526.6666666666666" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">longest at</text><text x="526.6666666666666" y="161" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the chin, so</text><text x="24" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">If a strand sits too high or pokes out, pull it down and re-trim. Loose strands are</text><text x="24" y="224" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">forgiving in a way that crochet is not.</text></svg>