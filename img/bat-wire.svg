<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Work Sans', -apple-system, sans-serif"><title>Wiring and attaching</title><rect width="640" height="400" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Wiring and attaching</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Six steps from fold to trim</text><rect x="24" y="92" width="190" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="110" r="11" fill="#33586B"/><text x="42" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Fold and weave</text><text x="36" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Fold a pipe cleaner in</text><text x="36" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">half, weave it in and out</text><path d="M 218 130.0 h 0 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="226" y="92" width="190" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="244" cy="110" r="11" fill="#33586B"/><text x="244" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="264" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Catch every stitch</text><text x="238" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Or every other one; long</text><text x="238" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">gaps let it shift or poke</text><rect x="24" y="198" width="190" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="216" r="11" fill="#33586B"/><text x="42" y="220" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="62" y="220" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Bend to shape</text><text x="36" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Curve the unattached wing</text><text x="36" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">outward before it goes near</text><path d="M 218 236.0 h 0 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="226" y="198" width="190" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="244" cy="216" r="11" fill="#33586B"/><text x="244" y="220" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="264" y="220" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Sew widely</text><text x="238" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Several rows down from the</text><text x="238" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">top edge, not one or two</text><rect x="24" y="304" width="190" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="322" r="11" fill="#33586B"/><text x="42" y="326" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="62" y="326" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Pin and compare</text><text x="36" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Use the body&#x27;s centre seam</text><text x="36" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">as a straight reference</text><path d="M 218 342.0 h 0 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="226" y="304" width="190" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="244" cy="322" r="11" fill="#33586B"/><text x="244" y="326" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="264" y="326" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Trim the wire</text><text x="238" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Snip any ends that poke</text><text x="238" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">past the wing edge</text><text x="24" y="342" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The wire holds the wing&#x27;s own shape but does not reinforce a weak attachment point. A wing</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">sewn on at a single stitch will still droop under its own weight.</text></svg>