<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Why cotton matters here</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why cotton matters here</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Drape works against this style</text><rect x="24.0" y="260" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="260" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="282" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Go down a hook size</text><text x="40.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Cotton&#x27;s lack of stretch means loose stitches</text><text x="40.0" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">stay loose rather than settling in</text><rect x="330.0" y="260" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="260" width="4" height="54" rx="2" fill="#33586B"/><text x="346.0" y="282" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Swatch and hold it up</text><text x="346.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Mostly flat and rigid when held horizontally</text><text x="346.0" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">is a good sign for the full brim</text><text x="24" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A droopy acrylic bucket hat completely defeats the point of the style. A swatch that flops</text><text x="24" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">immediately is worth reconsidering before committing 200+ yards.</text></svg>