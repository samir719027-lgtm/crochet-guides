<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" width="640" height="482" font-family="'Work Sans', -apple-system, sans-serif"><title>Yarn for a textured stitch</title><rect width="640" height="482" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Yarn for a textured stitch</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Smooth and solid shows it best</text><rect x="24.0" y="316" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="117.33333333333333" y="350" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#33586B" text-anchor="middle">13 dc</text><text x="117.33333333333333" y="370" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">over 10 rows, 4in</text><rect x="226.66666666666666" y="316" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="320.0" y="350" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#D8A23C" text-anchor="middle">5.5mm</text><text x="320.0" y="370" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">hook, worsted</text><rect x="429.3333333333333" y="316" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="522.6666666666666" y="350" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#A63B4A" text-anchor="middle">15-20%</text><text x="522.6666666666666" y="370" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">more yarn than plain dc</text><text x="24" y="444" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Front-post stitches wrap further around each post than a stitch worked into the top of a</text><text x="24" y="460" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">row, so the raised texture pulls in slightly more fabric per row.</text></svg>