<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" font-family="'Work Sans', -apple-system, sans-serif"><title>A weighted base</title><rect width="640" height="296" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">A weighted base</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Why the tree stands and how to add weight</text><path d="M 344 126 L 444 212 L 244 212 Z" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="292" y="190" width="104" height="22" rx="6" fill="#D8A23C" opacity="0.85" stroke="#DDD4C6"/><text x="344" y="201" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">rice / pellets</text><line x1="240" y1="212" x2="448" y2="212" stroke="#22404F" stroke-width="4"/><text x="344" y="112" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">stuff firmly above</text><text x="344" y="232" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#22404F" text-anchor="middle">flat, firm underside</text><text x="24" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A small fabric bag of rice at the very bottom keeps the cone upright.</text></svg>