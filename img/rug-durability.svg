<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Work Sans', -apple-system, sans-serif"><title>Durability underfoot</title><rect width="640" height="520" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Durability underfoot</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Fiber choice beats stitch choice</text><rect x="24.0" y="268" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="268" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="290" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Tape strips even</text><text x="40.0" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Roughly 1-1.5in wide, and stretch each one</text><text x="40.0" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">flat before winding</text><rect x="330.0" y="268" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="268" width="4" height="54" rx="2" fill="#33586B"/><text x="346.0" y="290" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Heathered tones</text><text x="346.0" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Several similar shades hide width</text><text x="346.0" y="319" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">inconsistencies better than one perfect</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Cutting the strips to a consistent width matters more for a smooth, even texture than the</text><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">exact fabric type, since most cotton knit curls at the edges when cut.</text></svg>