<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458" font-family="'Work Sans', -apple-system, sans-serif"><title>Safety eyes or embroidered</title><rect width="640" height="458" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Safety eyes or embroidered</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Decide before you start the head</text><rect x="24" y="258" width="176" height="140" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="258" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="24" y="280" width="176" height="8" fill="#D8A23C"/><text x="112.0" y="278" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">OLDER CHILD</text><text x="36" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">safety eyes are the</text><text x="36" y="321" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">faster option and give</text><text x="36" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">a slightly more</text><text x="36" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">polished, glossy look</text><rect x="216" y="258" width="176" height="140" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="258" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="280" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="278" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">COLLECTOR OR DECOR</text><text x="228" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">same, and worth the</text><text x="228" y="321" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">crisp finish where the</text><text x="228" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">piece will not be</text><text x="228" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">handled by small hands</text><rect x="408" y="258" width="176" height="140" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="258" width="176" height="30" rx="4" fill="#33586B"/><rect x="408" y="280" width="176" height="8" fill="#33586B"/><text x="496.0" y="278" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">UNDER 3</text><text x="420" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">embroider instead, and</text><text x="420" y="321" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">nothing small can come</text><text x="420" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">loose. The expression</text><text x="420" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">changes only slightly</text><text x="24" y="420" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Tighter gauge helps here: a fabric that feels loose will let the stuffing show through, and</text><text x="24" y="436" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">dropping down half a hook size is the fix.</text></svg>