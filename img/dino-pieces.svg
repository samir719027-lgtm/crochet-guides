<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="'Work Sans', -apple-system, sans-serif"><title>Nine pieces, two colours</title><rect width="640" height="340" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Nine pieces, two colours</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Only the cream parts stay flat</text><rect x="24" y="92" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="176" height="8" fill="#33586B"/><text x="112.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HEAD</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">green, rounds 1-12</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 to 24 sts</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuffed firmly</text><rect x="216" y="92" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="92" width="176" height="30" rx="4" fill="#33586B"/><rect x="216" y="114" width="176" height="8" fill="#33586B"/><text x="304.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BODY</text><text x="228" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">green, rounds 1-15</text><text x="228" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">24 sts for 8</text><text x="228" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuffed firmly</text><rect x="408" y="92" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="92" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="408" y="114" width="176" height="8" fill="#D8A23C"/><text x="496.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BELLY PATCH</text><text x="420" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">cream, flat oval</text><text x="420" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 to 24 sts</text><text x="420" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">unstuffed</text><rect x="24" y="222" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="222" width="176" height="30" rx="4" fill="#22404F"/><rect x="24" y="244" width="176" height="8" fill="#22404F"/><text x="112.0" y="242" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">TAIL</text><text x="36" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">green, tapered</text><text x="36" y="285" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 sts, 6 rounds</text><text x="36" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuffed lightly</text><rect x="216" y="222" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="222" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="216" y="244" width="176" height="8" fill="#A63B4A"/><text x="304.0" y="242" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SPIKES x6</text><text x="228" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">cream, 3 flat rows</text><text x="228" y="285" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">4 to 2 sts</text><text x="228" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">unstuffed</text><rect x="408" y="222" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="222" width="176" height="30" rx="4" fill="#22404F"/><rect x="408" y="244" width="176" height="8" fill="#22404F"/><text x="496.0" y="242" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">LEGS x4</text><text x="420" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">green, 3 rounds</text><text x="420" y="285" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 sts</text><text x="420" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuffed lightly</text><text x="24" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The two cream parts are the only ones worked flat and left unstuffed. Every green piece is</text><text x="24" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">worked in continuous rounds and stuffed, which is what gives the body its shape.</text></svg>