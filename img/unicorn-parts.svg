<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" font-family="'Work Sans', -apple-system, sans-serif"><title>Every piece before assembly</title><rect width="640" height="394" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Every piece before assembly</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Five crocheted parts, plus fringe for mane and tail</text><rect x="24" y="92" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="176" height="8" fill="#33586B"/><text x="112.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HEAD</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6, 12, 18, 24</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">5 even rounds</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">down to 6</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff firmly</text><rect x="216" y="92" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="92" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="114" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BODY</text><text x="228" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">to 18 sts</text><text x="228" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">3 even rounds</text><text x="228" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">down to 6</text><text x="228" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff firmly</text><rect x="408" y="92" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="92" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="408" y="114" width="176" height="8" fill="#A63B4A"/><text x="496.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HORN</text><text x="420" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">magic ring 4</text><text x="420" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tapered over 5</text><text x="420" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff to the point</text><text x="420" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">very firmly</text><rect x="24" y="222" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="222" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="244" width="176" height="8" fill="#33586B"/><text x="112.0" y="242" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">2 EARS</text><text x="36" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">magic ring 5</text><text x="36" y="285" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">pinch flat</text><text x="36" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">unstuffed</text><text x="36" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><rect x="216" y="222" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="222" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="244" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="242" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">4 LEGS</text><text x="228" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">magic ring 5</text><text x="228" y="285" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">3 rounds, then tan</text><text x="228" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff lightly</text><text x="228" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><rect x="408" y="222" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="222" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="408" y="244" width="176" height="8" fill="#A63B4A"/><text x="496.0" y="242" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">MANE, TAIL</text><text x="420" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">not crocheted</text><text x="420" y="285" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">cut yarn fringe</text><text x="420" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">knotted through</text><text x="420" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the fabric</text><text x="24" y="356" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every crocheted piece is finished and fastened off before any of them are sewn on, so the</text><text x="24" y="372" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">head, body, horn, ears and legs can all be checked against each other on the table first.</text></svg>