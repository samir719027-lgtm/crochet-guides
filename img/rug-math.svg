<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" width="640" height="570" font-family="'Work Sans', -apple-system, sans-serif"><title>Jumbo yarn needs different math</title><rect width="640" height="570" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Jumbo yarn needs different math</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Roughly half the standard increase count</text><rect x="24" y="330" width="592" height="28" fill="#33586B"/><text x="34" y="349" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Round</text><text x="106" y="349" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Repeat around</text><text x="282" y="349" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Total</text><text x="354" y="349" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">New stitches</text><rect x="24" y="358" width="592" height="26" fill="#FFFFFF"/><text x="34" y="375" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 2</text><text x="106" y="375" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">inc in every st</text><text x="282" y="375" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">12</text><text x="354" y="375" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">same on any weight</text><line x1="24" y1="384" x2="616" y2="384" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="384" width="592" height="26" fill="#E4DACB"/><text x="34" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 3</text><text x="106" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sc 3, inc</text><text x="282" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">15</text><text x="354" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">3 new, not 6</text><line x1="24" y1="410" x2="616" y2="410" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="410" width="592" height="26" fill="#FFFFFF"/><text x="34" y="427" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 4</text><text x="106" y="427" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sc 4, inc</text><text x="282" y="427" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">18</text><text x="354" y="427" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">4 new</text><line x1="24" y1="436" x2="616" y2="436" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="436" width="592" height="26" fill="#E4DACB"/><text x="34" y="453" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 5</text><text x="106" y="453" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sc 5, inc</text><text x="282" y="453" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">21</text><text x="354" y="453" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">5 new</text><line x1="24" y1="462" x2="616" y2="462" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="462" width="592" height="26" fill="#FFFFFF"/><text x="34" y="479" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rnd 6</text><text x="106" y="479" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sc 6, inc</text><text x="282" y="479" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="354" y="479" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">6 new</text><line x1="24" y1="488" x2="616" y2="488" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="330" width="592" height="158" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="522" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Keep adding 1 more plain stitch between increases each round, and check flatness every 2-3</text><text x="24" y="538" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rounds. The first two rounds always use the standard rate: the centre of any flat circle</text><text x="24" y="554" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">needs the same starting proportions however thick the fibre.</text></svg>