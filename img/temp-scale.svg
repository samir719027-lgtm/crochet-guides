<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Choosing a colour scale</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Choosing a colour scale</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">8 to 12 bands, written down first</text><rect x="24" y="92" width="26" height="26" rx="3" fill="#4B3A6B"/><text x="62" y="110" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Below 20F</text><text x="190" y="110" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">deep purple</text><rect x="330" y="98" width="198" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="128" width="26" height="26" rx="3" fill="#2E4A7D"/><text x="62" y="146" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">20-29F</text><text x="190" y="146" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">navy blue</text><rect x="330" y="134" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="164" width="26" height="26" rx="3" fill="#3A72B8"/><text x="62" y="182" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">30-39F</text><text x="190" y="182" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">medium blue</text><rect x="330" y="170" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="200" width="26" height="26" rx="3" fill="#2E7D8C"/><text x="62" y="218" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">40-49F</text><text x="190" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">teal</text><rect x="330" y="206" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="236" width="26" height="26" rx="3" fill="#4E8C4A"/><text x="62" y="254" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">50-59F</text><text x="190" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">green</text><rect x="330" y="242" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="272" width="26" height="26" rx="3" fill="#7FA83C"/><text x="62" y="290" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">60-69F</text><text x="190" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">yellow-green</text><rect x="330" y="278" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="308" width="26" height="26" rx="3" fill="#C9B23C"/><text x="62" y="326" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">70-79F</text><text x="190" y="326" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">yellow</text><rect x="330" y="314" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="344" width="26" height="26" rx="3" fill="#D08A38"/><text x="62" y="362" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">80-89F</text><text x="190" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">orange</text><rect x="330" y="350" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><rect x="24" y="380" width="26" height="26" rx="3" fill="#B04A42"/><text x="62" y="398" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">90F and above</text><text x="190" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">red</text><rect x="330" y="386" width="176" height="14" rx="2" fill="#DDD4C6" opacity="0.5"/><text x="24" y="436" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Divide your area&#x27;s typical range into 8 to 12 bands of roughly equal</text><text x="24" y="452" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">size. This example spans 20F to 95F in nine bands.</text></svg>