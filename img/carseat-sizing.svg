<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing for your seat</title><rect width="640" height="520" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing for your seat</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Extra rows keep the slots in proportion</text><rect x="24" y="266" width="592" height="28" fill="#33586B"/><text x="34" y="285" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Seat stage</text><text x="210" y="285" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What it assumes</text><rect x="24" y="294" width="592" height="26" fill="#FFFFFF"/><text x="34" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rear-facing infant</text><text x="210" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">newborn to 9-12 months, harness sits low, seat shell narrowest</text><line x1="24" y1="320" x2="616" y2="320" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="320" width="592" height="26" fill="#E4DACB"/><text x="34" y="337" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Convertible</text><text x="210" y="337" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">a wider harness spread, kept in proportion by the extra rows</text><line x1="24" y1="346" x2="616" y2="346" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="346" width="592" height="26" fill="#FFFFFF"/><text x="34" y="363" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Not included</text><text x="210" y="363" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">a full-size crib blanket, which is a different project entirely</text><line x1="24" y1="372" x2="616" y2="372" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="266" width="592" height="106" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">There is no single correct size here the way there is with a fitted garment. The fitting</text><text x="24" y="424" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">check against your own seat matters more than hitting an exact age-range number.</text></svg>