<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" font-family="'Work Sans', -apple-system, sans-serif"><title>The seasonal queue</title><rect width="640" height="370" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The seasonal queue</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Grouped by lead time</text><rect x="24" y="92" width="296" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="296" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="114" width="296" height="8" fill="#A63B4A"/><text x="172.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BIG: START IN EARLY FALL</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Chunky crochet throw</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Poncho</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Both take several solid</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">evenings of work</text><rect x="336" y="92" width="296" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="336" y="92" width="296" height="30" rx="4" fill="#33586B"/><rect x="336" y="114" width="296" height="8" fill="#33586B"/><text x="484.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SMALL: 1-2 WEEKS&#x27; LEAD</text><text x="348" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Beanie</text><text x="348" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Cowl</text><text x="348" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Fingerless gloves</text><text x="348" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Mug cozy</text><rect x="24" y="240" width="296" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="240" width="296" height="30" rx="4" fill="#D8A23C"/><rect x="24" y="262" width="296" height="8" fill="#D8A23C"/><text x="172.0" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">RUNS THE FULL YEAR</text><text x="36" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Temperature blanket</text><text x="36" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">One row per day, 365 rows,</text><text x="36" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">not a project you finish</text><text x="36" y="333" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">quickly however you start it</text><rect x="336" y="240" width="296" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="336" y="240" width="296" height="30" rx="4" fill="#22404F"/><rect x="336" y="262" width="296" height="8" fill="#22404F"/><text x="484.0" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">QUICK DECOR</text><text x="348" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Fall pumpkin</text><text x="348" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Small enough for a whole</text><text x="348" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">harvest in an afternoon,</text><text x="348" y="333" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">easy to scale up or down</text><text x="24" y="310" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Batching similar projects is faster per item than switching between patterns, since you stay</text><text x="24" y="326" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">in the same rhythm and do not relearn a stitch pattern each time you sit down.</text></svg>