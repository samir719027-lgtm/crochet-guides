<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="'Work Sans', -apple-system, sans-serif"><title>Gauge</title><rect width="640" height="390" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Gauge</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">14 sc and 16 rows to 4in with a 5.0mm hook</text><rect x="344.0" y="96" width="88" height="68" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="344.0" y="96" width="4" height="68" rx="2" fill="#33586B"/><text x="360.0" y="118" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">14 sc</text><text x="360.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">across,</text><text x="360.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">over 16</text><rect x="448.0" y="96" width="88" height="68" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="448.0" y="96" width="4" height="68" rx="2" fill="#33586B"/><text x="464.0" y="118" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">5.0mm hook</text><text x="464.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">with</text><text x="464.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">worsted</text><rect x="552.0" y="96" width="88" height="68" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="552.0" y="96" width="4" height="68" rx="2" fill="#33586B"/><text x="568.0" y="118" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Warm enough</text><text x="568.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">single</text><text x="568.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">crochet is</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Fit depends more on gauge at this size than in an adult beanie, and single crochet produces</text><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">a tightly-worked fabric that blocks wind well.</text></svg>