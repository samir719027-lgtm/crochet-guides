<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" font-family="'Work Sans', -apple-system, sans-serif"><title>Three edgings, side by side</title><rect width="640" height="348" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Three edgings, side by side</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Speed and simplicity against decoration</text><rect x="24" y="108" width="176" height="164" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="108" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="130" width="176" height="8" fill="#33586B"/><text x="112" y="128" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SIMPLE SC</text><line x1="40" y1="238" x2="184" y2="238" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><line x1="48" y1="238" x2="48" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="66" y1="238" x2="66" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="84" y1="238" x2="84" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="102" y1="238" x2="102" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="120" y1="238" x2="120" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="138" y1="238" x2="138" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="156" y1="238" x2="156" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="174" y1="238" x2="174" y2="216" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><text x="112" y="260" font-family="'Work Sans', -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">one sc per stitch</text><rect x="224" y="108" width="176" height="164" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="108" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="224" y="130" width="176" height="8" fill="#D8A23C"/><text x="312" y="128" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">PICOT</text><line x1="240" y1="238" x2="384" y2="238" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><path d="M 254 238 v -14 q 0 -12 9 -12 q 9 0 9 12 v 14" fill="none" stroke="#D8A23C" stroke-width="3"/><path d="M 286 238 v -14 q 0 -12 9 -12 q 9 0 9 12 v 14" fill="none" stroke="#D8A23C" stroke-width="3"/><path d="M 318 238 v -14 q 0 -12 9 -12 q 9 0 9 12 v 14" fill="none" stroke="#D8A23C" stroke-width="3"/><path d="M 350 238 v -14 q 0 -12 9 -12 q 9 0 9 12 v 14" fill="none" stroke="#D8A23C" stroke-width="3"/><path d="M 382 238 v -14 q 0 -12 9 -12 q 9 0 9 12 v 14" fill="none" stroke="#D8A23C" stroke-width="3"/><text x="312" y="260" font-family="'Work Sans', -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">tighter = lacier</text><rect x="424" y="108" width="176" height="164" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="108" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="424" y="130" width="176" height="8" fill="#A63B4A"/><text x="512" y="128" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SHELL</text><line x1="440" y1="238" x2="584" y2="238" stroke="#E4DACB" stroke-width="12" stroke-linecap="round"/><path d="M 458 238 v -10" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 447 228 q 11 8 22 0" fill="none" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 494 238 v -10" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 483 228 q 11 8 22 0" fill="none" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 530 238 v -10" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 519 228 q 11 8 22 0" fill="none" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 566 238 v -10" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 555 228 q 11 8 22 0" fill="none" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><text x="512" y="260" font-family="'Work Sans', -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">fans out at the edge</text><text x="24" y="310" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Simple single crochet is the fastest and most forgiving. Picot and shell need a repeat that</text><text x="24" y="326" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">divides your stitch count.</text></svg>