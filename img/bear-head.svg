<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" font-family="'Work Sans', -apple-system, sans-serif"><title>The head in three rounds</title><rect width="640" height="376" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The head in three rounds</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">6, then 12, then 18</text><circle cx="344" cy="168" r="72" fill="#E4DACB" stroke="#DDD4C6"/><circle cx="344" cy="168" r="52" fill="#EDE6D9" stroke="#DDD4C6"/><circle cx="344" cy="168" r="32" fill="#D8A23C" stroke="#DDD4C6"/><text x="424" y="108" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">18</text><text x="404" y="128" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">12</text><text x="384" y="146" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">6</text><text x="48" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#22404F" text-anchor="start">Magic ring 6 sc</text><text x="48" y="278" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#22404F" text-anchor="start">inc around = 12</text><text x="48" y="296" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#22404F" text-anchor="start">[sc 1, inc] = 18</text><text x="24" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Three rounds of increase and the head shape is already there; everything after is ears,</text><text x="24" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">muzzle, and arms.</text></svg>