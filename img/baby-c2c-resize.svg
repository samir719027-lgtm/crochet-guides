<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" width="640" height="362" font-family="'Work Sans', -apple-system, sans-serif"><title>Resizing is arithmetic</title><rect width="640" height="362" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Resizing is arithmetic</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Seven blocks is four inches</text><rect x="24.0" y="244" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="244" width="4" height="58" rx="2" fill="#33586B"/><text x="40.0" y="266" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Each block</text><text x="40.0" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">adds a little over half an</text><text x="40.0" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">inch to both dimensions</text><rect x="228.0" y="244" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="244" width="4" height="58" rx="2" fill="#33586B"/><text x="244.0" y="266" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">For a rectangle</text><text x="244.0" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">increase to the target</text><text x="244.0" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">width, then work straight</text><rect x="432.0" y="244" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="244" width="4" height="58" rx="2" fill="#33586B"/><text x="448.0" y="266" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Match the weights</text><text x="448.0" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">mismatched weights distort</text><text x="448.0" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the block size and the</text><text x="24" y="324" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Counting blocks per row against the pattern regularly is what catches an error, since a C2C</text><text x="24" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">piece grows in a very visible, countable way.</text></svg>