<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="'Work Sans', -apple-system, sans-serif"><title>The hook difference</title><rect width="640" height="310" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The hook difference</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The first thing you notice in the hand</text><rect x="24" y="110" width="592" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="110" y="138" width="150" height="16" rx="8" fill="#33586B"/><circle cx="102" cy="146" r="8" fill="#33586B"/><path d="M 104 135 q 12 -4 7 10" fill="none" stroke="#33586B" stroke-width="2"/><rect x="190" y="156" width="24" height="10" rx="4" fill="#22404F"/><text x="300" y="150" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">REGULAR HOOK</text><text x="300" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One standard hook, about six inches</text><rect x="24" y="204" width="592" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="110" y="232" width="330" height="16" rx="8" fill="#A63B4A"/><circle cx="102" cy="240" r="8" fill="#A63B4A"/><path d="M 104 229 q 12 -4 7 10" fill="none" stroke="#A63B4A" stroke-width="2"/><circle cx="444" cy="240" r="6" fill="#A63B4A"/><text x="300" y="244" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">TUNISIAN HOOK</text><text x="300" y="262" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Long shaft, solid or cabled, no flat thumb rest</text></svg>