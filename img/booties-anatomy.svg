<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="'Work Sans', -apple-system, sans-serif"><title>Bootie anatomy</title><rect width="640" height="280" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Bootie anatomy</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Where the sole ends and the sides begin</text><ellipse cx="234" cy="210" rx="110" ry="34" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 124 176 a 110 34 0 0 1 220 0 a 110 34 0 0 1 -220 0 Z" fill="none"/><path d="M 148 192 a 110 34 0 0 1 172 0 L 316 146 a 110 34 0 0 0 -168 0 Z" fill="#E4DACB" stroke="#DDD4C6"/><path d="M 146 154 a 88 24 0 0 0 176 0" fill="none" stroke="#22404F" stroke-width="4"/><text x="234" y="138" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#22404F" text-anchor="middle">top opening - snug</text><text x="82" y="216" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="end">sole (oval)</text><text x="376" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">sides rnds 4-9</text><text x="24" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Sole, six plain side rounds, then a snug top opening.</text></svg>