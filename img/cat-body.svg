<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" width="640" height="308" font-family="'Work Sans', -apple-system, sans-serif"><title>The cat body</title><rect width="640" height="308" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The cat body</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Grow, hold, then close - the amigurumi base shape</text><ellipse cx="344" cy="168" rx="86" ry="72" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 282 116 l -6 -34 l 30 16 Z" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 406 116 l 6 -34 l -30 16 Z" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 428 184 C 472 178 472 138 444 134" fill="none" stroke="#A63B4A" stroke-width="9" stroke-linecap="round"/><line x1="258" y1="160" x2="430" y2="160" stroke="#33586B" stroke-width="2" opacity="0.55"/><text x="344" y="152" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#22404F" text-anchor="middle">grow 6 to 18</text><text x="344" y="198" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">hold at 18, rnds 4-7</text><text x="344" y="244" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#A63B4A" text-anchor="middle">then close back to 12</text><text x="24" y="286" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stuffing goes in before the opening gets too small to reach.</text></svg>