<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" font-family="'Work Sans', -apple-system, sans-serif"><title>How a safety eye works</title><rect width="640" height="284" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How a safety eye works</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two parts: the eye and its locking washer</text><rect x="214" y="150" width="260" height="24" fill="#EDE6D9" stroke="#DDD4C6"/><text x="222" y="196" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">fabric</text><circle cx="304" cy="162" r="22" fill="#2A241E"/><circle cx="296" cy="156" r="5" fill="#FFFFFF"/><rect x="326" y="157" width="60" height="10" fill="#A63B4A"/><rect x="346" y="154" width="4" height="16" fill="#A63B4A"/><rect x="357" y="154" width="4" height="16" fill="#A63B4A"/><rect x="368" y="154" width="4" height="16" fill="#A63B4A"/><rect x="379" y="154" width="4" height="16" fill="#A63B4A"/><rect x="390" y="154" width="4" height="16" fill="#A63B4A"/><rect x="400" y="144" width="14" height="36" rx="3" fill="#D8A23C"/><text x="274" y="122" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="start">eye</text><text x="340" y="198" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#A63B4A" text-anchor="middle">post with ridges</text><text x="384" y="122" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="start">backing</text><text x="384" y="218" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">presses on from inside</text><text x="24" y="262" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The backing locks onto the post&#x27;s ridges and cannot be pulled back off once seated.</text></svg>