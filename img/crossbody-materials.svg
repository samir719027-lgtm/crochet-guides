<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" width="640" height="294" font-family="'Work Sans', -apple-system, sans-serif"><title>What you need</title><rect width="640" height="294" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">What you need</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The materials list, explained</text><rect x="24" y="92" width="580" height="28" fill="#22404F"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Item</text><text x="234" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Why</text><rect x="24" y="120" width="580" height="26" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Worsted / #4 yarn</text><text x="234" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Cotton or blend, in 1-2 colours</text><line x1="24" y1="146" x2="604" y2="146" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="146" width="580" height="26" fill="#E4DACB"/><text x="34" y="163" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">5mm hook</text><text x="234" y="163" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Matches worsted weight</text><line x1="24" y1="172" x2="604" y2="172" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="172" width="580" height="26" fill="#FFFFFF"/><text x="34" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Yarn needle</text><text x="234" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Seaming and weaving ends</text><line x1="24" y1="198" x2="604" y2="198" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="198" width="580" height="26" fill="#E4DACB"/><text x="34" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Stitch markers</text><text x="234" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Keeping the row count</text><line x1="24" y1="224" x2="604" y2="224" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="224" width="580" height="26" fill="#FFFFFF"/><text x="34" y="241" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Optional</text><text x="234" y="241" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Magnetic snap or button, lining</text><line x1="24" y1="250" x2="604" y2="250" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="580" height="158" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A ball of cotton and one evening covers almost all of it.</text></svg>