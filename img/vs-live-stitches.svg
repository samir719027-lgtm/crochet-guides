<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Work Sans', -apple-system, sans-serif"><title>One loop, or a whole row</title><rect width="640" height="360" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">One loop, or a whole row</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">How many stitches are live while you work</text><rect x="24" y="104" width="280" height="196" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="104" width="280" height="34" rx="4" fill="#33586B"/><rect x="24" y="128" width="280" height="10" fill="#33586B"/><text x="38" y="127" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">CROCHET</text><path d="M 64 254 L 148 254" stroke="#E4DACB" stroke-width="9" stroke-linecap="round"/><path d="M 180 254 L 264 254" stroke="#E4DACB" stroke-width="9" stroke-linecap="round"/><circle cx="174" cy="254" r="15" fill="#33586B"/><path d="M 174 234 v -22" stroke="#33586B" stroke-width="4"/><text x="174" y="216" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#22404F" text-anchor="middle">one live loop</text><text x="48" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Put it down and nothing else</text><text x="48" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">can unravel while you are away.</text><rect x="328" y="104" width="280" height="196" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="104" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="328" y="128" width="280" height="10" fill="#A63B4A"/><text x="342" y="127" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">KNITTING</text><path d="M 362 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 353 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 383 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 374 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 404 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 395 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 425 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 416 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 446 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 437 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 467 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 458 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 488 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 479 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 509 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 500 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 530 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 521 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 551 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 542 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><path d="M 572 200 v 44" stroke="#DDD4C6" stroke-width="2.5"/><path d="M 563 244 q 9 16 18 0" fill="none" stroke="#A63B4A" stroke-width="3"/><line x1="348" y1="200" x2="582" y2="200" stroke="#DDD4C6" stroke-width="2.5"/><line x1="348" y1="244" x2="582" y2="244" stroke="#DDD4C6" stroke-width="2.5"/><circle cx="466" cy="244" r="8" fill="#FFFFFF" stroke="#A63B4A" stroke-width="3"/><text x="468" y="276" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="middle">a whole row, live</text><text x="352" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">One dropped stitch runs several</text><text x="352" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rows before you notice it.</text><text x="24" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">This one difference is the core reason crochet is usually the easier craft to start.</text></svg>