<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="'Work Sans', -apple-system, sans-serif"><title>Common mistakes</title><rect width="640" height="290" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Common mistakes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">What a pumpkin &#x27;going wrong&#x27; actually looks like</text><rect x="24" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="118" width="176" height="8" fill="#A63B4A"/><text x="112.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Plain ball</text><text x="36" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">BLO rounds got</text><text x="36" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">skipped or worked</text><text x="36" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">into both loops.</text><text x="36" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Fix: recheck</text><text x="36" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rounds 4-9.</text><rect x="216" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="96" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="118" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Faint ridges</text><text x="228" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Tension too loose</text><text x="228" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">on the BLO rows.</text><text x="228" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Fix: drop a hook</text><text x="228" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">size for the</text><text x="228" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">body only.</text><rect x="408" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="96" width="176" height="30" rx="4" fill="#33586B"/><rect x="408" y="118" width="176" height="8" fill="#33586B"/><text x="496.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Stuffing shows</text><text x="420" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Stitches too open.</text><text x="420" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Fix: a hook a</text><text x="420" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">size smaller</text><text x="420" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tightens the</text><text x="420" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">grooves.</text><text x="24" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Three quick checks before you add stuffing.</text></svg>