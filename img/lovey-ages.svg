<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" width="640" height="212" font-family="'Work Sans', -apple-system, sans-serif"><title>Gifting a lovey</title><rect width="640" height="212" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Gifting a lovey</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Best for around 3 months and up</text><line x1="24" y1="108" x2="616" y2="108" stroke="#DDD4C6" stroke-width="3"/><circle cx="24" cy="108" r="6" fill="#33586B"/><circle cx="225.28" cy="108" r="8" fill="#D8A23C"/><text x="24" y="134" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">0-3 months</text><text x="225.28" y="134" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="middle">3 months+</text><text x="225.28" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">head &amp; neck control</text><text x="426.56" y="108" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">wait for this point</text><text x="24" y="190" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Pair the gift with a note about age recommendations.</text></svg>