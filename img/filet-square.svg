<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Keeping the mesh square</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Keeping the mesh square</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">It is a ratio between two things, not one number</text><rect x="24.0" y="300" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="300" width="4" height="80" rx="2" fill="#33586B"/><text x="40.0" y="322" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Swatch plain mesh</text><text x="40.0" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Several rows of nothing but</text><text x="40.0" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">spaces, and measure whether</text><rect x="228.0" y="300" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="300" width="4" height="80" rx="2" fill="#D8A23C"/><text x="244.0" y="322" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">It may not be the chain count</text><text x="244.0" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A hook size making your dc</text><text x="244.0" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">taller or shorter than 2</text><rect x="432.0" y="300" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="300" width="4" height="80" rx="2" fill="#A63B4A"/><text x="448.0" y="322" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Blocking helps too</text><text x="448.0" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Pin to the intended</text><text x="448.0" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">measurements, lightly wet,</text><text x="24" y="410" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">This proportion issue affects every single space in the finished piece equally, and it is</text><text x="24" y="426" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">much easier to fix on a 4-row swatch than to notice for the first time on row 40.</text></svg>