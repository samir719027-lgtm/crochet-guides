<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="'Work Sans', -apple-system, sans-serif"><title>Timing the season</title><rect width="640" height="420" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Timing the season</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Count back from the deadline</text><rect x="24.0" y="210" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="210" width="4" height="54" rx="2" fill="#A63B4A"/><text x="40.0" y="232" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Work backwards</text><text x="40.0" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Count the evenings a</text><text x="40.0" y="261" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">pattern needs, then</text><rect x="228.0" y="210" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="210" width="4" height="54" rx="2" fill="#33586B"/><text x="244.0" y="232" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Start big in early fall</text><text x="244.0" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The throw and poncho take</text><text x="244.0" y="261" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">solid evenings, so the</text><rect x="432.0" y="210" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="210" width="4" height="54" rx="2" fill="#22404F"/><text x="448.0" y="232" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">One to two weeks is enough</text><text x="448.0" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The beanie, cowl, gloves</text><text x="448.0" y="261" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">and mug cozy are all quick</text><text x="24" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The temperature blanket is the genuine exception: it is meant to run the full length of</text><text x="24" y="322" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">whatever period you track, typically a calendar year, so starting now makes your fall and</text><text x="24" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">winter part of a much longer record.</text></svg>