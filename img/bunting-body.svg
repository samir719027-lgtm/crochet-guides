<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>Body and arm openings</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Body and arm openings</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Measure from a garment, not a chart</text><rect x="24" y="92" width="170" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="110" r="11" fill="#33586B"/><text x="42" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">ch 24</text><text x="36" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">join in the round, or</text><text x="36" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">work flat and seam</text><path d="M 198 130.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="210" y="92" width="170" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="228" cy="110" r="11" fill="#33586B"/><text x="228" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="248" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Widen gradually</text><text x="222" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">increase every few</text><text x="222" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rounds for the legs and</text><path d="M 384 130.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="396" y="92" width="170" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="414" cy="110" r="11" fill="#33586B"/><text x="414" y="114" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="434" y="114" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Check the width</text><text x="408" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">against a real</text><text x="408" y="150" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">well-fitting sleeper as</text><rect x="24" y="198" width="170" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="216" r="11" fill="#33586B"/><text x="42" y="220" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="220" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Leave arm gaps</text><text x="36" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">several stitches each</text><text x="36" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">side, work the sections</text><path d="M 198 236.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="210" y="198" width="170" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="228" cy="216" r="11" fill="#33586B"/><text x="228" y="220" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="248" y="220" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rejoin</text><text x="222" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and continue upward</text><path d="M 384 236.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="396" y="198" width="170" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="414" cy="216" r="11" fill="#33586B"/><text x="414" y="220" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="434" y="220" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">A few even rounds</text><text x="408" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">above the arm openings</text><text x="24" y="326" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Reach the underarm height from a garment the baby already wears comfortably rather than from</text><text x="24" y="342" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">a generic age-based chart, since this is the measurement that actually decides whether the</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">bunting fits.</text></svg>