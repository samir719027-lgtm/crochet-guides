<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="'Work Sans', -apple-system, sans-serif"><title>What actually damages stored yarn</title><rect width="640" height="290" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">What actually damages stored yarn</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Four threats, and the three that decide your method</text><rect x="24" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="118" width="176" height="8" fill="#A63B4A"/><text x="112.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">PESTS</text><text x="36" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Moths and carpet</text><text x="36" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">beetles eat animal</text><text x="36" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">fibers only - wool,</text><text x="36" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">alpaca, mohair.</text><rect x="216" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="96" width="176" height="30" rx="4" fill="#33586B"/><rect x="216" y="118" width="176" height="8" fill="#33586B"/><text x="304.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">MOISTURE</text><text x="228" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Trapped damp turns</text><text x="228" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">into mildew over</text><text x="228" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">months. Dry the yarn</text><text x="228" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">before sealing.</text><rect x="408" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="96" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="408" y="118" width="176" height="8" fill="#D8A23C"/><text x="496.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">LIGHT &amp; DUST</text><text x="420" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Sun fades dye and</text><text x="420" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">open shelves collect</text><text x="420" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">dust. Sealed bins</text><text x="420" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">solve both.</text><text x="24" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Pick your storage based on which threat you&#x27;re defending against.</text></svg>