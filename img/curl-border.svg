<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" font-family="'Work Sans', -apple-system, sans-serif"><title>The border that stops curl for good</title><rect width="640" height="334" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The border that stops curl for good</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The most dependable fix for a plain rectangle</text><path d="M 84 250 C 74 170 94 130 84 110" fill="none" stroke="#A63B4A" stroke-width="3" stroke-dasharray="6 4"/><line x1="64" y1="102" x2="244" y2="102" stroke="#DDD4C6" stroke-width="2"/><text x="154.0" y="90" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">curling edge</text><path d="M 264 180.0 h 40" stroke="#33586B" stroke-width="2"/><text x="270" y="172.0" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#33586B" text-anchor="start">add a</text><text x="270" y="190.0" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#33586B" text-anchor="start">border round</text><rect x="364" y="110" width="140" height="140" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="359" y="105" width="150" height="150" fill="none" stroke="#22404F" stroke-width="5"/><text x="434.0" y="270" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#22404F" text-anchor="middle">flat, stays flat</text><text x="24" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A border changes the structure of the edge instead of fighting the fabric.</text></svg>