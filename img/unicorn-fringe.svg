<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346" font-family="'Work Sans', -apple-system, sans-serif"><title>Fringing the mane and tail</title><rect width="640" height="346" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Fringing the mane and tail</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Cut yarn, not crochet</text><rect x="24.0" y="226" width="133" height="60" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="226" width="4" height="60" rx="2" fill="#33586B"/><text x="40.0" y="248" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">Cut 4-5in lengths</text><text x="40.0" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">several strands of</text><text x="40.0" y="277" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">each pastel</text><rect x="177.0" y="226" width="133" height="60" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="177.0" y="226" width="4" height="60" rx="2" fill="#33586B"/><text x="193.0" y="248" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Fold and pull through</text><text x="193.0" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">from the underside</text><text x="193.0" y="277" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">of the stitch</text><rect x="330.0" y="226" width="133" height="60" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="226" width="4" height="60" rx="2" fill="#33586B"/><text x="346.0" y="248" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Feed the ends through</text><text x="346.0" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the loop, then</text><text x="346.0" y="277" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">pull snug to lock</text><rect x="483.0" y="226" width="133" height="60" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="483.0" y="226" width="4" height="60" rx="2" fill="#33586B"/><text x="499.0" y="248" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Double up if sparse</text><text x="499.0" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">in a single loop</text><text x="499.0" y="277" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">for extra fullness</text><text x="24" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Spacing the knots closely and consistently is the only real skill involved, and it is what</text><text x="24" y="324" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">makes the finished mane look full rather than patchy.</text></svg>