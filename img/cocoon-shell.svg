<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" font-family="'Work Sans', -apple-system, sans-serif"><title>The oval base and the body</title><rect width="640" height="530" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The oval base and the body</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Increases at the ends only, then never again</text><rect x="232" y="176" width="176" height="86" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="250" cy="194" r="11" fill="#33586B"/><text x="250" y="198" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="270" y="198" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Round 1</text><text x="244" y="220" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Chain 9, sc round both</text><text x="244" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">sides, 3 sc in the last</text><rect x="232" y="292" width="176" height="86" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="250" cy="310" r="11" fill="#33586B"/><text x="250" y="314" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="270" y="314" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rounds 2-3</text><text x="244" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Increase at both rounded</text><text x="244" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">ends only, straight sides</text><rect x="232" y="408" width="176" height="86" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="250" cy="426" r="11" fill="#33586B"/><text x="250" y="430" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="270" y="430" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rounds 4-15</text><text x="244" y="452" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">12 rounds completely even</text><text x="244" y="466" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at 30 sts, no shaping at</text><text x="24" y="334" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The body measures about 13in / 33cm from the base at this point, with the stitch count held</text><text x="24" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at 30 throughout. The switch to flat rows is what turns a closed tube into an open-fronted</text><text x="24" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">body.</text></svg>