<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" font-family="'Work Sans', -apple-system, sans-serif"><title>Mirroring a pattern</title><rect width="640" height="268" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Mirroring a pattern</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The single idea behind left-handed crochet</text><text x="64" y="116" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">Right-handed</text><line x1="324" y1="168" x2="64" y2="168" stroke="#A63B4A" stroke-width="3"/><path d="M 74 160 l -10 8 l 10 8" stroke="#A63B4A" stroke-width="3" fill="none"/><text x="64" y="194" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">hook travels right to left</text><text x="364" y="116" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">Left-handed</text><line x1="364" y1="168" x2="624" y2="168" stroke="#33586B" stroke-width="3"/><path d="M 634 160 l -10 8 l 10 8" stroke="#33586B" stroke-width="3" fill="none"/><text x="364" y="194" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">hook travels left to right</text><text x="24" y="246" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Everything you do is a mirror image of a right-hander.</text></svg>