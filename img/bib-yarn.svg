<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" font-family="'Work Sans', -apple-system, sans-serif"><title>Choosing yarn for a bib</title><rect width="640" height="384" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Choosing yarn for a bib</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Absorbency decides it</text><rect x="24" y="92" width="284" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="284" height="34" rx="4" fill="#33586B"/><rect x="24" y="116" width="284" height="10" fill="#33586B"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">100% COTTON</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">absorbent, wicks moisture</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">dries cleanly against skin</text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">4mm + worsted stays dense</text><text x="38" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">and sturdy through washing</text><rect x="332" y="92" width="284" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="332" y="92" width="284" height="34" rx="4" fill="#D8A23C"/><rect x="332" y="116" width="284" height="10" fill="#D8A23C"/><text x="346" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">COTTON-ACRYLIC BLEND</text><text x="346" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">less absorbent</text><text x="346" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">softer hand feel</text><text x="346" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">slightly faster to stitch</text><text x="346" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a reasonable compromise</text><rect x="24" y="258" width="592" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24" y="258" width="4" height="66" rx="2" fill="#A63B4A"/><text x="42" y="284" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#A63B4A" text-anchor="start">Avoid</text><text x="42" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Pure acrylic stays clammy after a feeding, and fuzzy novelty yarns both struggle against the</text><text x="42" y="317" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">repeated washing this pattern is guaranteed to get.</text><text x="24" y="346" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A bib gets wiped, splashed and washed constantly, which is why this is the one pattern on</text><text x="24" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the site where the fibre is not interchangeable.</text></svg>