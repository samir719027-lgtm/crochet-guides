<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Three sections, three rates</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Three sections, three rates</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">This is the whole pattern in one idea</text><circle cx="120.0" cy="178.0" r="3.4" fill="#33586B"/><circle cx="153.9" cy="192.1" r="3.4" fill="#33586B"/><circle cx="168.0" cy="226.0" r="3.4" fill="#33586B"/><circle cx="153.9" cy="259.9" r="3.4" fill="#33586B"/><circle cx="120.0" cy="274.0" r="3.4" fill="#33586B"/><circle cx="86.1" cy="259.9" r="3.4" fill="#33586B"/><circle cx="72.0" cy="226.0" r="3.4" fill="#33586B"/><circle cx="86.1" cy="192.1" r="3.4" fill="#33586B"/><text x="120" y="226" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#33586B" text-anchor="middle" letter-spacing="0.3">CROWN</text><text x="120" y="302" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">inc 6 / round</text><text x="120" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">stays flat while it grows</text><circle cx="298.0" cy="178.0" r="3.4" fill="#22404F"/><circle cx="322.0" cy="184.4" r="3.4" fill="#22404F"/><circle cx="339.6" cy="202.0" r="3.4" fill="#22404F"/><circle cx="346.0" cy="226.0" r="3.4" fill="#22404F"/><circle cx="339.6" cy="250.0" r="3.4" fill="#22404F"/><circle cx="322.0" cy="267.6" r="3.4" fill="#22404F"/><circle cx="298.0" cy="274.0" r="3.4" fill="#22404F"/><circle cx="274.0" cy="267.6" r="3.4" fill="#22404F"/><circle cx="256.4" cy="250.0" r="3.4" fill="#22404F"/><circle cx="250.0" cy="226.0" r="3.4" fill="#22404F"/><circle cx="256.4" cy="202.0" r="3.4" fill="#22404F"/><circle cx="274.0" cy="184.4" r="3.4" fill="#22404F"/><text x="298" y="226" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#22404F" text-anchor="middle" letter-spacing="0.3">SIDES</text><text x="298" y="302" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">no shaping</text><text x="298" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">stay straight and cylindrical</text><circle cx="476.0" cy="178.0" r="3.4" fill="#A63B4A"/><circle cx="494.4" cy="181.7" r="3.4" fill="#A63B4A"/><circle cx="509.9" cy="192.1" r="3.4" fill="#A63B4A"/><circle cx="520.3" cy="207.6" r="3.4" fill="#A63B4A"/><circle cx="524.0" cy="226.0" r="3.4" fill="#A63B4A"/><circle cx="520.3" cy="244.4" r="3.4" fill="#A63B4A"/><circle cx="509.9" cy="259.9" r="3.4" fill="#A63B4A"/><circle cx="494.4" cy="270.3" r="3.4" fill="#A63B4A"/><circle cx="476.0" cy="274.0" r="3.4" fill="#A63B4A"/><circle cx="457.6" cy="270.3" r="3.4" fill="#A63B4A"/><circle cx="442.1" cy="259.9" r="3.4" fill="#A63B4A"/><circle cx="431.7" cy="244.4" r="3.4" fill="#A63B4A"/><circle cx="428.0" cy="226.0" r="3.4" fill="#A63B4A"/><circle cx="431.7" cy="207.6" r="3.4" fill="#A63B4A"/><circle cx="442.1" cy="192.1" r="3.4" fill="#A63B4A"/><circle cx="457.6" cy="181.7" r="3.4" fill="#A63B4A"/><text x="476" y="226" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#A63B4A" text-anchor="middle" letter-spacing="0.3">BRIM</text><text x="476" y="302" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">inc accelerates</text><text x="476" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">flares away from the head</text><text x="24" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Use the same increase rate for all three and you get a shape that is wrong in at least one</text><text x="24" y="390" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">section, usually the brim, which ends up lying flat instead of flaring. Check each section</text><text x="24" y="406" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">before starting the next.</text></svg>