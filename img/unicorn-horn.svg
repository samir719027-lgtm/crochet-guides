<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" width="640" height="302" font-family="'Work Sans', -apple-system, sans-serif"><title>Keeping the horn upright</title><rect width="640" height="302" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Keeping the horn upright</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Stuffing, not shaping</text><rect x="258.0" y="190" width="358" height="52" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="258.0" y="190" width="4" height="52" rx="2" fill="#33586B"/><text x="274.0" y="212" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Anchors are not enough</text><text x="274.0" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">a few anchor points let the horn lean to one side</text><text x="24" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">An unstuffed tip flops over even when the base is solid, so the shape comes entirely from</text><text x="24" y="280" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">how full the horn is, not from any stitch shaping.</text></svg>