<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Drape and fit mistakes</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Drape and fit mistakes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Six problems and their fixes</text><rect x="24" y="92" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="190" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="114" width="190" height="8" fill="#A63B4A"/><text x="119.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BOXY AND STIFF</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Go up one hook size from</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the yarn label for a lighter,</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">drapier fabric.</text><rect x="228" y="92" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="228" y="92" width="190" height="30" rx="4" fill="#A63B4A"/><rect x="228" y="114" width="190" height="8" fill="#A63B4A"/><text x="323.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">ARMS TOO TIGHT</text><text x="240" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Measure the wearer&#x27;s upper</text><text x="240" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">arm before seaming, not</text><text x="240" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the pattern&#x27;s number.</text><rect x="432" y="92" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="432" y="92" width="190" height="30" rx="4" fill="#D8A23C"/><rect x="432" y="114" width="190" height="8" fill="#D8A23C"/><text x="527.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">FRONT EDGES CURL</text><text x="444" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">One sc or slip stitch round</text><text x="444" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">along both open edges once</text><text x="444" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the piece is finished.</text><rect x="24" y="234" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="234" width="190" height="30" rx="4" fill="#D8A23C"/><rect x="24" y="256" width="190" height="8" fill="#D8A23C"/><text x="119.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">RIDES UP</text><text x="36" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Check the unseamed shoulder</text><text x="36" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">width against a top that</text><text x="36" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">already fits well.</text><rect x="228" y="234" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="228" y="234" width="190" height="30" rx="4" fill="#33586B"/><rect x="228" y="256" width="190" height="8" fill="#33586B"/><text x="323.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BULKY SEAM RIDGE</text><text x="240" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Use a flat mattress stitch</text><text x="240" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rather than a whip stitch</text><text x="240" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">through both layers.</text><rect x="432" y="234" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="432" y="234" width="190" height="30" rx="4" fill="#22404F"/><rect x="432" y="256" width="190" height="8" fill="#22404F"/><text x="527.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">MESH SUBSTITUTE</text><text x="444" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Alternating dc and chain-1</text><text x="444" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">spaces open the fabric for a</text><text x="444" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">summer-weight shrug.</text><text x="24" y="394" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The two-panel variation is the same rectangle worked twice and joined at a centre back seam:</text><text x="24" y="410" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">identical drape and fit, but a flatter back seam and an optional contrast line.</text></svg>