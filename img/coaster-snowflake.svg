oke-linecap="round"/><line x1="289" y1="177" x2="299" y2="194" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="287" y1="201" x2="299" y2="194" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="344" y1="168" x2="299" y2="142" stroke="#33586B" stroke-width="4" stroke-linecap="round"/><line x1="309" y1="125" x2="299" y2="142" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><line x1="287" y1="135" x2="299" y2="142" stroke="#33586B" stroke-width="3.5" stroke-linecap="round"/><text x="344" y="112" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#22404F" text-anchor="middle">six points, embroidered over the circle</text><text x="24" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Keep the embroidery stitches loose enough that they do not pucker the finished circle.</text></svg>