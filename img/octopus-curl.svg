<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" width="640" height="378" font-family="'Work Sans', -apple-system, sans-serif"><title>Why the tip curls on its own</title><rect width="640" height="378" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why the tip curls on its own</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two rounds of slip stitch, nothing else</text><rect x="24" y="92" width="284" height="128" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="284" height="34" rx="4" fill="#33586B"/><rect x="24" y="116" width="284" height="10" fill="#33586B"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">SINGLE CROCHET ROUND</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">same height as the round below</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">fabric stays smooth</text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">no pull on the tip</text><rect x="332" y="92" width="284" height="128" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="332" y="92" width="284" height="34" rx="4" fill="#A63B4A"/><rect x="332" y="116" width="284" height="10" fill="#A63B4A"/><text x="346" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">SLIP STITCH ROUND</text><text x="346" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">noticeably shorter and denser</text><text x="346" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">fabric puckers underneath</text><text x="346" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">tip pulls into a curl</text><path d="M 150 278 l 0 -34" stroke="#DDD4C6" stroke-width="0"/><line x1="90" y1="278" x2="210" y2="278" stroke="#DDD4C6" stroke-width="1.4"/><path d="M 95 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 106 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 117 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 128 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 139 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 150 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 161 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 172 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 183 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 194 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><path d="M 205 278 l 0 -34" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><text x="150" y="298" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#33586B" text-anchor="middle">sc rounds</text><path d="M 390 278 l 0 -34" stroke="#DDD4C6" stroke-width="0"/><line x1="330" y1="278" x2="450" y2="278" stroke="#DDD4C6" stroke-width="1.4"/><path d="M 335 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 346 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 357 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 368 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 379 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 390 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 401 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 412 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 423 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 434 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><path d="M 445 278 l 0 -22" stroke="#A63B4A" stroke-width="3" stroke-linecap="round"/><text x="390" y="298" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">sl st rounds</text><path d="M 150 238 q 120 -66 240 -26" fill="none" stroke="#A63B4A" stroke-width="2" stroke-dasharray="5 4"/><text x="270" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">the tip curls toward the shorter round</text><text x="24" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Switching to slip stitch for the last two rounds needs no wire, no stiffening and no extra</text><text x="24" y="356" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">shaping. The stitch does the work.</text></svg>