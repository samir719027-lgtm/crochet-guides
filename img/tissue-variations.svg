<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Work Sans', -apple-system, sans-serif"><title>Variations</title><rect width="640" height="520" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Variations</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Decoration that is also practical</text><rect x="24.0" y="264" width="286" height="76" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="264" width="4" height="76" rx="2" fill="#A63B4A"/><text x="40.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Leave one seam open</text><text x="40.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Close it with sew-on snaps or hook-and-loop</text><text x="40.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">so the cover lifts off when the box is</text><rect x="330.0" y="264" width="286" height="76" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="264" width="4" height="76" rx="2" fill="#A63B4A"/><text x="346.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Open the slot generously</text><text x="346.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Work the opening at least as large as the</text><text x="346.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">real pull-through slot, roughly 4 x 1.5in</text><text x="24" y="370" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">An opening that is too small causes daily friction pulling tissues through, and a slightly</text><text x="24" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">generous one barely shows once the tissues are in use.</text></svg>