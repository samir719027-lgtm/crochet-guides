<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>High, low or average?</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">High, low or average?</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">There is no wrong answer, only an inconsistent one</text><rect x="24" y="156" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="156" width="190" height="30" rx="4" fill="#33586B"/><rect x="24" y="178" width="190" height="8" fill="#33586B"/><text x="119.0" y="176" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">DAILY HIGH</text><text x="36" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Easiest to find reliably on any</text><text x="36" y="219" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">weather app, and tends to give a</text><text x="36" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">vivid, high-contrast blanket</text><text x="36" y="249" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">with clear seasonal bands.</text><rect x="225" y="156" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="225" y="156" width="190" height="30" rx="4" fill="#22404F"/><rect x="225" y="178" width="190" height="8" fill="#22404F"/><text x="320.0" y="176" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">DAILY AVERAGE</text><text x="237" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Produces a gentler, less</text><text x="237" y="219" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">extreme gradient across the year</text><text x="237" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">than the high.</text><rect x="426" y="156" width="190" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="426" y="156" width="190" height="30" rx="4" fill="#D8A23C"/><rect x="426" y="178" width="190" height="8" fill="#D8A23C"/><text x="521.0" y="176" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">DAILY LOW</text><text x="438" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Works well if you specifically</text><text x="438" y="219" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">want to capture how cold</text><text x="438" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">your nights actually get.</text><text x="24" y="322" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Switching partway through will visibly distort the gradient, since the bands no longer mean</text><text x="24" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the same thing from one end of the blanket to the other.</text></svg>