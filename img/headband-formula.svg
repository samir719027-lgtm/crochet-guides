<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="'Work Sans', -apple-system, sans-serif"><title>The starting chain</title><rect width="640" height="220" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The starting chain</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Head size plus allowance is the whole maths</text><rect x="24.0" y="104" width="187" height="72" rx="4" fill="#EDE6D9"/><text x="117.33333333333333" y="138" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#33586B" text-anchor="middle">ch 24</text><text x="117.33333333333333" y="158" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">average adult start</text><rect x="226.66666666666666" y="104" width="187" height="72" rx="4" fill="#EDE6D9"/><text x="320.0" y="138" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#D8A23C" text-anchor="middle">ch 20</text><text x="320.0" y="158" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">child start</text><rect x="429.3333333333333" y="104" width="187" height="72" rx="4" fill="#EDE6D9"/><text x="522.6666666666666" y="138" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#A63B4A" text-anchor="middle">+1in +2</text><text x="522.6666666666666" y="158" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">seam allowance + turning</text><text x="24" y="198" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Measure the head, add 1in / 2.5cm allowance, add 2 for turning.</text></svg>