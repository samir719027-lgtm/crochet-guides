<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" font-family="'Work Sans', -apple-system, sans-serif"><title>Two flat panels into one garment</title><rect width="640" height="386" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Two flat panels into one garment</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The seams that make the shape</text><rect x="24" y="292" width="130" height="64" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="310" r="11" fill="#33586B"/><text x="42" y="314" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="314" font-family="Fraunces, Georgia, serif" font-size="12.0" font-weight="600" fill="#2A241E" text-anchor="start">Make 2 panels</text><text x="36" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">identical, before</text><text x="36" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">any seaming</text><path d="M 158 324.0 h 2 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="168" y="292" width="130" height="64" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="186" cy="310" r="11" fill="#33586B"/><text x="186" y="314" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="206" y="314" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Seam the inseam</text><text x="180" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">cuff edge up to</text><text x="180" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">two thirds</text><path d="M 302 324.0 h 2 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="312" y="292" width="130" height="64" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="330" cy="310" r="11" fill="#33586B"/><text x="330" y="314" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="350" y="314" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">Seam front and back</text><text x="324" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at the centre,</text><text x="324" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">leaving openings</text><path d="M 446 324.0 h 2 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="456" y="292" width="130" height="64" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="474" cy="310" r="11" fill="#33586B"/><text x="474" y="314" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="494" y="314" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">2 rounds of sc</text><text x="468" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">firmly, slightly</text><text x="468" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">snugger than</text></svg>