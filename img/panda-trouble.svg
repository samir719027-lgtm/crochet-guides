<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Marking problems</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Marking problems</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Five fixes</text><rect x="24" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="114" width="186" height="8" fill="#A63B4A"/><text x="117.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">CIRCLE PATCHES</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Work each patch as its own flat</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">piece and sew it on, rather</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">than colour-changing a shape</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">into the round.</text><rect x="224" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="92" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="224" y="114" width="186" height="8" fill="#A63B4A"/><text x="317.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BLURRY BOUNDARY</text><text x="236" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">One clean stitch change, not a</text><text x="236" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">fade over 2-3, and weave the</text><text x="236" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tail in immediately so it</text><text x="236" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">cannot show through.</text><rect x="424" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="92" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="424" y="114" width="186" height="8" fill="#D8A23C"/><text x="517.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">EARS TOO BIG OR WIDE</text><text x="436" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Follow the stated ear width and</text><text x="436" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">placement exactly; pandas are</text><text x="436" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">smaller and closer-set than</text><text x="436" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">most other bear amigurumi.</text><rect x="24" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="234" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="24" y="256" width="186" height="8" fill="#D8A23C"/><text x="117.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">LIMBS DIFFERENT LENGTHS</text><text x="36" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Count total rounds on each limb</text><text x="36" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rather than measuring by eye,</text><text x="36" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">since black yarn makes stitch</text><text x="36" y="327" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">definition harder to see.</text><rect x="224" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="234" width="186" height="30" rx="4" fill="#33586B"/><rect x="224" y="256" width="186" height="8" fill="#33586B"/><text x="317.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">DINGY WHITE</text><text x="236" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Use genuinely bright white or</text><text x="236" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">cream rather than off-white;</text><text x="236" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the contrast is what sells</text><text x="236" y="327" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the panda colouring.</text><text x="24" y="396" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The single detail that separates a convincing panda from a black-and-white bear is the</text><text x="24" y="412" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">eye-patch shape, which is why the pattern treats it as its own small project rather than an</text><text x="24" y="428" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">afterthought in the head rounds.</text></svg>