<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492" width="640" height="492" font-family="'Work Sans', -apple-system, sans-serif"><title>Corner to corner, in rows</title><rect width="640" height="492" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Corner to corner, in rows</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A triangle out, a triangle back</text><rect x="24" y="300" width="140" height="66" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="318" r="11" fill="#33586B"/><text x="42" y="322" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="322" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Add one block</text><text x="36" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at the start of</text><text x="36" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">every increasing</text><path d="M 168 333.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="180" y="300" width="140" height="66" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="198" cy="318" r="11" fill="#33586B"/><text x="198" y="322" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="218" y="322" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Row 38</text><text x="192" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">38 blocks across,</text><text x="192" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">mark the centre</text><path d="M 324 333.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="336" y="300" width="140" height="66" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="354" cy="318" r="11" fill="#33586B"/><text x="354" y="322" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="374" y="322" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">Turn without adding</text><text x="348" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">then decrease one</text><text x="348" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">block per row</text><rect x="24" y="396" width="140" height="66" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="414" r="11" fill="#33586B"/><text x="42" y="418" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="418" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">Until 1 remains</text><text x="36" y="440" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">fasten off and</text><text x="36" y="454" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">weave in</text></svg>