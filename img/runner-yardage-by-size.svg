<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing to your table</title><rect width="640" height="260" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing to your table</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Yardage straight from the sizing table</text><text x="24" y="113" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">48in (4ft)</text><rect x="140" y="101" width="412" height="16" rx="2" fill="#E4DACB"/><rect x="140" y="101" width="230" height="16" rx="2" fill="#33586B"/><text x="616" y="113" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="end">430 yd</text><text x="24" y="143" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">60in (5ft)</text><rect x="140" y="131" width="412" height="16" rx="2" fill="#E4DACB"/><rect x="140" y="131" width="281" height="16" rx="2" fill="#33586B"/><text x="616" y="143" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="end">525 yd</text><text x="24" y="173" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">72in (6ft)</text><rect x="140" y="161" width="412" height="16" rx="2" fill="#E4DACB"/><rect x="140" y="161" width="321" height="16" rx="2" fill="#D8A23C"/><text x="616" y="173" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="end">600 yd</text><text x="24" y="203" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">96in (8ft)</text><rect x="140" y="191" width="412" height="16" rx="2" fill="#E4DACB"/><rect x="140" y="191" width="412" height="16" rx="2" fill="#A63B4A"/><text x="616" y="203" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="end">770 yd</text><text x="24" y="238" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The runner ends 12in past each edge, with the yarn following.</text></svg>