<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">How to Crochet Invisible: join, fasten off and hide ends</title>
  <desc id="d">Reference card from CrochetGuides. Four crochet techniques are called invisible: invisible join for closing a round, invisible fasten off for ending a piece, weaving in ends, and a Russian join for changing yarn. All instructions are in UK terms.</desc>
