  <text x="92" y="432" font-family="Space Mono, monospace" font-size="13" letter-spacing="1.6" fill="#33586B">FOUR TECHNIQUES, ONE WORD</text>
  <g font-family="Work Sans, sans-serif" font-size="19" fill="#2A241E">
    <circle cx="99" cy="463" r="4" fill="#33586B"/><text x="118" y="470">Invisible join &#8212; closes a round</text>
