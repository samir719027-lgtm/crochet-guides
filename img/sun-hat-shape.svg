<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" width="640" height="612" font-family="'Work Sans', -apple-system, sans-serif"><title>Crown, sides, brim</title><rect width="640" height="612" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Crown, sides, brim</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One increase formula, interrupted and resumed</text><rect x="300" y="96" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="114" r="11" fill="#33586B"/><text x="318" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="338" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Crown</text><text x="312" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">6, 12, 18, 24, 30, 36</text><text x="312" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">with [sc n, inc]</text><rect x="300" y="206" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="224" r="11" fill="#33586B"/><text x="318" y="228" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="338" y="228" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Sides</text><text x="312" y="250" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">4 even rounds at 36</text><text x="312" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">sts</text><rect x="300" y="316" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="334" r="11" fill="#33586B"/><text x="318" y="338" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="338" y="338" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Brim resumes</text><text x="312" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the same formula: [sc</text><text x="312" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">5, inc] up to [sc 9,</text><rect x="300" y="426" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="444" r="11" fill="#33586B"/><text x="318" y="448" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="338" y="448" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">hdc edge</text><text x="312" y="470" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">2 rounds, to stop the</text><text x="312" y="484" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">brim curling</text><text x="24" y="558" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Resuming the increase after the straight rounds is what turns the fabric outward into a brim</text><text x="24" y="574" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rather than continuing the cylinder, and the brim ends at 66 stitches, nearly twice the 36</text><text x="24" y="590" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">of the sides.</text></svg>