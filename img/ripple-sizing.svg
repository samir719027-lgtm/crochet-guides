<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing up or down</title><rect width="640" height="220" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing up or down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Resizing ripple is just arithmetic</text><rect x="24.0" y="104" width="187" height="72" rx="4" fill="#EDE6D9"/><text x="117.33333333333333" y="138" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#33586B" text-anchor="middle">74</text><text x="117.33333333333333" y="158" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">chains - 4 waves</text><rect x="226.66666666666666" y="104" width="187" height="72" rx="4" fill="#EDE6D9"/><text x="320.0" y="138" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#D8A23C" text-anchor="middle">18</text><text x="320.0" y="158" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">chains per extra wave</text><rect x="429.3333333333333" y="104" width="187" height="72" rx="4" fill="#EDE6D9"/><text x="522.6666666666666" y="138" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#A63B4A" text-anchor="middle">2</text><text x="522.6666666666666" y="158" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">edge chains to keep</text><text x="24" y="198" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">For width add or remove 18 chains per wave; for length work more rows.</text></svg>