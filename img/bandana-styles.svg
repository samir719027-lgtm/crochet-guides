<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338" font-family="'Work Sans', -apple-system, sans-serif"><title>Ten styles, three rough families</title><rect width="640" height="338" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Ten styles, three rough families</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Plain, textured, and colourwork</text><rect x="24" y="92" width="176" height="156" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="176" height="8" fill="#33586B"/><text x="112.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">PLAIN</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Granny triangle</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">worked top-down</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">with simple ties</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="36" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">A textbook beginner</text><text x="36" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">project</text><rect x="216" y="92" width="176" height="156" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="92" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="114" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">TEXTURED</text><text x="228" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Diamond lace, granny</text><text x="228" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">patchwork, floral</text><text x="228" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">applique</text><text x="228" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="228" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Practising repeats</text><text x="228" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">and applique</text><rect x="408" y="92" width="176" height="156" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="92" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="408" y="114" width="176" height="8" fill="#A63B4A"/><text x="496.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">COLOURWORK</text><text x="420" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Watermelon, ombre,</text><text x="420" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">bandana cowl</text><text x="420" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="420" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Colour changes and a</text><text x="420" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">single colour family</text><text x="24" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The baby-to-adult set is graded across five sizes, from infant to adult, so the whole family</text><text x="24" y="316" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">can wear a matching version.</text></svg>