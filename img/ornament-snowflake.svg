<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" font-family="'Work Sans', -apple-system, sans-serif"><title>Ornament 2: the picot snowflake</title><rect width="640" height="318" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Ornament 2: the picot snowflake</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A chain-5 picot every 2 stitches makes each point</text><line x1="344" y1="158" x2="344" y2="84" stroke="#33586B" stroke-width="6" stroke-linecap="round"/><circle cx="344" cy="62" r="9" fill="none" stroke="#33586B" stroke-width="4"/><line x1="344" y1="158" x2="408" y2="121" stroke="#33586B" stroke-width="6" stroke-linecap="round"/><circle cx="427" cy="110" r="9" fill="none" stroke="#33586B" stroke-width="4"/><line x1="344" y1="158" x2="408" y2="195" stroke="#33586B" stroke-width="6" stroke-linecap="round"/><circle cx="427" cy="206" r="9" fill="none" stroke="#33586B" stroke-width="4"/><line x1="344" y1="158" x2="344" y2="232" stroke="#33586B" stroke-width="6" stroke-linecap="round"/><circle cx="344" cy="254" r="9" fill="none" stroke="#33586B" stroke-width="4"/><line x1="344" y1="158" x2="280" y2="195" stroke="#33586B" stroke-width="6" stroke-linecap="round"/><circle cx="261" cy="206" r="9" fill="none" stroke="#33586B" stroke-width="4"/><line x1="344" y1="158" x2="280" y2="121" stroke="#33586B" stroke-width="6" stroke-linecap="round"/><circle cx="261" cy="110" r="9" fill="none" stroke="#33586B" stroke-width="4"/><circle cx="344" cy="158" r="16" fill="#EDE6D9"/><text x="344" y="40" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="middle">picot points: 6</text><text x="24" y="296" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">12 sc in a magic ring, then chain-5 picots skipping 2 stitches each time - the gentler of the two.</text></svg>