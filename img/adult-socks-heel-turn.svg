<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="'Work Sans', -apple-system, sans-serif"><title>The heel turn itself</title><rect width="640" height="480" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The heel turn itself</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Partial rows, counted at every turn</text><rect x="24" y="232" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="232" width="290" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="256" width="290" height="10" fill="#A63B4A"/><text x="38" y="255" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Counted</text><text x="38" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">A heel turn off by a</text><text x="38" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stitch or two on one</text><text x="38" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">side gives a pocket</text><text x="38" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">that sits crooked</text><text x="38" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">rather than centred</text><rect x="338" y="232" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="232" width="290" height="34" rx="4" fill="#33586B"/><rect x="338" y="256" width="290" height="10" fill="#33586B"/><text x="352" y="255" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">By feel</text><text x="352" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">It is really just partial</text><text x="352" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">rows cupping the fabric</text><text x="352" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">into a heel shape</text><text x="352" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Easiest once you</text><text x="352" y="388" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">have actually</text><text x="352" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">worked one</text><text x="24" y="442" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The heel turn is the part most beginners find intimidating on paper and easiest once</text><text x="24" y="458" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">actually worked.</text></svg>