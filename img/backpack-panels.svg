<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>The backpack as its parts</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The backpack as its parts</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two plain panels and a narrow gusset strip</text><rect x="64" y="116" width="150" height="200" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="64" y="116" width="150" height="26" rx="4" fill="#33586B"/><text x="139.0" y="133" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">FRONT / BACK panel</text><text x="76" y="168" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">32 sts wide</text><text x="76" y="186" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">x 44 rows</text><line x1="76" y1="208" x2="202" y2="208" stroke="#E4DACB" stroke-width="2"/><line x1="76" y1="222" x2="202" y2="222" stroke="#E4DACB" stroke-width="2"/><line x1="76" y1="236" x2="202" y2="236" stroke="#E4DACB" stroke-width="2"/><line x1="76" y1="250" x2="202" y2="250" stroke="#E4DACB" stroke-width="2"/><text x="76" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">make 2</text><rect x="264" y="270" width="180" height="40" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="264" y="270" width="180" height="20" rx="4" fill="#D8A23C"/><text x="354.0" y="284" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">SIDE GUSSET</text><text x="274" y="302" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">11 sts</text><text x="330" y="302" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">x ~31in / 79cm</text><rect x="494" y="116" width="120" height="170" rx="8" fill="#E4DACB" stroke="#DDD4C6"/><path d="M 516 116 C 516 82 468 86 508 110 M 592 116 C 592 82 640 86 600 110" stroke="#A63B4A" stroke-width="7" fill="none" stroke-linecap="round"/><text x="554.0" y="306" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="middle">assembled bag</text><text x="554.0" y="324" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">3 panels + straps</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The whole bag is rectangles - that is why resizing is easy.</text></svg>