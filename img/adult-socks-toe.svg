<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 584" width="640" height="584" font-family="'Work Sans', -apple-system, sans-serif"><title>The toe</title><rect width="640" height="584" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The toe</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">8 stitches, +4 a round, curved not square</text><rect x="24" y="346" width="290" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="346" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="370" width="290" height="10" fill="#33586B"/><text x="38" y="369" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Rounded increases</text><text x="38" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Build a naturally curved</text><text x="38" y="422" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">toe, not a boxy</text><text x="38" y="442" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">square one</text><text x="38" y="462" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="482" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Add 4 stitches</text><text x="38" y="502" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a round</text><rect x="338" y="346" width="290" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="346" width="290" height="34" rx="4" fill="#D8A23C"/><rect x="338" y="370" width="290" height="10" fill="#D8A23C"/><text x="352" y="369" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Toe-up</text><text x="352" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Try the sock on as you</text><text x="352" y="422" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">go and stop exactly</text><text x="352" y="442" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">when the length is right</text><text x="352" y="462" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="482" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Built-in fit check</text><text x="24" y="546" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Toe-up construction lets you commit to no stitch count before ever putting the sock on,</text><text x="24" y="562" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">which is the whole reason this pattern is worked that way.</text></svg>