<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" font-family="'Work Sans', -apple-system, sans-serif"><title>Acrylic vs cotton vs blends</title><rect width="640" height="396" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Acrylic vs cotton vs blends</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Each fibre trades one thing for another</text><rect x="24.0" y="244" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="244" width="4" height="64" rx="2" fill="#33586B"/><text x="40.0" y="266" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Most common</text><text x="40.0" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">acrylic, the default choice</text><text x="40.0" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">for amigurumi</text><rect x="228.0" y="244" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="244" width="4" height="64" rx="2" fill="#D8A23C"/><text x="244.0" y="266" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Crisp look</text><text x="244.0" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">mercerized cotton holds its</text><text x="244.0" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">shape well</text><rect x="432.0" y="244" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="244" width="4" height="64" rx="2" fill="#A63B4A"/><text x="448.0" y="266" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Generally avoided</text><text x="448.0" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">wool, for toys that get</text><text x="448.0" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">washed or handled often</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Cotton gives crisper stitch definition and less fuzzy halo, but it is less elastic, so even</text><text x="24" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">tension matters more.</text></svg>