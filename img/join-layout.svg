<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="'Work Sans', -apple-system, sans-serif"><title>Laying out the colour order</title><rect width="640" height="340" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Laying out the colour order</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">See the whole blanket before you join anything</text><rect x="24" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#A63B4A"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Lay them out</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">On the bed or floor, full</text><text x="36" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">size</text><path d="M 204 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="114" r="11" fill="#A63B4A"/><text x="238" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Stand back</text><text x="232" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Look for clumps of one</text><text x="232" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">colour</text><path d="M 400 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="416" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="434" cy="114" r="11" fill="#A63B4A"/><text x="434" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="454" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rearrange</text><text x="428" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Let the colours breathe</text><text x="428" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">evenly</text><rect x="24" y="196" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="214" r="11" fill="#A63B4A"/><text x="42" y="218" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="218" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Photograph it</text><text x="36" y="240" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">So the plan survives a</text><text x="36" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">work break</text><text x="24" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The step people skip is the one that saves the most heartache.</text></svg>