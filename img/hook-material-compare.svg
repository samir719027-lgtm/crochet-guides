<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" width="640" height="278" font-family="'Work Sans', -apple-system, sans-serif"><title>Wood, metal or plastic?</title><rect width="640" height="278" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Wood, metal or plastic?</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">What the material changes when you crochet</text><line x1="110" y1="188" x2="526" y2="188" stroke="#DDD4C6" stroke-width="1.2"/><text x="180.66666666666666" y="84" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Metal</text><rect x="120" y="96" width="121" height="92" fill="#33586B" opacity="0.82"/><text x="180.66666666666666" y="205" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">cool, precise</text><text x="320.0" y="84" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Wood</text><rect x="259" y="137" width="121" height="51" fill="#33586B" opacity="0.59"/><text x="320.0" y="205" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">warm grip</text><text x="459.3333333333333" y="84" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Plastic</text><rect x="399" y="147" width="121" height="41" fill="#33586B" opacity="0.55"/><text x="459.3333333333333" y="205" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">lightest</text><text x="24" y="246" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Relative warmth in the hand and how much the shaft flexes.</text></svg>