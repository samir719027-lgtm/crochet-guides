<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" font-family="'Work Sans', -apple-system, sans-serif"><title>The fabric behaves differently</title><rect width="640" height="386" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The fabric behaves differently</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Knitting&#x27;s extra complexity buys stretch and drape</text><rect x="24" y="160" width="252" height="128" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><text x="150" y="144" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#33586B" text-anchor="middle" letter-spacing="0.3">CROCHET FABRIC</text><line x1="42" y1="200" x2="42" y2="256" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="60" y1="200" x2="60" y2="256" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="78" y1="200" x2="78" y2="256" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="96" y1="201" x2="96" y2="257" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="114" y1="202" x2="114" y2="258" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="132" y1="203" x2="132" y2="259" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="150" y1="204" x2="150" y2="260" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="168" y1="206" x2="168" y2="262" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="186" y1="208" x2="186" y2="264" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="204" y1="211" x2="204" y2="267" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="222" y1="213" x2="222" y2="269" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="240" y1="216" x2="240" y2="272" stroke="#33586B" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="38" y1="200" x2="262" y2="200" stroke="#DDD4C6" stroke-width="2"/><rect x="324" y="160" width="252" height="128" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><text x="450" y="144" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#A63B4A" text-anchor="middle" letter-spacing="0.3">KNITTED FABRIC</text><line x1="342" y1="200" x2="342" y2="256" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="360" y1="200" x2="360" y2="256" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="378" y1="201" x2="378" y2="257" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="396" y1="203" x2="396" y2="259" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="414" y1="206" x2="414" y2="262" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="432" y1="209" x2="432" y2="265" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="450" y1="214" x2="450" y2="270" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="468" y1="219" x2="468" y2="275" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="486" y1="225" x2="486" y2="281" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="504" y1="232" x2="504" y2="288" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="522" y1="239" x2="522" y2="295" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="540" y1="248" x2="540" y2="304" stroke="#A63B4A" stroke-width="3" opacity="0.65" stroke-linecap="round"/><line x1="338" y1="200" x2="562" y2="200" stroke="#DDD4C6" stroke-width="2"/><text x="36" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Crochet generally holds its shape; knitted fabric</text><text x="36" y="326" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stretches and drapes, which is why it is the standard</text><text x="36" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">choice for fitted jumpers, socks, and anything that</text><text x="36" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">has to stretch with movement.</text></svg>