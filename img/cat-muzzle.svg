<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" font-family="'Work Sans', -apple-system, sans-serif"><title>The muzzle panel</title><rect width="640" height="236" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The muzzle panel</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Flat, checked, then sewn</text><rect x="258.0" y="96" width="74" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="258.0" y="96" width="4" height="80" rx="2" fill="#33586B"/><text x="274.0" y="118" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Work it …</text><text x="274.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">not</text><text x="274.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">colour-changing</text><rect x="352.5" y="96" width="74" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="352.5" y="96" width="4" height="80" rx="2" fill="#33586B"/><text x="368.5" y="118" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Hold it …</text><text x="368.5" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">adjust</text><text x="368.5" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the</text><rect x="447.0" y="96" width="74" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="447.0" y="96" width="4" height="80" rx="2" fill="#33586B"/><text x="463.0" y="118" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">The same…</text><text x="463.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">works</text><text x="463.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">for the</text><rect x="541.5" y="96" width="74" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="541.5" y="96" width="4" height="80" rx="2" fill="#33586B"/><text x="557.5" y="118" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Crisp ed…</text><text x="557.5" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">a</text><text x="557.5" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">deliberate</text><text x="24" y="198" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The shape and placement of that panel is the single biggest difference between a cat that</text><text x="24" y="214" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">reads as a cat and one that reads as a round animal with some white on it.</text></svg>