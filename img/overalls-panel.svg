>rib: front post and back post alternate</text><text x="24" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The stretchier rib is what lets the cuff open wide enough for feet and socks without being</text><text x="24" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">loose everywhere else, so it is the one place the pattern changes stitch.</text></svg>