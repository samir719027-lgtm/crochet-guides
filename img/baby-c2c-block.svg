<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" width="640" height="398" font-family="'Work Sans', -apple-system, sans-serif"><title>One block, and adding the next</title><rect width="640" height="398" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">One block, and adding the next</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Chain 6 and three double crochets</text><rect x="24" y="232" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="250" r="11" fill="#33586B"/><text x="42" y="254" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="254" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Add a block</text><text x="36" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">ch 6, sl st into the top</text><text x="36" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">chain of the previous</text><path d="M 204 270.0 h 6 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="218" y="232" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="236" cy="250" r="11" fill="#33586B"/><text x="236" y="254" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="256" y="254" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Work across</text><text x="230" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">ch 3, sl st into the</text><text x="230" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">matching chain space</text><path d="M 398 270.0 h 6 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="412" y="232" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="430" cy="250" r="11" fill="#33586B"/><text x="430" y="254" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="450" y="254" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Three dc</text><text x="424" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">into that same space, and</text><text x="424" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the block is done</text><text x="24" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every block is the same three stitches, so the diagonal structure stays consistent and the</text><text x="24" y="376" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">whole thing is counted rather than measured.</text></svg>