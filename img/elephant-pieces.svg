<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="'Work Sans', -apple-system, sans-serif"><title>Nine separate pieces</title><rect width="640" height="560" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Nine separate pieces</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Only the ears are worked as flat discs</text><rect x="24" y="176" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="176" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="198" width="176" height="8" fill="#33586B"/><text x="112.0" y="196" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HEAD</text><text x="36" y="224" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">MR, 6 sc</text><text x="36" y="239" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">inc to 24</text><text x="36" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">5 even rounds</text><text x="36" y="269" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff firmly</text><rect x="216" y="176" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="176" width="176" height="30" rx="4" fill="#33586B"/><rect x="216" y="198" width="176" height="8" fill="#33586B"/><text x="304.0" y="196" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BODY</text><text x="228" y="224" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">MR, 6 sc</text><text x="228" y="239" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">inc to 18</text><text x="228" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">3 even rounds</text><text x="228" y="269" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff firmly</text><rect x="408" y="176" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="176" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="408" y="198" width="176" height="8" fill="#D8A23C"/><text x="496.0" y="196" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">TRUNK</text><text x="420" y="224" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">MR, 5 sc</text><text x="420" y="239" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 even rounds</text><text x="420" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff lightly</text><text x="420" y="269" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">keeps it flexible</text><rect x="24" y="306" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="306" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="328" width="176" height="8" fill="#A63B4A"/><text x="112.0" y="326" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">2 EARS</text><text x="36" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">MR, 6 sc</text><text x="36" y="369" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">inc to 24</text><text x="36" y="384" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">not stuffed</text><text x="36" y="399" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stays a flat disc</text><rect x="216" y="306" width="176" height="112" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="306" width="176" height="30" rx="4" fill="#22404F"/><rect x="216" y="328" width="176" height="8" fill="#22404F"/><text x="304.0" y="326" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">4 LEGS</text><text x="228" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">MR, 5 sc</text><text x="228" y="369" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">3 even rounds</text><text x="228" y="384" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuff lightly</text><text x="228" y="399" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">short stubs</text><text x="24" y="448" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Nine pieces are crocheted separately and sewn together at the end. The trunk is stuffed</text><text x="24" y="464" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">lightly rather than firmly so it keeps some flexibility, and the ears are the only pieces</text><text x="24" y="480" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">left unstuffed.</text></svg>