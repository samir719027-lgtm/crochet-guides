<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Work Sans', -apple-system, sans-serif"><title>Working a slot row</title><rect width="640" height="400" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Working a slot row</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The stitch count stays at 40 throughout</text><rect x="24" y="176" width="592" height="28" fill="#33586B"/><text x="34" y="195" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Row</text><text x="106" y="195" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What you work</text><text x="458" y="195" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Purpose</text><rect x="24" y="204" width="592" height="26" fill="#FFFFFF"/><text x="34" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Row 11</text><text x="106" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dc 10, skip 3, ch 3, dc 14, skip 3, ch 3, dc 10</text><text x="458" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">two shoulder slots</text><line x1="24" y1="230" x2="616" y2="230" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="230" width="592" height="26" fill="#E4DACB"/><text x="34" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Row 12</text><text x="106" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dc across, each ch-3 space counts as 3 sts</text><text x="458" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">closes both slots</text><line x1="24" y1="256" x2="616" y2="256" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="256" width="592" height="26" fill="#FFFFFF"/><text x="34" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Row 13</text><text x="106" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dc across, 9 rows</text><text x="458" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">plain section</text><line x1="24" y1="282" x2="616" y2="282" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="282" width="592" height="26" fill="#E4DACB"/><text x="34" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Row 15</text><text x="106" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">repeat row 11 exactly</text><text x="458" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">hips land on the same marks</text><line x1="24" y1="308" x2="616" y2="308" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="308" width="592" height="26" fill="#FFFFFF"/><text x="34" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Row 19</text><text x="106" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dc 18, skip 4, ch 4, dc 18</text><text x="458" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">crotch slot, slightly wider</text><line x1="24" y1="334" x2="616" y2="334" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="176" width="592" height="158" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="370" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The body is chain 43 and 40 dc, worked flat in rows. Treating each chain space as three</text><text x="24" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stitches is what keeps the stitch count at 40 across the whole piece.</text></svg>