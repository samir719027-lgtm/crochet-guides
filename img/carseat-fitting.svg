<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="'Work Sans', -apple-system, sans-serif"><title>Fit before you finish</title><rect width="640" height="540" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Fit before you finish</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Check the slots against your own seat early</text><rect x="24" y="176" width="20" height="20" rx="10" fill="#33586B"/><text x="34" y="191" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="58" y="191" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">1. Work the body</text><text x="58" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Chain 43, 40 dc, 10 even rows</text><rect x="24" y="238" width="20" height="20" rx="10" fill="#A63B4A"/><text x="34" y="253" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="58" y="253" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">2. Lay it on the seat</text><text x="58" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Check the slots against where your own straps come through</text><rect x="24" y="300" width="20" height="20" rx="10" fill="#D8A23C"/><text x="34" y="315" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="58" y="315" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">3. Frog if needed</text><text x="58" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A slot that is off is a few rows to undo, not the whole blanket</text><rect x="24" y="362" width="20" height="20" rx="10" fill="#22404F"/><text x="34" y="377" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="58" y="377" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">4. Carry on</text><text x="58" y="394" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Hips, crotch, edging, fasten off</text><text x="24" y="464" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Harness spacing genuinely varies between seat models, and even between infant and</text><text x="24" y="480" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">convertible seats from the same manufacturer. Treat the layout as a solid starting point and</text><text x="24" y="496" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">check it against your actual seat before row 33.</text></svg>