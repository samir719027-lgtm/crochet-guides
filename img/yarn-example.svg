<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>A worked example</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">A worked example</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">22 yards in, 2,660 out</text><rect x="24" y="92" width="592" height="38" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="4" height="38" rx="2" fill="#33586B"/><text x="42" y="116" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">Swatch</text><text x="230" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">4 x 4 in = 16 sq in</text><text x="600" y="116" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#33586B" text-anchor="end">22 yards</text><path d="M 600.0 132.0 L 600.0 138.0" stroke="#DDD4C6" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M 595.0 129.0 L 600.0 138.0 L 605.0 129.0 Z" fill="#DDD4C6"/><rect x="24" y="140" width="592" height="38" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="140" width="4" height="38" rx="2" fill="#22404F"/><text x="42" y="164" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">Per square inch</text><text x="230" y="164" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">22 / 16</text><text x="600" y="164" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#22404F" text-anchor="end">1.375 yd/sq in</text><path d="M 600.0 180.0 L 600.0 186.0" stroke="#DDD4C6" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M 595.0 177.0 L 600.0 186.0 L 605.0 177.0 Z" fill="#DDD4C6"/><rect x="24" y="188" width="592" height="38" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="188" width="4" height="38" rx="2" fill="#22404F"/><text x="42" y="212" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">Blanket area</text><text x="230" y="212" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">36 x 48</text><text x="600" y="212" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#22404F" text-anchor="end">1,728 sq in</text><path d="M 600.0 228.0 L 600.0 234.0" stroke="#DDD4C6" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M 595.0 225.0 L 600.0 234.0 L 605.0 225.0 Z" fill="#DDD4C6"/><rect x="24" y="236" width="592" height="38" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="236" width="4" height="38" rx="2" fill="#D8A23C"/><text x="42" y="260" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">Raw estimate</text><text x="230" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">1,728 x 1.375</text><text x="600" y="260" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#D8A23C" text-anchor="end">2,376 yards</text><path d="M 600.0 276.0 L 600.0 282.0" stroke="#DDD4C6" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M 595.0 273.0 L 600.0 282.0 L 605.0 273.0 Z" fill="#DDD4C6"/><rect x="24" y="284" width="592" height="38" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="284" width="4" height="38" rx="2" fill="#A63B4A"/><text x="42" y="308" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="start">With a 12% buffer</text><text x="230" y="308" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">2,376 x 1.12</text><text x="600" y="308" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#A63B4A" text-anchor="end">2,660 yards</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Then round up to the nearest full skein based on the yardage printed on your chosen yarn&#x27;s ball band.</text></svg>