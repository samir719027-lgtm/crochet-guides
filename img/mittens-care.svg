<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="'Work Sans', -apple-system, sans-serif"><title>Care &amp; washing</title><rect width="640" height="290" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Care &amp; washing</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three habits that keep baby mitts usable</text><rect x="24" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="118" width="176" height="8" fill="#33586B"/><text x="112.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Mesh bag</text><text x="36" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Gentle machine</text><text x="36" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">wash cycle keeps</text><text x="36" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">a tiny pair from</text><text x="36" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">going</text><text x="36" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">missing.</text><rect x="216" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="96" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="216" y="118" width="176" height="8" fill="#A63B4A"/><text x="304.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Lay flat</text><text x="228" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">No tumble dryer -</text><text x="228" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">heat can shrink</text><text x="228" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">or felt the</text><text x="228" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">fibres.</text><rect x="408" y="96" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="96" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="408" y="118" width="176" height="8" fill="#D8A23C"/><text x="496.0" y="116" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Keep paired</text><text x="420" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">A safety pin or</text><text x="420" y="159" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">clip between the</text><text x="420" y="174" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">two when not</text><text x="420" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">in use.</text><text x="24" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Small items dry quickly either way.</text></svg>