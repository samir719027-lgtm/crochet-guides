<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="'Work Sans', -apple-system, sans-serif"><title>Colour variations</title><rect width="640" height="250" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Colour variations</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Four palettes that all stay soft</text><rect x="24" y="96" width="130" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><text x="24" y="174" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Cream</text><text x="24" y="192" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">the classic</text><rect x="166" y="96" width="130" height="58" rx="4" fill="#D8D2C3" stroke="#DDD4C6"/><text x="166" y="174" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Soft grey</text><text x="166" y="192" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">nursery tone</text><rect x="308" y="96" width="130" height="58" rx="4" fill="#E6C0C2" stroke="#DDD4C6"/><text x="308" y="174" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Blush pink</text><text x="308" y="192" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">whimsical</text><rect x="450" y="96" width="130" height="58" rx="4" fill="#C7C0D4" stroke="#DDD4C6"/><text x="450" y="174" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Pale lavender</text><text x="450" y="192" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">gentle</text><text x="24" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Same pattern, any one of these shades.</text></svg>