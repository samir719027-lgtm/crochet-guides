<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" font-family="'Work Sans', -apple-system, sans-serif"><title>Straps, crossed and buttoned</title><rect width="640" height="336" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Straps, crossed and buttoned</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A flat chain, crossed at the back</text><rect x="430.0" y="186" width="186" height="78" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="430.0" y="186" width="4" height="78" rx="2" fill="#33586B"/><text x="446.0" y="208" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Sew the ends</text><text x="446.0" y="224" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">or sew them straight to the</text><text x="446.0" y="237" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">front for an infant, no</text><text x="24" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Crossing the straps at the back rather than running them straight up and over is what stops</text><text x="24" y="314" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">them sliding off small shoulders during a nappy change or a crawl.</text></svg>