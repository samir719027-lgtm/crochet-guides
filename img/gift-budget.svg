<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" font-family="'Work Sans', -apple-system, sans-serif"><title>How much to spend</title><rect width="640" height="256" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How much to spend</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Scale the gift to the budget</text><rect x="24" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#D8A23C"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Notions first</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stitch markers and a</text><text x="36" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">project bag cost almost nothing</text><path d="M 204 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#D8A23C" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="114" r="11" fill="#D8A23C"/><text x="238" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="118" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">Yarn is the flexible one</text><text x="232" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">It scales to whatever</text><text x="232" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">amount you want to spend</text><path d="M 400 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#D8A23C" stroke-width="1.8" stroke-linecap="round"/><rect x="416" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="434" cy="114" r="11" fill="#D8A23C"/><text x="434" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="454" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Books last</text><text x="428" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A reference book is easy</text><text x="428" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">to buy for anyone</text><text x="24" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Crochet gifts scale easily to almost any budget, which makes this an easy category to shop</text><text x="24" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">well in.</text></svg>