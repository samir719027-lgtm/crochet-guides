<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Work Sans', -apple-system, sans-serif"><title>Row 1 and the square rule</title><rect width="640" height="330" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Row 1 and the square rule</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One foundation, then rows until it&#x27;s square</text><rect x="144" y="130" width="130" height="130" fill="#EDE6D9" stroke="#DDD4C6"/><line x1="154" y1="144" x2="264" y2="144" stroke="#E4DACB" stroke-width="2"/><line x1="154" y1="161" x2="264" y2="161" stroke="#E4DACB" stroke-width="2"/><line x1="154" y1="178" x2="264" y2="178" stroke="#E4DACB" stroke-width="2"/><line x1="154" y1="195" x2="264" y2="195" stroke="#E4DACB" stroke-width="2"/><line x1="154" y1="212" x2="264" y2="212" stroke="#E4DACB" stroke-width="2"/><line x1="154" y1="229" x2="264" y2="229" stroke="#E4DACB" stroke-width="2"/><line x1="154" y1="246" x2="264" y2="246" stroke="#E4DACB" stroke-width="2"/><text x="209.0" y="120" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">20 stitches wide</text><text x="132" y="195.0" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="end">~26 rows</text><path d="M 292 195.0 h -20 m 6 -6 l -6 6 6 6" fill="none" stroke="#33586B" stroke-width="2"/><text x="298" y="195.0" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#33586B" text-anchor="start">make it</text><text x="298" y="211.0" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#33586B" text-anchor="start">square</text><text x="24" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Foundation 21 gives 20 stitches; repeat until the cloth is roughly square.</text></svg>