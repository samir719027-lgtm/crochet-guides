<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" font-family="'Work Sans', -apple-system, sans-serif"><title>The panels, and how they go together</title><rect width="640" height="550" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The panels, and how they go together</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Four flat pieces, then raglan seams</text><rect x="24" y="354" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="372" r="11" fill="#A63B4A"/><text x="42" y="376" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="376" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">Mark the raglan lines</text><text x="36" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">1/5 of the panel width in</text><text x="36" y="412" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">from each top corner, on</text><path d="M 204 392.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="216" y="354" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="234" cy="372" r="11" fill="#A63B4A"/><text x="234" y="376" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="254" y="376" font-family="Fraunces, Georgia, serif" font-size="12.0" font-weight="600" fill="#2A241E" text-anchor="start">Check before seaming</text><text x="228" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">all four lines at the</text><text x="228" y="412" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">same distance keeps the</text><path d="M 396 392.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="408" y="354" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="426" cy="372" r="11" fill="#A63B4A"/><text x="426" y="376" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="446" y="376" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Seam, then the neckline</text><text x="420" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">sleeves, centre front,</text><text x="420" y="412" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">side and underarm, then</text><text x="24" y="512" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The neckline round is worked a little more snugly than the body gauge, to build a stable</text><text x="24" y="528" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">band that does not stretch.</text></svg>