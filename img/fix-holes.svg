<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" width="640" height="482" font-family="'Work Sans', -apple-system, sans-serif"><title>Unexplained holes in the fabric</title><rect width="640" height="482" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Unexplained holes in the fabric</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The shape of the holes names the cause</text><rect x="24" y="92" width="290" height="146" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="290" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="114" width="290" height="8" fill="#A63B4A"/><text x="169.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SKIPPED</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Holes line up in a</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">column down the fabric</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Show up at the start</text><text x="36" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">or end of a row</text><rect x="330" y="92" width="290" height="146" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="330" y="92" width="290" height="30" rx="4" fill="#D8A23C"/><rect x="330" y="114" width="290" height="8" fill="#D8A23C"/><text x="475.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">WRONG LOOP</text><text x="342" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Only the back loop is</text><text x="342" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">worked, so the whole</text><text x="342" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stitch is left open</text><text x="342" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="342" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">A consistent, not</text><text x="342" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">random, pattern</text><text x="24" y="266" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The column of holes tells you which one it was</text><rect x="28" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="60" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="92" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="124" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="156" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="188" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="220" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="252" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="284" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="316" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="348" y="284" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="28" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="60" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="92" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="124" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="156" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="188" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="220" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="252" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="284" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="316" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="348" y="316" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="28" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="60" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="92" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="124" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="156" y="348" width="30" height="30" rx="3" fill="none" stroke="#A63B4A" stroke-width="2"/><rect x="188" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="220" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="252" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="284" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="316" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><rect x="348" y="348" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#DDD4C6" stroke-width="2"/><path d="M 171 394 v 26" stroke="#A63B4A" stroke-width="2" fill="none"/><text x="171" y="434" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">the hole</text><text x="24" y="430" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">If the holes run in a straight line, a stitch was skipped. If they follow the stitch, you</text><text x="24" y="446" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">worked into the wrong loop.</text></svg>