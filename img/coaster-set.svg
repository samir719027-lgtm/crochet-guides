<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" font-family="'Work Sans', -apple-system, sans-serif"><title>Four, tied with ribbon</title><rect width="640" height="306" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Four, tied with ribbon</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Consistency is what makes a set look expensive</text><circle cx="116" cy="158" r="44" fill="#A63B4A" opacity="0.75"/><circle cx="116" cy="158" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="116" cy="158" r="14" fill="#FFFFFF" opacity="0.55"/><circle cx="244" cy="158" r="44" fill="#33586B" opacity="0.75"/><circle cx="244" cy="158" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="244" cy="158" r="14" fill="#FFFFFF" opacity="0.55"/><circle cx="372" cy="158" r="44" fill="#D8A23C" opacity="0.75"/><circle cx="372" cy="158" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="372" cy="158" r="14" fill="#FFFFFF" opacity="0.55"/><circle cx="500" cy="158" r="44" fill="#22404F" opacity="0.75"/><circle cx="500" cy="158" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="500" cy="158" r="14" fill="#FFFFFF" opacity="0.55"/><text x="344" y="92" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">four, finished the same way</text><path d="M 54 220 q 290 26 580 0" fill="none" stroke="#A63B4A" stroke-width="3" stroke-dasharray="7 5"/><text x="24" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Consistency is the real trick in a set: make all four, then check them side by side before</text><text x="24" y="284" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">you tie the ribbon.</text></svg>