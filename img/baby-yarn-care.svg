<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Work Sans', -apple-system, sans-serif"><title>Yarn and care</title><rect width="640" height="400" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Yarn and care</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Crisp stitches need smooth yarn</text><rect x="24" y="236" width="592" height="28" fill="#33586B"/><text x="34" y="255" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4"></text><text x="142" y="255" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What to do</text><rect x="24" y="264" width="592" height="22" fill="#FFFFFF"/><text x="34" y="281" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Wash</text><text x="142" y="281" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Gentle or delicate cycle, in a mesh laundry bag</text><line x1="24" y1="286" x2="616" y2="286" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="286" width="592" height="22" fill="#E4DACB"/><text x="34" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="142" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">with a mild, fragrance-free detergent</text><line x1="24" y1="308" x2="616" y2="308" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="308" width="592" height="22" fill="#FFFFFF"/><text x="34" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Dry</text><text x="142" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Lay flat. Hanging pulls the shell fans out of shape</text><line x1="24" y1="330" x2="616" y2="330" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="330" width="592" height="22" fill="#E4DACB"/><text x="34" y="347" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="142" y="347" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">over time, so the scallop does not survive it</text><line x1="24" y1="352" x2="616" y2="352" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="352" width="592" height="22" fill="#FFFFFF"/><text x="34" y="369" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Block</text><text x="142" y="369" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Pin the shells out evenly if the border needs to</text><line x1="24" y1="374" x2="616" y2="374" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="374" width="592" height="22" fill="#E4DACB"/><text x="34" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="142" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">look its crispest for a gift</text><line x1="24" y1="396" x2="616" y2="396" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="236" width="592" height="160" fill="none" stroke="#DDD4C6" stroke-width="1"/></svg>