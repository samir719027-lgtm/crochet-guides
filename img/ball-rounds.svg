<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family="'Work Sans', -apple-system, sans-serif"><title>Increase, hold, decrease</title><rect width="640" height="314" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Increase, hold, decrease</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The shape behind most amigurumi heads and bodies</text><circle cx="174" cy="190" r="26" fill="#33586B" opacity="0.7"/><text x="174" y="236" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Rounds 1-3</text><text x="174" y="254" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">grow</text><circle cx="344" cy="172" r="44" fill="#D8A23C" opacity="0.7"/><text x="344" y="236" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Rounds 4-6</text><text x="344" y="254" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">even</text><circle cx="514" cy="184" r="32" fill="#A63B4A" opacity="0.7"/><text x="514" y="236" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Round 7</text><text x="514" y="254" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">close</text><line x1="84" y1="220" x2="556" y2="220" stroke="#DDD4C6" stroke-width="1.5"/><text x="174" y="146" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">6 to 18 sts</text><text x="344" y="172" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">18 sts, straight</text><text x="514" y="176" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">18 to 12 sts</text><text x="24" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stuff in before the opening gets small. Straight rounds in the middle keep the sphere even.</text></svg>