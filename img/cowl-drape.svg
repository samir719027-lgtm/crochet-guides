<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="'Work Sans', -apple-system, sans-serif"><title>Changing the drape</title><rect width="640" height="372" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Changing the drape</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Same stitch count, different stitch</text><rect x="64" y="224" width="120" height="26" rx="4" fill="#33586B" opacity="0.35"/><rect x="64" y="224" width="120" height="26" rx="4" fill="none" stroke="#33586B" stroke-width="2"/><text x="124" y="274" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">SINGLE CROCHET</text><text x="124" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">stiff, stands away</text><rect x="254" y="188" width="120" height="62" rx="4" fill="#D8A23C" opacity="0.35"/><rect x="254" y="188" width="120" height="62" rx="4" fill="none" stroke="#D8A23C" stroke-width="2"/><text x="314" y="274" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">HALF DOUBLE CROCHET</text><text x="314" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">soft middle ground</text><rect x="444" y="146" width="120" height="104" rx="4" fill="#A63B4A" opacity="0.35"/><rect x="444" y="146" width="120" height="104" rx="4" fill="none" stroke="#A63B4A" stroke-width="2"/><text x="504" y="274" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">DOUBLE CROCHET</text><text x="504" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">opens up, drapes</text><line x1="44" y1="250" x2="624" y2="250" stroke="#DDD4C6" stroke-width="2"/><text x="48" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">taller stitch = more drape, at the same stitch count</text><text x="24" y="334" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Half double crochet is warmer and denser than a lacy stitch, with more movement than single</text><text x="24" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">crochet.</text></svg>