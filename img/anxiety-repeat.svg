<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" width="640" height="212" font-family="'Work Sans', -apple-system, sans-serif"><title>Why repetitive motion calms</title><rect width="640" height="212" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why repetitive motion calms</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One hook, one active loop at a time</text><path d="M 48 128 q 14 22 28 0 t 28 0 t 28 0 t 28 0" stroke="#33586B" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M 48 128 a 8 8 0 1 0 16 0 a 8 8 0 1 0 -16 0" fill="#D8A23C"/><path d="M 76 138 q 14 -22 28 0 t 28 0 t 28 0" stroke="#33586B" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/><path d="M 188 138 q 14 -22 28 0 t 28 0 t 28 0" stroke="#33586B" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/><path d="M 300 138 q 14 -22 28 0 t 28 0 t 28 0" stroke="#33586B" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/><path d="M 412 138 q 14 -22 28 0 t 28 0 t 28 0" stroke="#33586B" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M 524 138 q 14 -22 28 0 t 28 0 t 28 0" stroke="#33586B" stroke-width="6" fill="none" stroke-linecap="round" opacity="1.0"/><text x="24" y="190" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The same small motion gives attention a steady place to rest.</text></svg>