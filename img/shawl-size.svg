<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing the shawl up or down</title><rect width="640" height="354" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing the shawl up or down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Only the number of mesh repeats changes</text><line x1="132" y1="240" x2="546" y2="240" stroke="#DDD4C6" stroke-width="1.2"/><text x="202.33333333333334" y="118" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Scarf-like</text><rect x="142" y="180" width="121" height="60" fill="#33586B" opacity="0.59"/><text x="202.33333333333334" y="257" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">12-14</text><text x="341.0" y="118" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">As written</text><rect x="281" y="158" width="121" height="82" fill="#33586B" opacity="0.70"/><text x="341.0" y="257" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">16-20</text><text x="479.6666666666667" y="118" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Oversized</text><rect x="419" y="130" width="121" height="110" fill="#33586B" opacity="0.82"/><text x="479.6666666666667" y="257" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">22-26</text><text x="24" y="296" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The mesh body repeat is written to be worked as many times as you like before the edging, so</text><text x="24" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">resizing this shawl is unusually simple.</text></svg>