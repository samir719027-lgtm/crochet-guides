<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" width="640" height="388" font-family="'Work Sans', -apple-system, sans-serif"><title>Scaling up without breaking the divide</title><rect width="640" height="388" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Scaling up without breaking the divide</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">8 groups, whatever the stitch count</text><rect x="24.0" y="270" width="592" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="270" width="4" height="58" rx="2" fill="#33586B"/><text x="40.0" y="292" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Keep them in proportion</text><text x="40.0" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">lengthen each tentacle by a few extra sc rounds before the colour change</text><text x="24" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Either route keeps the tentacles equal length. What changes is how thick each one is, and</text><text x="24" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">how far apart they sit.</text></svg>