<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 317" width="640" height="317" font-family="'Work Sans', -apple-system, sans-serif"><title>Which to learn first</title><rect width="640" height="317" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Which to learn first</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The honest beginner&#x27;s order</text><rect x="24" y="96" width="592" height="52" rx="4" fill="#33586B"/><text x="320.0" y="128" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Which should you learn first?</text><path d="M 320.0 148 V 164" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 116.66666666666667 164 V 182" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="24.0" y="182" width="185" height="91" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24.0" y="182" width="4" height="91" rx="2" fill="#33586B"/><text x="40.0" y="208" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Start with regular</text><text x="40.0" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One loop, one motion.</text><text x="40.0" y="243" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Learn tension and</text><text x="40.0" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stitches there.</text><path d="M 320.0 148 V 164" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 320.0 164 V 182" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="227.33333333333334" y="182" width="185" height="91" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="227.33333333333334" y="182" width="4" height="91" rx="2" fill="#A63B4A"/><text x="243.33333333333334" y="208" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Then try Tunisian</text><text x="243.33333333333334" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">It suits blankets,</text><text x="243.33333333333334" y="243" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">bags and warm</text><text x="243.33333333333334" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">wearables.</text><path d="M 320.0 148 V 164" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 523.3333333333334 164 V 182" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="430.6666666666667" y="182" width="185" height="91" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="430.6666666666667" y="182" width="4" height="91" rx="2" fill="#D8A23C"/><text x="446.6666666666667" y="208" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Not too early</text><text x="446.6666666666667" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A new tool and a</text><text x="446.6666666666667" y="243" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">dense fabric are</text><text x="446.6666666666667" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">extra load.</text><text x="24" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Regular first, Tunisian as a second craft.</text></svg>