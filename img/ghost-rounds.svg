<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" width="640" height="494" font-family="'Work Sans', -apple-system, sans-serif"><title>Body, round by round</title><rect width="640" height="494" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Body, round by round</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Six increase rounds, then five even ones</text><rect x="266" y="100" width="164" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="284" cy="118" r="11" fill="#33586B"/><text x="284" y="122" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="304" y="122" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rounds 1-6</text><text x="278" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">inc every round, 6 to</text><text x="278" y="158" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">36 sts</text><rect x="266" y="206" width="164" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="284" cy="224" r="11" fill="#33586B"/><text x="284" y="228" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="304" y="228" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">5 even rounds</text><text x="278" y="250" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at 36 sts, no shaping,</text><text x="278" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stuff firmly</text><rect x="266" y="312" width="164" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="284" cy="330" r="11" fill="#33586B"/><text x="284" y="334" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="304" y="334" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Round 12</text><text x="278" y="356" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the scallop round, 6</text><text x="278" y="370" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">scallops</text><text x="24" y="440" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Begin stuffing firmly as you approach the final even rounds rather than after them, because</text><text x="24" y="456" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">a round of solid single crochet over unstuffed fabric closes up more tightly than the same</text><text x="24" y="472" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">round over a full one.</text></svg>