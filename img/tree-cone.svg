<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" width="640" height="302" font-family="'Work Sans', -apple-system, sans-serif"><title>How the cone is built</title><rect width="640" height="302" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How the cone is built</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Wide base, straight stack, then the tip</text><path d="M 344 122 L 454 216 L 234 216 Z" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 344 122 L 378 186 L 310 186 Z" fill="#A63B4A" opacity="0.5"/><path d="M 378 186 L 434 132 L 254 132 L 310 186 Z" fill="#D8A23C" opacity="0.5"/><path d="M 434 132 L 454 216 L 234 216 L 254 132 Z" fill="#33586B" opacity="0.5"/><rect x="336" y="216" width="16" height="8" rx="2" fill="#A63B4A"/><text x="344" y="112" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">TIP - decrease rounds</text><text x="344" y="159.0" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">straight rounds</text><text x="344" y="174.0" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">increase rounds - base</text><text x="344" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="middle">size = base diameter + straight rounds</text><text x="24" y="280" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every extra base round adds roughly 6 stitches of width.</text></svg>