<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="'Work Sans', -apple-system, sans-serif"><title>The heel gusset</title><rect width="640" height="390" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The heel gusset</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A wedge of extra stitches, added symmetrically</text><rect x="364.0" y="96" width="83" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="364.0" y="96" width="4" height="80" rx="2" fill="#A63B4A"/><text x="380.0" y="118" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">The wedge</text><text x="380.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">extra</text><text x="380.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">stitches</text><rect x="460.6666666666667" y="96" width="83" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="460.6666666666667" y="96" width="4" height="80" rx="2" fill="#A63B4A"/><text x="476.6666666666667" y="118" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Same two points</text><text x="476.6666666666667" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">one st</text><text x="476.6666666666667" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">after the</text><rect x="557.3333333333334" y="96" width="83" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="557.3333333333334" y="96" width="4" height="80" rx="2" fill="#A63B4A"/><text x="573.3333333333334" y="118" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Symmetry</text><text x="573.3333333333334" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">random</text><text x="573.3333333333334" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">placement</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Gusset increases are the most commonly skipped step in a first attempt, and skipping them is</text><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the most common reason a sock will not stretch over the heel.</text></svg>