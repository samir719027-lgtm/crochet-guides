<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="'Work Sans', -apple-system, sans-serif"><title>Flat where it matters</title><rect width="640" height="390" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Flat where it matters</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Legs stand, ears hold, tail curls</text><rect x="24" y="92" width="284" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="284" height="34" rx="4" fill="#33586B"/><rect x="24" y="116" width="284" height="10" fill="#33586B"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">LEGS: SEW CLOSED</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stuff lightly, then flatten the opening</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">and sew it shut rather than</text><text x="38" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">decreasing, so the leg has a</text><text x="38" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">flat base to stand on</text><rect x="332" y="92" width="284" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="332" y="92" width="284" height="34" rx="4" fill="#D8A23C"/><rect x="332" y="116" width="284" height="10" fill="#D8A23C"/><text x="346" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">EARS: WORK FLAT</text><text x="346" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">ch 3, 2 sts, then inc to 4</text><text x="346" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="346" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">and sc across on row 3</text><text x="346" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">with the last 2 sts in white</text><text x="346" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">for the inner ear</text><rect x="24" y="256" width="592" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24" y="256" width="4" height="58" rx="2" fill="#A63B4A"/><text x="42" y="280" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">The tail is the same idea in reverse</text><text x="42" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Work it 1-2in / 2.5-5cm longer than you think you will need, stuff it very lightly, and tack</text><text x="42" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the curled tip to one side of the body at an angle, because a floppy tail curls more</text><text x="24" y="336" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Working the ears flat rather than in the round is what keeps them structured instead of</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">floppy, and a longer tail plus a light stuffing is what makes the curl look natural once it</text><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">is tacked down.</text></svg>