<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="'Work Sans', -apple-system, sans-serif"><title>One rectangle, two seams</title><rect width="640" height="420" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">One rectangle, two seams</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The sleeves are the unseamed ends</text><rect x="24.0" y="254" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="254" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="276" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Chain first</text><text x="40.0" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Cuff-to-cuff length plus 2</text><text x="40.0" y="305" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">chains for turning, then dc</text><rect x="228.0" y="254" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="254" width="4" height="54" rx="2" fill="#22404F"/><text x="244.0" y="276" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Mark, then pin</text><text x="244.0" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Fold cuff to cuff, mark the</text><text x="244.0" y="305" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">sleeve sections before</text><rect x="432.0" y="254" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="254" width="4" height="54" rx="2" fill="#D8A23C"/><text x="448.0" y="276" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Edge last</text><text x="448.0" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">One sc or slip stitch round</text><text x="448.0" y="305" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">around the whole perimeter</text><text x="24" y="350" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">There is no sleeve setting, no collar and no closure to get wrong. One rectangle and two</text><text x="24" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">seams, which is why this works as a first garment.</text></svg>