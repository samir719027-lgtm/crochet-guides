<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="'Work Sans', -apple-system, sans-serif"><title>Pumpkin, round by round</title><rect width="640" height="320" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Pumpkin, round by round</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">How the body grows to 24 stitches, then closes</text><rect x="24" y="92" width="600" height="28" fill="#22404F"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Round</text><text x="124" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Stitches</text><text x="234" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What to do</text><rect x="24" y="120" width="600" height="26" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">1</text><text x="124" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">6</text><text x="234" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Magic ring, 6 sc</text><line x1="24" y1="146" x2="624" y2="146" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="146" width="600" height="26" fill="#E4DACB"/><text x="34" y="163" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">2</text><text x="124" y="163" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">12</text><text x="234" y="163" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Inc in every stitch</text><line x1="24" y1="172" x2="624" y2="172" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="172" width="600" height="26" fill="#FFFFFF"/><text x="34" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">3</text><text x="124" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">18</text><text x="234" y="189" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">[sc 1, inc] around</text><line x1="24" y1="198" x2="624" y2="198" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="198" width="600" height="26" fill="#E4DACB"/><text x="34" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">4</text><text x="124" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="234" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">BLO, [sc 2, inc] around</text><line x1="24" y1="224" x2="624" y2="224" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="224" width="600" height="26" fill="#FFFFFF"/><text x="34" y="241" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">5-7</text><text x="124" y="241" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="234" y="241" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">BLO, sc every stitch</text><line x1="24" y1="250" x2="624" y2="250" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="250" width="600" height="26" fill="#E4DACB"/><text x="34" y="267" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">8-9</text><text x="124" y="267" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">18</text><text x="234" y="267" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">BLO, [sc 2, dec] around</text><line x1="24" y1="276" x2="624" y2="276" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="600" height="184" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Rounds 4 to 9 are worked in back loop only - that is the rib.</text></svg>