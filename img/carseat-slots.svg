<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="'Work Sans', -apple-system, sans-serif"><title>The five harness slots</title><rect width="640" height="580" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The five harness slots</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two shoulders, two hips, one crotch</text><rect x="56" y="176" width="252" height="272" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 68.6 176 L 68.6 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 81.2 176 L 81.2 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 93.8 176 L 93.8 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 106.4 176 L 106.4 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 119.0 176 L 119.0 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 131.6 176 L 131.6 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 144.2 176 L 144.2 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 156.8 176 L 156.8 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 169.4 176 L 169.4 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 182.0 176 L 182.0 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 194.6 176 L 194.6 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 207.2 176 L 207.2 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 219.8 176 L 219.8 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 232.4 176 L 232.4 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 245.0 176 L 245.0 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 257.6 176 L 257.6 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 270.2 176 L 270.2 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 282.8 176 L 282.8 448" stroke="#DDD4C6" stroke-width="0.8"/><path d="M 295.4 176 L 295.4 448" stroke="#DDD4C6" stroke-width="0.8"/><rect x="87.5" y="238" width="37.8" height="62" fill="#33586B" opacity="0.85"/><text x="106.4" y="273.0" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">SHOULDER</text><rect x="238.7" y="238" width="37.8" height="62" fill="#33586B" opacity="0.85"/><text x="257.6" y="273.0" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">SHOULDER</text><rect x="87.5" y="362" width="37.8" height="62" fill="#22404F" opacity="0.85"/><text x="106.4" y="397.0" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">HIP</text><rect x="238.7" y="362" width="37.8" height="62" fill="#22404F" opacity="0.85"/><text x="257.6" y="397.0" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">HIP</text><rect x="163.1" y="486" width="37.8" height="62" fill="#A63B4A" opacity="0.85"/><text x="182.0" y="521.0" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">CROTCH</text><text x="24" y="492" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Five buttonhole-style slots are worked into the fabric as it is made, so the harness passes</text><text x="24" y="508" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">straight through instead of fighting the blanket. Each slot is closed on the following row,</text><text x="24" y="524" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">treating the chain space as three stitches.</text></svg>