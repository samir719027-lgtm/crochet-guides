<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="'Work Sans', -apple-system, sans-serif"><title>Getting it to stand</title><rect width="640" height="420" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Getting it to stand</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Leg length first, attachment second</text><rect x="24.0" y="322" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="322" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="344" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Same height</text><text x="40.0" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Attach every leg at the same height on the</text><text x="40.0" y="373" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">body, not by eye</text><rect x="330.0" y="322" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="322" width="4" height="54" rx="2" fill="#A63B4A"/><text x="346.0" y="344" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Uneven legs</text><text x="346.0" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Almost the only reason a finished dinosaur</text><text x="346.0" y="373" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">will not stand</text></svg>