<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" width="640" height="358" font-family="'Work Sans', -apple-system, sans-serif"><title>Beginner vs advanced styles</title><rect width="640" height="358" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Beginner vs advanced styles</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The difference is how much you have to keep track of</text><line x1="150" y1="244" x2="512" y2="244" stroke="#DDD4C6" stroke-width="1.2"/><text x="187.4" y="128" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Plain triangle</text><rect x="160" y="217" width="55" height="27" fill="#33586B" opacity="0.45"/><text x="187.4" y="261" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">1 stitch</text><text x="260.2" y="128" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Granny</text><rect x="233" y="201" width="55" height="43" fill="#33586B" opacity="0.53"/><text x="260.2" y="261" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">+ edge</text><text x="333.0" y="128" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Our dc version</text><rect x="306" y="209" width="55" height="35" fill="#33586B" opacity="0.49"/><text x="333.0" y="261" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">no repeats</text><text x="405.79999999999995" y="128" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Lace or applique</text><rect x="378" y="153" width="55" height="91" fill="#33586B" opacity="0.76"/><text x="405.79999999999995" y="261" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">count carefully</text><text x="478.59999999999997" y="128" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Colourwork</text><rect x="451" y="140" width="55" height="104" fill="#33586B" opacity="0.82"/><text x="478.59999999999997" y="261" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">changes</text><text x="24" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">If most of the styles feel like a stretch right now, our own bandana pattern sticks to plain</text><text x="24" y="316" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">double crochet throughout, with no lace repeats or colour changes to track.</text></svg>