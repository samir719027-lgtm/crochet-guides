<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" font-family="'Work Sans', -apple-system, sans-serif"><title>A stitch slips off the hook</title><rect width="640" height="402" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">A stitch slips off the hook</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Stop, find the end of the unravel, then re-insert</text><rect x="24.0" y="238" width="286" height="72" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="238" width="4" height="72" rx="2" fill="#A63B4A"/><text x="40.0" y="260" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">The cause</text><text x="40.0" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Work set down without securing the loop, or a</text><text x="40.0" y="289" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">last stitch that was looser than the rest</text><rect x="330.0" y="238" width="286" height="72" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="238" width="4" height="72" rx="2" fill="#33586B"/><text x="346.0" y="260" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">The prevention</text><text x="346.0" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A cheap stitch marker, or even a bobby pin,</text><text x="346.0" y="289" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">clipped through the loop first</text><text x="24" y="364" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The first stitch worked after a slip is almost always too tight, because you are pulling</text><text x="24" y="380" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">harder than usual to recover the lost work.</text></svg>