<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Work Sans', -apple-system, sans-serif"><title>hdc vs sc, quick</title><rect width="640" height="330" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">hdc vs sc, quick</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The comparison table, visualised</text><rect x="24" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="280" height="34" rx="4" fill="#33586B"/><rect x="24" y="120" width="280" height="10" fill="#33586B"/><text x="38" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">SINGLE CROCHET</text><text x="38" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Dense, firm fabric.</text><text x="38" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Slower to work.</text><text x="38" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Best hook: 5.0mm</text><text x="38" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">for this yarn.</text><rect x="328" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="96" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="328" y="120" width="280" height="10" fill="#A63B4A"/><text x="342" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">HALF DOUBLE</text><text x="342" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Softer, more drape.</text><text x="342" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Roughly 30% faster.</text><text x="342" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Best hook: 5.5mm</text><text x="342" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">for this yarn.</text><text x="24" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Neither is better. Pick the drape you want.</text></svg>