<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="'Work Sans', -apple-system, sans-serif"><title>Where to slow down</title><rect width="640" height="480" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Where to slow down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Reusable skills against one-offs</text><rect x="24" y="92" width="186" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="186" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="186" height="8" fill="#33586B"/><text x="117.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SCARVES</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Chain and single crochet, no</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">shaping, so nothing structural</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">can distort. The forgiving</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">place to start.</text><rect x="224" y="92" width="186" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="92" width="186" height="30" rx="4" fill="#22404F"/><rect x="224" y="114" width="186" height="8" fill="#22404F"/><text x="317.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HATS AND COWLS</text><text x="236" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">A joining round is a skill you</text><text x="236" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">will use in almost every future</text><text x="236" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">hat, bag or amigurumi piece,</text><text x="236" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">so it is worth slowing down.</text><rect x="424" y="92" width="186" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="92" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="424" y="114" width="186" height="8" fill="#D8A23C"/><text x="517.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HEADBAND</text><text x="436" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">The twist-and-sew closure is a</text><text x="436" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">neat trick specific to that one</text><text x="436" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">shape, so follow the</text><text x="436" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">instructions and move on.</text><rect x="24" y="240" width="186" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="240" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="24" y="262" width="186" height="8" fill="#D8A23C"/><text x="117.0" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">PONCHO</text><text x="36" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Two rectangles and a seam. The</text><text x="36" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">first garment on the list that</text><text x="36" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">asks you to join pieces.</text><rect x="224" y="240" width="186" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="240" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="224" y="262" width="186" height="8" fill="#A63B4A"/><text x="317.0" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">CARDIGAN</text><text x="236" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Gauge, ease and seaming</text><text x="236" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">multiple pieces. The two that</text><text x="236" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">ask the most sit at the top.</text><rect x="424" y="240" width="186" height="130" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="240" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="424" y="262" width="186" height="8" fill="#A63B4A"/><text x="517.0" y="260" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">CROP TOP</text><text x="436" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Designed to be worked from your</text><text x="436" y="303" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">own gauge swatch rather than a</text><text x="436" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rigid size chart.</text><text x="24" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Paying attention to which patterns teach a technique you will reuse constantly, versus one</text><text x="24" y="424" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">that is more self-contained, helps you decide where to slow down and absorb a technique</text><text x="24" y="440" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">versus where to just follow the instructions.</text></svg>