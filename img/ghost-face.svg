<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" font-family="'Work Sans', -apple-system, sans-serif"><title>Where the face goes</title><rect width="640" height="328" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Where the face goes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Higher than you would expect</text><rect x="300.0" y="190" width="316" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="300.0" y="190" width="4" height="64" rx="2" fill="#33586B"/><text x="316.0" y="212" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Mouth options</text><text x="316.0" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">a French knot or short stitch for a classic look,</text><text x="316.0" y="241" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">an embroidered o for a surprised one</text><text x="24" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A ghost silhouette reads correctly with more body visible below the eyes than above them,</text><text x="24" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">which is why the eyes sit higher here than on a typical animal.</text></svg>