<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" font-family="'Work Sans', -apple-system, sans-serif"><title>The one-piece hood</title><rect width="640" height="394" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The one-piece hood</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">No seam at the neck</text><rect x="300.0" y="254" width="92" height="74" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="300.0" y="254" width="4" height="74" rx="2" fill="#33586B"/><text x="316.0" y="276" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Gradual, not…</text><text x="316.0" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">over</text><text x="316.0" y="305" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">several</text><rect x="412.0" y="254" width="92" height="74" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="412.0" y="254" width="4" height="74" rx="2" fill="#33586B"/><text x="428.0" y="276" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Then decreas…</text><text x="428.0" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">to close</text><text x="428.0" y="305" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the top</text><rect x="524.0" y="254" width="92" height="74" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="524.0" y="254" width="4" height="74" rx="2" fill="#33586B"/><text x="540.0" y="276" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Work it at g…</text><text x="540.0" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">not looser,</text><text x="540.0" y="305" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">or the head</text><text x="24" y="356" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">If the first attempt looks uneven, work just the transition rounds as a small swatch first</text><text x="24" y="372" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rather than committing to the full bunting.</text></svg>