<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" width="640" height="444" font-family="'Work Sans', -apple-system, sans-serif"><title>Yarn, colour and faces</title><rect width="640" height="444" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Yarn, colour and faces</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Smooth worsted, and keep the faces tiny</text><rect x="24" y="92" width="290" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="116" width="290" height="10" fill="#33586B"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Works well</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Smooth worsted weight,</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">so stuffing stays</text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">hidden and details</text><text x="38" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stay crisp</text><rect x="338" y="92" width="290" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="92" width="290" height="34" rx="4" fill="#A63B4A"/><rect x="338" y="116" width="290" height="10" fill="#A63B4A"/><text x="352" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Avoid</text><text x="352" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Fluffy or eyelash yarn,</text><text x="352" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">tempting for a ghost</text><text x="352" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">but it buries the</text><text x="352" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">shape and the</text><text x="352" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">embroidery</text><text x="24" y="292" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Faces: two stitches can read as a whole expression at this size</text><rect x="24" y="310" width="286" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="50" cy="341" r="13" fill="#33586B"/><circle cx="45" cy="338" r="2.6" fill="#FFFFFF"/><circle cx="55" cy="338" r="2.6" fill="#FFFFFF"/><path d="M 44 348 q 6 5 12 0" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="72" y="337" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">embroidered</text><text x="72" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">cannot pop off, safer for a</text><text x="72" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">trick-or-treat bag</text><rect x="324" y="310" width="286" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="350" cy="341" r="13" fill="#D8A23C"/><circle cx="345" cy="338" r="2.6" fill="#FFFFFF"/><circle cx="355" cy="338" r="2.6" fill="#FFFFFF"/><text x="372" y="337" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">safety eyes</text><text x="372" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">fix before closing so the backs</text><text x="372" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stay inside</text><text x="24" y="422" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">All three shapes want the same yarn, so the colour is the only real choice you make.</text></svg>