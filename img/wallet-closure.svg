<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Work Sans', -apple-system, sans-serif"><title>Closure</title><rect width="640" height="520" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Closure</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Mark it folded, not flat</text><rect x="24.0" y="348" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="348" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="370" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Magnetic snap</text><text x="40.0" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Closes with a clean, effortless pull, sized</text><text x="40.0" y="399" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">not to add bulk at the fold</text><rect x="330.0" y="348" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="348" width="4" height="54" rx="2" fill="#D8A23C"/><text x="346.0" y="370" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Sew-on snap</text><text x="346.0" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Slightly more secure if the wallet lives in a</text><text x="346.0" y="399" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">bag with keys or hard items</text><text x="24" y="432" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The finished main body panel should hold a folded position on its own, without springing</text><text x="24" y="448" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">back open, even before the snap is attached. If it does not, the fabric needs to be denser.</text></svg>