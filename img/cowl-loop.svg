<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" font-family="'Work Sans', -apple-system, sans-serif"><title>A cowl is a closed loop</title><rect width="640" height="368" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">A cowl is a closed loop</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One ring, worn over the head</text><ellipse cx="344" cy="158" rx="128" ry="78" fill="none" stroke="#33586B" stroke-width="26"/><ellipse cx="344" cy="158" rx="128" ry="78" fill="none" stroke="#E4DACB" stroke-width="6" stroke-dasharray="4 14"/><path d="M 216 158 l -34 34 M 472 158 l 34 -34" stroke="#33586B" stroke-width="26" stroke-linecap="round"/><text x="344" y="52" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#22404F" text-anchor="middle">one closed ring, ch 60</text><text x="344" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="middle">no ends to tuck, nothing to tie</text><text x="24" y="330" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A cowl slips over the head and stays put, where a scarf is a flat open strip you wrap and</text><text x="24" y="346" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">tie.</text></svg>