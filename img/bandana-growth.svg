<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family="'Work Sans', -apple-system, sans-serif"><title>How the triangle grows</title><rect width="640" height="314" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How the triangle grows</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Row 1 starts at 2 stitches and doubles up by 2</text><path d="M 174 218 L 143.33333333333334 212 L 204.66666666666666 212 Z" fill="#33586B" opacity="0.32 + 0.32"/><text x="174" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Rows 1-6</text><text x="174" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">12 sts wide</text><path d="M 324 218 L 262.6666666666667 212 L 385.3333333333333 212 Z" fill="#33586B" opacity="0.32 + 0.52"/><text x="324" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Rows 1-12</text><text x="324" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">24 sts wide</text><path d="M 474 218 L 382.0 212 L 566.0 212 Z" fill="#D8A23C" opacity="0.32 + 0.72"/><text x="474" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Rows 1-18</text><text x="474" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">36 sts wide</text><text x="24" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every row adds two stitches - one at each edge.</text></svg>