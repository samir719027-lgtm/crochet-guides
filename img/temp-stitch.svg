<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Work Sans', -apple-system, sans-serif"><title>The stitch pattern</title><rect width="640" height="400" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The stitch pattern</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">50 stitches, one bobble every 5</text><rect x="24" y="190" width="592" height="28" fill="#33586B"/><text x="34" y="209" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4"></text><text x="138" y="209" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Count</text><text x="246" y="209" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Note</text><rect x="24" y="218" width="592" height="30" fill="#FFFFFF"/><text x="34" y="235" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Rows</text><text x="138" y="235" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">365</text><text x="246" y="235" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">One row per day, for a day</text><line x1="24" y1="248" x2="616" y2="248" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="248" width="592" height="30" fill="#E4DACB"/><text x="34" y="265" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Width</text><text x="138" y="265" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">50 sts</text><text x="246" y="265" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Chain in multiples of 5 so the bobble repeat stays aligned</text><line x1="24" y1="278" x2="616" y2="278" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="278" width="592" height="30" fill="#FFFFFF"/><text x="34" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Finished</text><text x="138" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">30 x 60-65in</text><text x="246" y="295" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">A comfortable lap-and-legs sofa throw size</text><line x1="24" y1="308" x2="616" y2="308" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="308" width="592" height="30" fill="#E4DACB"/><text x="34" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Border</text><text x="138" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">2 rounds sc</text><text x="246" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">3 sc in each corner on both rounds</text><line x1="24" y1="338" x2="616" y2="338" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="190" width="592" height="148" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A bobble every fifth stitch gives the raised texture seen in the photo without the cost of a</text><text x="24" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">full bobble row every single day, which matters over 365 repetitions.</text></svg>