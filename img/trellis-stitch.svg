<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" font-family="'Work Sans', -apple-system, sans-serif"><title>What a front-post double crochet does</title><rect width="640" height="394" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">What a front-post double crochet does</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Around the post, not into the top</text><rect x="24" y="200" width="176" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="218" r="11" fill="#A63B4A"/><text x="42" y="222" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="222" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Not the top</text><text x="36" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">you do not work into the</text><text x="36" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">top of the stitch</text><path d="M 204 237.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="200" width="176" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="218" r="11" fill="#A63B4A"/><text x="238" y="222" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="222" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Around the post</text><text x="232" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">front to back to front</text><text x="232" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">again</text><path d="M 400 237.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="416" y="200" width="176" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="434" cy="218" r="11" fill="#A63B4A"/><text x="434" y="222" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="454" y="222" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">It stands proud</text><text x="428" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the new stitch is raised</text><text x="428" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">above the background</text><text x="24" y="356" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every raised line in this fabric is a front-post double crochet, and the texture depends</text><text x="24" y="372" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">entirely on that stitch sitting in front of the background.</text></svg>