<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="'Work Sans', -apple-system, sans-serif"><title>Mistakes that make it look off</title><rect width="640" height="450" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Mistakes that make it look off</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Five problems and their fixes</text><rect x="24" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="24" y="114" width="186" height="8" fill="#A63B4A"/><text x="117.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">EARS TOO SYMMETRICAL</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Angle both forward and let one</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">drape differently; mirrored</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">ears read alert, not relaxed</text><rect x="224" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="92" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="224" y="114" width="186" height="8" fill="#A63B4A"/><text x="317.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">FLAT MUZZLE</text><text x="236" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Stuff it firmly before</text><text x="236" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">attaching and favour a domed</text><text x="236" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">shape over a flat disc</text><rect x="424" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="92" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="424" y="114" width="186" height="8" fill="#D8A23C"/><text x="517.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">LEGS DIFFERENT LENGTHS</text><text x="436" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Measure each against the first</text><text x="436" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">and adjust stuffing rather</text><text x="436" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">than reworking a leg</text><rect x="24" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="234" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="24" y="256" width="186" height="8" fill="#D8A23C"/><text x="117.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HOLE AT THE TOP</text><text x="36" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Invisible decrease on the last</text><text x="36" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">shaping round, then weave the</text><text x="36" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tail through and pull firm</text><rect x="224" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="234" width="186" height="30" rx="4" fill="#33586B"/><rect x="224" y="256" width="186" height="8" fill="#33586B"/><text x="317.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">MUZZLE BLEEDS INTO BODY</text><text x="236" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Shift the colour change a round</text><text x="236" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">earlier or later to suit your</text><text x="236" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tension; check as you go</text><text x="24" y="396" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A loose closure leaves a visible increase hole at the top of the head. The decreases alone</text><text x="24" y="412" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">will not seal it: the tail has to go through the remaining stitches and pull tight.</text></svg>