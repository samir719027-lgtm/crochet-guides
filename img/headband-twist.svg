<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" font-family="'Work Sans', -apple-system, sans-serif"><title>The twist detail</title><rect width="640" height="232" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The twist detail</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One fold in the band, a snug seam to hold it</text><rect x="64" y="100" width="512" height="68" rx="24" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 214 100 L 314 168 M 194 168 L 294 100" stroke="#22404F" stroke-width="7" stroke-linecap="round" opacity="0.85"/><path d="M 214 100 L 314 168 M 194 168 L 294 100" stroke="#D8A23C" stroke-width="2" stroke-linecap="round"/><text x="269" y="98.0" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">twist</text><text x="269" y="158.0" font-family="'Work Sans', -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">tight whip stitches</text><text x="269" y="174.0" font-family="'Work Sans', -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">keep it crisp</text><text x="24" y="210" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The fold catches the light differently than the flat sections.</text></svg>