<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" font-family="'Work Sans', -apple-system, sans-serif"><title>Ornament 1: the puff-stitch star</title><rect width="640" height="348" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Ornament 1: the puff-stitch star</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Four loops per point, pulled through together</text><path d="M 344 100 L 360 155 L 418 154 L 371 187 L 390 241 L 344 206 L 298 241 L 317 187 L 270 154 L 328 155 Z" fill="#D8A23C" opacity="0.65" stroke="#A63B4A" stroke-width="2"/><circle cx="344" cy="178" r="18" fill="#EDE6D9"/><text x="344" y="286" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="middle">puff stitch: 5 points</text><text x="24" y="326" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Pull up 4 loops in the same stitch, 9 loops on the hook, then pull through for a standing puff.</text></svg>