<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="'Work Sans', -apple-system, sans-serif"><title>Three shapes, one set of rounds</title><rect width="640" height="430" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Three shapes, one set of rounds</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Golf-ball proportions, well under 20g each</text><rect x="24.0" y="264" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="117.33333333333333" y="298" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#D8A23C" text-anchor="middle">24</text><text x="117.33333333333333" y="318" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">sts after round 4</text><rect x="226.66666666666666" y="264" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="320.0" y="298" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#33586B" text-anchor="middle">&lt;20g</text><text x="320.0" y="318" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">yarn per shape</text><rect x="429.3333333333333" y="264" width="187" height="76" rx="4" fill="#EDE6D9"/><text x="522.6666666666666" y="298" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="600" fill="#A63B4A" text-anchor="middle">golf ball</text><text x="522.6666666666666" y="318" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">roughly the size</text><text x="24" y="392" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">All three shapes share rounds 1-4, so the only real difference is the colour and the</text><text x="24" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">finishing detail.</text></svg>