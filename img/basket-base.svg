<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" width="640" height="362" font-family="'Work Sans', -apple-system, sans-serif"><title>The base grows by six</title><rect width="640" height="362" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The base grows by six</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A flat circle, six more stitches a round</text><circle cx="344" cy="166" r="80" fill="none" stroke="#33586B" stroke-width="2" opacity="0.5"/><text x="420" y="158" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#22404F" text-anchor="end">rnd 10 = 60</text><circle cx="344" cy="166" r="66" fill="none" stroke="#33586B" stroke-width="2" opacity="0.5"/><text x="406" y="158" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#22404F" text-anchor="end">rnd 9 = 54</text><circle cx="344" cy="166" r="52" fill="none" stroke="#33586B" stroke-width="2" opacity="0.5"/><text x="392" y="158" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#22404F" text-anchor="end">rnd 8 = 48</text><circle cx="344" cy="166" r="38" fill="none" stroke="#33586B" stroke-width="2" opacity="0.5"/><text x="378" y="158" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#22404F" text-anchor="end">rnd 7 = 42</text><line x1="344" y1="128" x2="344" y2="86" stroke="#D8A23C" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="377" y1="147" x2="413" y2="126" stroke="#D8A23C" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="377" y1="185" x2="413" y2="206" stroke="#D8A23C" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="344" y1="204" x2="344" y2="246" stroke="#D8A23C" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="311" y1="185" x2="275" y2="206" stroke="#D8A23C" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="311" y1="147" x2="275" y2="126" stroke="#D8A23C" stroke-width="2.5" stroke-dasharray="4 4"/><text x="344" y="100" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#22404F" text-anchor="middle">+ 6 stitches every round</text><text x="48" y="262" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Keep the increases</text><text x="48" y="280" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">spread further apart as</text><text x="48" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the circle widens.</text><text x="24" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">That even spacing is what keeps the base lying flat instead of cupping or ruffling.</text></svg>