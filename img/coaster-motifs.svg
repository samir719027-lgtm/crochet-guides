<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298" font-family="'Work Sans', -apple-system, sans-serif"><title>Swap the motif, keep the coaster</title><rect width="640" height="298" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Swap the motif, keep the coaster</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The snowflake is only a starting point</text><circle cx="344" cy="162" r="86" fill="#EDE6D9" stroke="#DDD4C6"/><line x1="344" y1="116" x2="344" y2="210" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><line x1="314" y1="162" x2="344" y2="148" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><line x1="374" y1="162" x2="344" y2="148" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><line x1="302" y1="186" x2="344" y2="172" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><line x1="386" y1="186" x2="344" y2="172" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><line x1="292" y1="208" x2="344" y2="194" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><line x1="396" y1="208" x2="344" y2="194" stroke="#A63B4A" stroke-width="4" stroke-linecap="round"/><text x="344" y="100" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="middle">a christmas tree</text><text x="24" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A vertical line with two short diagonal branches, a star, or a single initial in the centre.</text></svg>