<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 572" width="640" height="572" font-family="'Work Sans', -apple-system, sans-serif"><title>Ear flaps and pom-poms</title><rect width="640" height="572" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Ear flaps and pom-poms</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two panels on the brim, then one border round</text><rect x="24" y="342" width="290" height="140" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="342" width="290" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="366" width="290" height="10" fill="#A63B4A"/><text x="38" y="365" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Clipped pom-pom</text><text x="38" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Can detach with pulling</text><text x="38" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="438" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">A choking hazard for</text><text x="38" y="458" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">younger or teething</text><text x="38" y="478" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">toddlers</text><rect x="338" y="342" width="290" height="140" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="342" width="290" height="34" rx="4" fill="#33586B"/><rect x="338" y="366" width="290" height="10" fill="#33586B"/><text x="352" y="365" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Sewn or gathered</text><text x="352" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Several passes of yarn</text><text x="352" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">secure it, or skip the</text><text x="352" y="438" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">pom-pom entirely and</text><text x="352" y="458" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">finish with a</text><text x="352" y="478" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">gathered point</text><text x="24" y="534" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A simple stripe is the easy customisation with no safety considerations: change colour every</text><text x="24" y="550" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">2-3 rounds through the straight section.</text></svg>