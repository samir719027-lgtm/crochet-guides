<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" font-family="'Work Sans', -apple-system, sans-serif"><title>A simple wind-down routine</title><rect width="640" height="240" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">A simple wind-down routine</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three steps that make the calm reliable</text><rect x="24" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#A63B4A"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">Pick a familiar stitch</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One you do not have to</text><text x="36" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">think about</text><path d="M 204 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="114" r="11" fill="#A63B4A"/><text x="238" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Set a timer</text><text x="232" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">15 to 20 minutes, not</text><text x="232" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">until you finish</text><path d="M 400 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="416" y="96" width="176" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="434" cy="114" r="11" fill="#A63B4A"/><text x="434" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="454" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Screens off</text><text x="428" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Treat it as the evening</text><text x="428" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">transition</text><text x="24" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A small repeated habit beats an occasional big project.</text></svg>