<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Work Sans', -apple-system, sans-serif"><title>Finishing and styling</title><rect width="640" height="520" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Finishing and styling</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The last round is cosmetic, the fibre is not</text><rect x="24.0" y="264" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="264" width="4" height="80" rx="2" fill="#33586B"/><text x="40.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Contrast brim</text><text x="40.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Switch colour at round 16</text><text x="40.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">and work the remaining</text><rect x="228.0" y="264" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="264" width="4" height="80" rx="2" fill="#33586B"/><text x="244.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Side stripes</text><text x="244.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The side rounds are</text><text x="244.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">identical, so you can</text><rect x="432.0" y="264" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="264" width="4" height="80" rx="2" fill="#33586B"/><text x="448.0" y="286" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Eyelet drawstring</text><text x="448.0" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A row of ch-1, skip-1 holes</text><text x="448.0" y="315" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">partway down, threaded for</text><text x="24" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Add 2-3 extra even rounds for a deeper side section if you want more ear coverage in cooler</text><text x="24" y="390" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">weather. The brim&#x27;s flare rate stays the same regardless of size.</text></svg>