<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Work Sans', -apple-system, sans-serif"><title>Why the spikes stand up</title><rect width="640" height="400" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why the spikes stand up</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Anchor the base, free the rest</text><rect x="24.0" y="236" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="236" width="4" height="54" rx="2" fill="#D8A23C"/><text x="40.0" y="258" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Unstuffed</text><text x="40.0" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A stuffed or stiffened</text><text x="40.0" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">spike is too heavy to stand</text><rect x="228.0" y="236" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="236" width="4" height="54" rx="2" fill="#22404F"/><text x="244.0" y="258" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Same yarn</text><text x="244.0" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">No stiffer yarn is needed,</text><text x="244.0" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">so the texture stays soft</text><rect x="432.0" y="236" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="236" width="4" height="54" rx="2" fill="#A63B4A"/><text x="448.0" y="258" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Free-standing</text><text x="448.0" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A paper triangle folded at</text><text x="448.0" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">its base stands the same</text><text x="24" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The spikes are three short rows worked flat and decreasing to a point, left entirely</text><text x="24" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">unstuffed. The attachment is what does the work, not the yarn.</text></svg>