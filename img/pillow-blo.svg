<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Why back-loop-only</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why back-loop-only</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The unworked front loops build the texture</text><rect x="60" y="196" width="132" height="96" rx="3" fill="#FFFFFF" stroke="#DDD4C6"/><path d="M 72 212 l 18 0 M 72 219 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 100 212 l 18 0 M 100 219 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 128 212 l 18 0 M 128 219 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 156 212 l 18 0 M 156 219 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 72 238 l 18 0 M 72 245 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 100 238 l 18 0 M 100 245 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 128 238 l 18 0 M 128 245 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 156 238 l 18 0 M 156 245 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 72 264 l 18 0 M 72 271 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 100 264 l 18 0 M 100 271 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 128 264 l 18 0 M 128 271 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 156 264 l 18 0 M 156 271 l 18 0" stroke="#22404F" stroke-width="2.5"/><text x="126" y="182" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#5A5148" text-anchor="middle" letter-spacing="0.3">BOTH LOOPS</text><rect x="228" y="196" width="132" height="96" rx="3" fill="#FFFFFF" stroke="#DDD4C6"/><path d="M 240 212 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 240 217 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 268 212 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 268 217 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 296 212 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 296 217 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 324 212 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 324 217 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 240 238 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 240 243 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 268 238 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 268 243 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 296 238 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 296 243 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 324 238 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 324 243 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 240 264 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 240 269 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 268 264 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 268 269 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 296 264 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 296 269 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><path d="M 324 264 l 18 0" stroke="#22404F" stroke-width="2.5"/><path d="M 324 269 q 9 7 18 0" fill="none" stroke="#A63B4A" stroke-width="2"/><text x="294" y="182" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#A63B4A" text-anchor="middle" letter-spacing="0.3">BACK LOOP ONLY</text><text x="392" y="230" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Flat and uniform.</text><text x="392" y="250" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Functional rather than</text><text x="392" y="270" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">intentional.</text><path d="M 380 300 h 60 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#A63B4A" stroke-width="2"/><text x="392" y="330" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The unworked front loops</text><text x="392" y="346" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stack into a nubby texture</text><text x="392" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">closer to boucle fabric.</text><text x="24" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A halo-heavy yarn like brushed acrylic or mohair blurs the ridges the unworked loops create,</text><text x="24" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">so a plain worsted with a tighter twist shows the texture off better from across a room.</text></svg>