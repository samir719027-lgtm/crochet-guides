<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="'Work Sans', -apple-system, sans-serif"><title>Choosing the yarn</title><rect width="640" height="270" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Choosing the yarn</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three specs make a first cardigan easier</text><line x1="152" y1="192" x2="526" y2="192" stroke="#DDD4C6" stroke-width="1.2"/><text x="215.66666666666666" y="88" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Worsted</text><rect x="162" y="100" width="107" height="92" fill="#33586B" opacity="0.82"/><text x="215.66666666666666" y="209" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">category 4</text><text x="341.0" y="88" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Light tone</text><rect x="287" y="120" width="107" height="72" fill="#33586B" opacity="0.71"/><text x="341.0" y="209" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">visible stitches</text><text x="466.3333333333333" y="88" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Machine-washable</text><rect x="413" y="107" width="107" height="85" fill="#33586B" opacity="0.78"/><text x="466.3333333333333" y="209" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">you will wear it</text><text x="24" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Pick worsted weight, a light or mid tone, and yarn you enjoy wearing.</text></svg>