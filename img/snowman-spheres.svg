<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" width="640" height="448" font-family="'Work Sans', -apple-system, sans-serif"><title>Two spheres and a join</title><rect width="640" height="448" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Two spheres and a join</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Bottom, head, and a scarf hiding the seam</text><rect x="424.0" y="96" width="61" height="86" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="424.0" y="96" width="4" height="86" rx="2" fill="#33586B"/><text x="440.0" y="118" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Bottom sphere</text><text x="440.0" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the</text><text x="440.0" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">larger</text><rect x="501.33333333333337" y="96" width="61" height="86" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="501.33333333333337" y="96" width="4" height="86" rx="2" fill="#33586B"/><text x="517.3333333333334" y="118" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Head</text><text x="517.3333333333334" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">6 sc,</text><text x="517.3333333333334" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">increase</text><rect x="578.6666666666667" y="96" width="61" height="86" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="578.6666666666667" y="96" width="4" height="86" rx="2" fill="#33586B"/><text x="594.6666666666667" y="118" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Scarf</text><text x="594.6666666666667" y="134" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">wrapped</text><text x="594.6666666666667" y="147" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">at the</text><text x="24" y="410" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Both spheres use the same shape: increase to 18, work even, then decrease 6 a round for 3</text><text x="24" y="426" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rounds while stuffing firmly.</text></svg>