<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" width="640" height="254" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing by age</title><rect width="640" height="254" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing by age</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The two levers the pattern uses</text><rect x="24" y="92" width="580" height="28" fill="#A63B4A"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Age</text><text x="144" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Changes</text><text x="364" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Finish</text><rect x="24" y="120" width="580" height="30" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">0-3 months</text><text x="144" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">As written</text><text x="364" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">about 2.5in / 6cm hand</text><line x1="24" y1="150" x2="604" y2="150" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="150" width="580" height="30" fill="#E4DACB"/><text x="34" y="167" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">3-6 months</text><text x="144" y="167" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">+1 hand round, chain 16</text><text x="364" y="167" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">roomier fit</text><line x1="24" y1="180" x2="604" y2="180" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="180" width="580" height="30" fill="#FFFFFF"/><text x="34" y="197" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">After that</text><text x="144" y="197" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Nail care takes over</text><text x="364" y="197" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">many stop needing them</text><line x1="24" y1="210" x2="604" y2="210" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="580" height="118" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="232" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One extra round and one extra chain do the whole size jump.</text></svg>