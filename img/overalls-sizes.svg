<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing, and the cloth-diaper variant</title><rect width="640" height="314" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing, and the cloth-diaper variant</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Everything runs off the foundation chain</text><rect x="24.0" y="196" width="286" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="196" width="4" height="58" rx="2" fill="#33586B"/><text x="40.0" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Cloth diapers</text><text x="40.0" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">add 2-3 sts to the chain: 30 instead of 27,</text><text x="40.0" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">or 36 instead of 33</text><rect x="330.0" y="196" width="286" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="196" width="4" height="58" rx="2" fill="#33586B"/><text x="346.0" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">A real check</text><text x="346.0" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">compare against a garment the baby already</text><text x="346.0" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">wears comfortably</text><text x="24" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Seat width, leg length and strap length all scale together, which is what keeps the</text><text x="24" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">proportions consistent between the two sizes.</text></svg>