<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 628" width="640" height="628" font-family="'Work Sans', -apple-system, sans-serif"><title>The adjustable neck strap</title><rect width="640" height="628" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The adjustable neck strap</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One strap, three holes, one button</text><rect x="300" y="96" width="146" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="114" r="11" fill="#33586B"/><text x="318" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="338" y="118" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">Join at a shoulder</text><text x="312" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">where the neck</text><text x="312" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">opening meets the</text><rect x="300" y="214" width="146" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="232" r="11" fill="#33586B"/><text x="318" y="236" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="338" y="236" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="start">Chain 1, then sc</text><text x="312" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">across the neck and</text><text x="312" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">down 1.5in / 4cm</text><rect x="300" y="332" width="146" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="350" r="11" fill="#33586B"/><text x="318" y="354" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="338" y="354" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">8-10 rows</text><text x="312" y="376" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">three 2-chain</text><text x="312" y="390" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">buttonholes, skip 2</text><rect x="300" y="450" width="146" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="318" cy="468" r="11" fill="#33586B"/><text x="318" y="472" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="338" y="472" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Sew the button</text><text x="312" y="494" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">plus one even sc</text><text x="312" y="508" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">border round</text><text x="24" y="590" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Because any of the three holes can reach the button, one bib covers roughly an inch of</text><text x="24" y="606" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">built-in adjustment before you need a new size.</text></svg>