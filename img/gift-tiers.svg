<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" font-family="'Work Sans', -apple-system, sans-serif"><title>What to buy, by level</title><rect width="640" height="404" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">What to buy, by level</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three tiers of certainty</text><rect x="24" y="100" width="120" height="60" rx="4" fill="#D8A23C"/><text x="84" y="126" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOR</text><text x="84" y="144" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">tier</text><text x="164" y="124" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#2A241E" text-anchor="start">FOR THE CROCHETER WHO HAS EVERYTHING</text><text x="164" y="146" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A 200+ stitch reference book outlasts every supply you can buy them</text><rect x="24" y="176" width="120" height="60" rx="4" fill="#33586B"/><text x="84" y="202" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOR</text><text x="84" y="220" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">tier</text><text x="164" y="200" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#2A241E" text-anchor="start">FOR ANYONE, ANY SKILL LEVEL</text><text x="164" y="222" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stitch markers, a project bag, a yarn bowl: useful whatever they make</text><rect x="24" y="252" width="120" height="60" rx="4" fill="#A63B4A"/><text x="84" y="278" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOR</text><text x="84" y="296" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#FFFFFF" text-anchor="middle">tier</text><text x="164" y="276" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#2A241E" text-anchor="start">FOR BEGINNERS</text><text x="164" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A hook set and yarn for the sizes they will need past project one</text><text x="24" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Notions are the safest gift of all, because they are not tied to a hook size, yarn weight,</text><text x="24" y="382" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">or style preference.</text></svg>