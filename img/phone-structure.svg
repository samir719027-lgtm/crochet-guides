<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="'Work Sans', -apple-system, sans-serif"><title>Step 2 &amp; 3: body, fold, seam</title><rect width="640" height="280" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Step 2 &amp; 3: body, fold, seam</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Back-loop rows in hdc make the grip</text><rect x="292" y="126" width="104" height="150" rx="12" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 282 114 L 406 114 L 406 196 L 374 196 L 374 106 L 314 106 L 314 196 L 282 196 Z" fill="#33586B" opacity="0.22" stroke="#33586B" stroke-width="2"/><text x="344" y="216" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">fold widthwise, seam both sides, top stays open</text><text x="24" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A plain rectangle folded and seamed is the whole case.</text></svg>