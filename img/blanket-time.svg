<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" font-family="'Work Sans', -apple-system, sans-serif"><title>Picking by time you have</title><rect width="640" height="328" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Picking by time you have</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two quick, two long, the rest standard</text><line x1="132" y1="214" x2="526" y2="214" stroke="#DDD4C6" stroke-width="1.2"/><text x="172.6" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Chunky throw</text><rect x="142" y="206" width="61" height="8" fill="#33586B" opacity="0.36"/><text x="172.6" y="231" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">quickest</text><text x="251.79999999999998" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Lapghan</text><rect x="221" y="206" width="61" height="8" fill="#33586B" opacity="0.36"/><text x="251.79999999999998" y="231" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">quickest</text><text x="331.0" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">In between</text><rect x="300" y="190" width="61" height="24" fill="#33586B" opacity="0.45"/><text x="331.0" y="231" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">normal pace</text><text x="410.20000000000005" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Mermaid tail</text><rect x="380" y="150" width="61" height="64" fill="#33586B" opacity="0.65"/><text x="410.20000000000005" y="231" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">scale stitch</text><text x="489.40000000000003" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Temperature</text><rect x="459" y="118" width="61" height="96" fill="#33586B" opacity="0.82"/><text x="489.40000000000003" y="231" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">a whole year</text><text x="24" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The two ends of the list are the genuine extremes: a super bulky yarn and a large hook cover</text><text x="24" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">ground fast, while the temperature blanket is one row a day for a full year. Everything else</text><text x="24" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">sits at a normal multi-week pace.</text></svg>