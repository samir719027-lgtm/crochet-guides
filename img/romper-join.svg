<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>Two legs, one body</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Two legs, one body</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The crotch join</text><rect x="108" y="104" width="68" height="150" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><text x="142" y="124" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">leg 1</text><text x="142" y="146" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#22404F" text-anchor="middle">ch 16, 7 rnds</text><rect x="312" y="104" width="68" height="150" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><text x="346" y="124" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">leg 2</text><text x="346" y="146" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#22404F" text-anchor="middle">ch 16, 7 rnds</text><path d="M 108 254 L 380 254 L 386 300 L 102 300 Z" fill="#E4DACB" stroke="#DDD4C6"/><text x="244" y="282" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">body, worked straight across both</text><path d="M 142 230 q 82 40 164 0" fill="none" stroke="#A63B4A" stroke-width="2.5" stroke-dasharray="5 4"/><text x="244" y="244" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">crotch join</text><line x1="148" y1="90" x2="148" y2="108" stroke="#A63B4A" stroke-width="2"/><line x1="142" y1="96" x2="154" y2="96" stroke="#A63B4A" stroke-width="2"/><line x1="340" y1="90" x2="340" y2="108" stroke="#A63B4A" stroke-width="2"/><line x1="334" y1="96" x2="346" y2="96" stroke="#A63B4A" stroke-width="2"/><text x="244" y="90" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">fasten off leg 2 only - keep a long tail on leg 1</text><text x="24" y="342" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The same join adult trousers use, scaled down: hold both tubes together and work one</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">continuous round across them.</text></svg>