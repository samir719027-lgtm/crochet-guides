<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="'Work Sans', -apple-system, sans-serif"><title>Flat circle, top third open</title><rect width="640" height="580" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Flat circle, top third open</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Worked from the centre out</text><rect x="268" y="96" width="160" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="114" r="11" fill="#33586B"/><text x="286" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="306" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Build the circle</text><text x="280" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">6, 12, 18, 24, 30 sts,</text><text x="280" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">then one even round</text><rect x="268" y="202" width="160" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="220" r="11" fill="#33586B"/><text x="286" y="224" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="306" y="224" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Mark the neck</text><text x="280" y="246" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the top third of the</text><text x="280" y="260" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">round, 10 stitches</text><rect x="268" y="308" width="160" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="326" r="11" fill="#33586B"/><text x="286" y="330" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="306" y="330" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rows below it</text><text x="280" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">work the other 20 sts</text><text x="280" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">for 2 more rows</text><rect x="268" y="414" width="160" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="432" r="11" fill="#33586B"/><text x="286" y="436" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="306" y="436" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Fasten off</text><text x="280" y="458" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">keeping the top edge</text><text x="280" y="472" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">open</text><text x="24" y="542" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Turning the piece so the marked section sits at the top is what makes the neck opening land</text><text x="24" y="558" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at the top rather than wherever the round happened to end.</text></svg>