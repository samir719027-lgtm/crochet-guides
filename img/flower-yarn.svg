<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" width="640" height="494" font-family="'Work Sans', -apple-system, sans-serif"><title>Yarn and keeping the shape</title><rect width="640" height="494" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Yarn and keeping the shape</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Cotton holds the petals, starch holds the bloom</text><rect x="24" y="244" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="244" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="268" width="290" height="10" fill="#33586B"/><text x="38" y="267" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">To keep it soft</text><text x="38" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Leave the petals</text><text x="38" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">flexible so the</text><text x="38" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">flower drapes</text><text x="38" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="380" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Lovely on a bag</text><text x="38" y="400" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">or a hat</text><rect x="338" y="244" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="244" width="290" height="34" rx="4" fill="#D8A23C"/><rect x="338" y="268" width="290" height="10" fill="#D8A23C"/><text x="352" y="267" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">To keep it crisp</text><text x="352" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">A light coat of</text><text x="352" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">spray starch or</text><text x="352" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">fabric stiffener</text><text x="352" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="380" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Brushed on, dried</text><text x="352" y="400" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">flat</text><text x="24" y="456" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">For a brooch or a hair clip the stiffener is the difference between a flower that holds its</text><text x="24" y="472" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">shape and one that goes limp in a bag.</text></svg>