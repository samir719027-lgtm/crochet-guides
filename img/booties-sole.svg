<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" width="640" height="248" font-family="'Work Sans', -apple-system, sans-serif"><title>The sole, round by round</title><rect width="640" height="248" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The sole, round by round</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A rounded oval, not a narrow point</text><rect x="24" y="92" width="592" height="28" fill="#22404F"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Round</text><text x="124" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Stitches</text><text x="234" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What to do</text><rect x="24" y="120" width="592" height="28" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">1</text><text x="124" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">18</text><text x="234" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Ch 9; sc 7, 3 sc in last ch, sc back, 2 sc</text><line x1="24" y1="148" x2="616" y2="148" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="148" width="592" height="28" fill="#E4DACB"/><text x="34" y="165" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">2</text><text x="124" y="165" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="234" y="165" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Inc, sc 6, inc x3, sc 6, inc x2</text><line x1="24" y1="176" x2="616" y2="176" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="176" width="592" height="28" fill="#FFFFFF"/><text x="34" y="193" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">3</text><text x="124" y="193" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="234" y="193" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Sc in every st around</text><line x1="24" y1="204" x2="616" y2="204" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="592" height="112" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="226" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Then rounds 4-9 build the sides at the same 24 stitches.</text></svg>