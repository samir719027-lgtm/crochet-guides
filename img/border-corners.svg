<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="'Work Sans', -apple-system, sans-serif"><title>Corners need adjusting</title><rect width="640" height="380" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Corners need adjusting</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Straight through puckers; spread it and it lies flat</text><rect x="24" y="108" width="280" height="196" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="108" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="132" width="280" height="10" fill="#A63B4A"/><text x="38" y="131" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">STRAIGHT THROUGH</text><path d="M 64 284 L 154 284 L 154 178 L 264 178" fill="none" stroke="#E4DACB" stroke-width="14" stroke-linejoin="miter"/><circle cx="154" cy="178" r="13" fill="#A63B4A"/><text x="154" y="166" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">pulls tight</text><text x="48" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">A 90-degree turn worked</text><text x="48" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">evenly puckers the corner.</text><rect x="328" y="108" width="280" height="196" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="108" width="280" height="34" rx="4" fill="#33586B"/><rect x="328" y="132" width="280" height="10" fill="#33586B"/><text x="342" y="131" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">SPREAD THE CORNER</text><path d="M 368 284 L 428 284 q 30 0 30 -30 L 458 254 q 0 -76 110 -76 L 568 178" fill="none" stroke="#E4DACB" stroke-width="14" stroke-linejoin="round"/><line x1="358" y1="284" x2="358" y2="262" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><line x1="376" y1="284" x2="376" y2="262" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><line x1="394" y1="284" x2="394" y2="262" stroke="#33586B" stroke-width="3" stroke-linecap="round"/><text x="458" y="166" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#22404F" text-anchor="middle">extra stitches</text><text x="352" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Work extra stitches or chain</text><text x="352" y="318" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">into the corner to fan it out.</text><text x="24" y="342" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Every one of these edgings needs a corner adjustment, because the edging has to turn a</text><text x="24" y="358" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">90-degree corner.</text></svg>