<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" width="640" height="494" font-family="'Work Sans', -apple-system, sans-serif"><title>Yarn and care</title><rect width="640" height="494" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Yarn and care</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Smooth white, and a wash that depends on the eyes</text><rect x="24" y="244" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="244" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="268" width="290" height="10" fill="#33586B"/><text x="38" y="267" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Hand-washing it</text><text x="38" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Only if the whole piece</text><text x="38" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">is acrylic and the eyes</text><text x="38" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">are embroidered</text><text x="38" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="380" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Not safety eyes</text><rect x="338" y="244" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="244" width="290" height="34" rx="4" fill="#A63B4A"/><rect x="338" y="268" width="290" height="10" fill="#A63B4A"/><text x="352" y="267" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Safety eyes</text><text x="352" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Wash gently and</text><text x="352" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">never wring, since that</text><text x="352" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">loosens the backings</text><text x="352" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="380" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Air-dry lying on</text><text x="352" y="400" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a towel</text><text x="24" y="456" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Snowmen spend eleven months of the year in a box, so the care instructions are worth reading</text><text x="24" y="472" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">before you start rather than after.</text></svg>