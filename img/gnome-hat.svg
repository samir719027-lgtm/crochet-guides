<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" width="640" height="416" font-family="'Work Sans', -apple-system, sans-serif"><title>Hat: widen, hold, taper</title><rect width="640" height="416" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Hat: widen, hold, taper</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The same increase as the body, then nothing</text><rect x="24" y="198" width="176" height="152" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="198" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="220" width="176" height="8" fill="#33586B"/><text x="112.0" y="218" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Brim</text><text x="36" y="246" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">as wide as the</text><text x="36" y="261" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">body top</text><text x="36" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="36" y="291" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">match the body</text><text x="36" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">before you go</text><text x="36" y="321" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">any further</text><rect x="216" y="198" width="176" height="152" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="198" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="220" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="218" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Sides</text><text x="228" y="246" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">8-10 rounds</text><text x="228" y="261" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">even, no</text><text x="228" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">shaping</text><text x="228" y="291" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="228" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">this is the long,</text><text x="228" y="321" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">straight middle</text><rect x="408" y="198" width="176" height="152" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="198" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="408" y="220" width="176" height="8" fill="#A63B4A"/><text x="496.0" y="218" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">Point</text><text x="420" y="246" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">1-2 sts less</text><text x="420" y="261" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">every couple</text><text x="420" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">of rounds</text><text x="420" y="291" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="420" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">fasten off, leave</text><text x="420" y="321" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">a tail to sew</text><text x="24" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Stop increasing as soon as the brim is wide enough to sit on the body. Every extra increase</text><text x="24" y="394" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">round at this stage makes the hat sit lower and wider than the body it has to perch on.</text></svg>