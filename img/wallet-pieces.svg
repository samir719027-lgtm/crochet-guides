<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="'Work Sans', -apple-system, sans-serif"><title>The pieces</title><rect width="640" height="490" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The pieces</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One long panel, three pockets, a snap</text><rect x="56" y="196" width="132" height="150" rx="3" fill="#33586B" opacity="0.16" stroke="#33586B"/><text x="122" y="186" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#33586B" text-anchor="middle">MAIN BODY</text><text x="122" y="272" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#2A241E" text-anchor="middle">ch 17, 16 sc</text><text x="122" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">about 9in long</text><rect x="72" y="306" width="86" height="26" rx="3" fill="#D8A23C" opacity="0.55" stroke="#D8A23C"/><rect x="80" y="288" width="86" height="26" rx="3" fill="#D8A23C" opacity="0.55" stroke="#D8A23C"/><rect x="88" y="270" width="86" height="26" rx="3" fill="#D8A23C" opacity="0.55" stroke="#D8A23C"/><text x="115" y="350" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">3 card pockets</text><rect x="248" y="196" width="118" height="66" rx="3" fill="#A63B4A" opacity="0.16" stroke="#A63B4A"/><text x="307" y="224" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#A63B4A" text-anchor="middle">BILL POCKET</text><text x="307" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">other half, folded up</text><rect x="424" y="206" width="24" height="24" rx="12" fill="#22404F"/><rect x="436" y="218" width="24" height="24" rx="12" fill="#22404F" opacity="0.6"/><text x="436" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#22404F" text-anchor="middle">SNAP</text><text x="436" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">at the fold</text><text x="24" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The main body is chain 17 and 16 sc worked tightly in both loops; each pocket is chain 15</text><text x="24" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and 14 sc, about 3in tall. Everything else is sewing, not crochet.</text></svg>