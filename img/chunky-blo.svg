<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="'Work Sans', -apple-system, sans-serif"><title>Back loop only</title><rect width="640" height="390" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Back loop only</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Where the ridges come from</text><rect x="24.0" y="274" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="274" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="296" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Markers both ends</text><text x="40.0" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Keep a marker in the first</text><text x="40.0" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">and last stitch of every</text><rect x="228.0" y="274" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="274" width="4" height="54" rx="2" fill="#D8A23C"/><text x="244.0" y="296" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Ch 1 is not a stitch</text><text x="244.0" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The turning chain never</text><text x="244.0" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">counts toward the 45</text><rect x="432.0" y="274" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="274" width="4" height="54" rx="2" fill="#A63B4A"/><text x="448.0" y="296" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Count often</text><text x="448.0" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">At this scale a dropped</text><text x="448.0" y="325" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">edge stitch is very easy to</text></svg>