<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing by age</title><rect width="640" height="368" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing by age</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two extra increase rounds per step</text><rect x="24.0" y="250" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="250" width="4" height="58" rx="2" fill="#33586B"/><text x="40.0" y="272" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">+1 round</text><text x="40.0" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">[sc 4, inc] around, 36 sts</text><rect x="228.0" y="250" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="250" width="4" height="58" rx="2" fill="#33586B"/><text x="244.0" y="272" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">+2 rounds</text><text x="244.0" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">42 sts total</text><rect x="432.0" y="250" width="184" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="250" width="4" height="58" rx="2" fill="#33586B"/><text x="448.0" y="272" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Strap too</text><text x="448.0" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">lengthen by 1-2 rows for a</text><text x="448.0" y="301" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">bigger neck</text><text x="24" y="330" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Both changes land before the neck strap begins, so the body grows without the closure</text><text x="24" y="346" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">needing to be reworked.</text></svg>