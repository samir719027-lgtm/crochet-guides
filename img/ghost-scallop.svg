<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="'Work Sans', -apple-system, sans-serif"><title>The scallop repeat</title><rect width="640" height="440" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The scallop repeat</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Six stitches per scallop</text><rect x="24" y="206" width="176" height="158" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="206" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="228" width="176" height="8" fill="#33586B"/><text x="112.0" y="226" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">36 STITCHES</text><text x="36" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">exactly 6 even</text><text x="36" y="269" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">scallops around</text><text x="36" y="284" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the bottom</text><text x="36" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="36" y="314" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">no adjustment</text><text x="36" y="329" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">needed</text><rect x="216" y="206" width="176" height="158" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="206" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="216" y="228" width="176" height="8" fill="#A63B4A"/><text x="304.0" y="226" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">IF YOU RESIZED</text><text x="228" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">recount first, then work</text><text x="228" y="269" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">to the nearest multiple of 6</text><text x="228" y="284" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="228" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">or add or skip one</text><text x="228" y="314" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">plain stitch the row</text><text x="228" y="329" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">before</text><rect x="408" y="206" width="176" height="158" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="206" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="408" y="228" width="176" height="8" fill="#D8A23C"/><text x="496.0" y="226" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">5, 6 OR 7 DC</text><text x="420" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">5 gives the standard wave</text><text x="420" y="269" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="420" y="284" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 or 7 is deeper</text><text x="420" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">and needs a little more</text><text x="420" y="314" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuffing pushed down</text><text x="420" y="329" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">to the lower body</text><text x="24" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Work the double crochets loosely rather than pulling them tight. A tight scallop draws</text><text x="24" y="402" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">inward and reads as a bump rather than a wave, so fan them out with your fingers before</text><text x="24" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">moving to the next repeat.</text></svg>