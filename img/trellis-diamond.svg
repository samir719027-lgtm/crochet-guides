<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="'Work Sans', -apple-system, sans-serif"><title>How one diamond is built</title><rect width="640" height="560" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How one diamond is built</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two leaning lines, then a crossing</text><rect x="444" y="110" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="462" cy="128" r="11" fill="#33586B"/><text x="462" y="132" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="482" y="132" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">Row 4 leans left</text><text x="456" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">row 5 leans right,</text><text x="456" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">toward each other</text><rect x="444" y="210" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="462" cy="228" r="11" fill="#33586B"/><text x="462" y="232" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="482" y="232" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">Work 2 rows below</text><text x="456" y="254" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">each front post,</text><text x="456" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">shifted one further</text><rect x="444" y="310" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="462" cy="328" r="11" fill="#33586B"/><text x="462" y="332" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="482" y="332" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">At the meeting point</text><text x="456" y="354" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the second stitch</text><text x="456" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">goes in front of</text><rect x="444" y="410" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="462" cy="428" r="11" fill="#33586B"/><text x="462" y="432" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="482" y="432" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">Continue outward</text><text x="456" y="454" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">closing the bottom</text><text x="456" y="468" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">half the same way</text><text x="24" y="522" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The crossing point is the centre of one diamond, and by row 9 the repeat is complete and a</text><text x="24" y="538" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">new diamond&#x27;s top point can begin.</text></svg>