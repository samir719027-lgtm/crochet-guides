<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" width="640" height="274" font-family="'Work Sans', -apple-system, sans-serif"><title>Single vs double crochet</title><rect width="640" height="274" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Single vs double crochet</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Row height compared at the same stitch count</text><line x1="118" y1="188" x2="526" y2="188" stroke="#DDD4C6" stroke-width="1.2"/><text x="187.33333333333334" y="84" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Single cro</text><rect x="128" y="133" width="119" height="55" fill="#33586B" opacity="0.62"/><text x="187.33333333333334" y="205" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">0 yarn-overs</text><text x="324.0" y="84" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Half dbl</text><rect x="265" y="116" width="119" height="72" fill="#33586B" opacity="0.71"/><text x="324.0" y="205" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">1 yarn-over</text><text x="460.6666666666667" y="84" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Double cro</text><rect x="401" y="96" width="119" height="92" fill="#33586B" opacity="0.82"/><text x="460.6666666666667" y="205" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">1 yarn-over</text><text x="24" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Double crochet makes a taller row from the same number of stitches.</text></svg>