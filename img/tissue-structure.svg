<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="'Work Sans', -apple-system, sans-serif"><title>Structure as the box empties</title><rect width="640" height="560" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Structure as the box empties</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The support you can rely on is the yarn</text><rect x="24.0" y="372" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="372" width="4" height="80" rx="2" fill="#33586B"/><text x="40.0" y="394" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Firm cotton</text><text x="40.0" y="410" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Holds its boxy shape with</text><text x="40.0" y="423" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">or without a full box</text><rect x="228.0" y="372" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="372" width="4" height="80" rx="2" fill="#A63B4A"/><text x="244.0" y="394" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Soft acrylic</text><text x="244.0" y="410" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Looks fine on day one and</text><text x="244.0" y="423" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">noticeably saggy by the</text><rect x="432.0" y="372" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="372" width="4" height="80" rx="2" fill="#D8A23C"/><text x="448.0" y="394" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Rigid insert</text><text x="448.0" y="410" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Lightweight cardboard or</text><text x="448.0" y="423" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">plastic canvas in the base</text><text x="24" y="482" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A snugger initial fit has more slack to take up as the box shrinks, which helps delay the</text><text x="24" y="498" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">saggy look. That is a buffer, not a substitute for firm yarn.</text></svg>