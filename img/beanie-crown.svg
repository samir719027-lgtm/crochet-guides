<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" font-family="'Work Sans', -apple-system, sans-serif"><title>The crown in four rounds</title><rect width="640" height="550" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The crown in four rounds</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">6 to 36 stitches, +6 a round</text><rect x="324" y="96" width="142" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="342" cy="114" r="11" fill="#33586B"/><text x="342" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="362" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">[sc 1, inc]</text><text x="336" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">18 sts</text><rect x="324" y="188" width="142" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="342" cy="206" r="11" fill="#33586B"/><text x="342" y="210" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="362" y="210" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">[sc 2, inc]</text><text x="336" y="232" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">24 sts</text><rect x="324" y="280" width="142" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="342" cy="298" r="11" fill="#33586B"/><text x="342" y="302" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="362" y="302" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">[sc 3, inc]</text><text x="336" y="324" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">30 sts</text><rect x="324" y="372" width="142" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="342" cy="390" r="11" fill="#33586B"/><text x="342" y="394" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="362" y="394" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">[sc 4, inc]</text><text x="336" y="416" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">36 sts</text><text x="324" y="460" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">each round adds 6 stitches</text><text x="24" y="512" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Four increase rounds take the crown from 6 stitches to 36, which is the whole of the crown</text><text x="24" y="528" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">construction.</text></svg>