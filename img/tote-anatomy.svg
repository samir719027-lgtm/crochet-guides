<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" font-family="'Work Sans', -apple-system, sans-serif"><title>Bag anatomy</title><rect width="640" height="288" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Bag anatomy</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three zones from the article&#x27;s pattern</text><path d="M 234 202 a 110 40 0 0 0 220 0 Z" fill="#EDE6D9"/><rect x="248" y="172" width="192" height="30" rx="8" fill="#E4DACB"/><path d="M 314 164 C 314 72 252 72 252 152" stroke="#A63B4A" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M 374 164 C 374 72 436 72 436 152" stroke="#A63B4A" stroke-width="8" fill="none" stroke-linecap="round"/><text x="344" y="190" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">flat base circle (72 sts)</text><text x="344" y="168" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#33586B" text-anchor="middle">body: 15 straight rounds</text><text x="436" y="104" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="start">straps</text><text x="24" y="266" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Base flat circle, straight-side body, then straps.</text></svg>