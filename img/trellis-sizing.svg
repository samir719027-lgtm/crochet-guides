<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing up or down</title><rect width="640" height="390" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing up or down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Multiples of the diamond repeat</text><rect x="24" y="110" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><path d="M 34 130 L 57 200 L 34 240" fill="none" stroke="#D8A23C" stroke-width="2" stroke-linejoin="round"/><path d="M 57 130 L 34 200 L 57 240" fill="none" stroke="#D8A23C" stroke-width="2" stroke-linejoin="round"/><path d="M 61 130 L 83 200 L 61 240" fill="none" stroke="#D8A23C" stroke-width="2" stroke-linejoin="round"/><path d="M 83 130 L 61 200 L 83 240" fill="none" stroke="#D8A23C" stroke-width="2" stroke-linejoin="round"/><path d="M 87 130 L 110 200 L 87 240" fill="none" stroke="#D8A23C" stroke-width="2" stroke-linejoin="round"/><path d="M 110 130 L 87 200 L 110 240" fill="none" stroke="#D8A23C" stroke-width="2" stroke-linejoin="round"/><text x="112.0" y="282" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#D8A23C" text-anchor="middle">6 repeats</text><text x="112.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">narrow</text><rect x="222" y="110" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><path d="M 232 130 L 248 200 L 232 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 248 130 L 232 200 L 248 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 252 130 L 268 200 L 252 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 268 130 L 252 200 L 268 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 272 130 L 288 200 L 272 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 288 130 L 272 200 L 288 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 292 130 L 308 200 L 292 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><path d="M 308 130 L 292 200 L 308 240" fill="none" stroke="#33586B" stroke-width="2" stroke-linejoin="round"/><text x="310.0" y="282" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#33586B" text-anchor="middle">8 repeats</text><text x="310.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">as written</text><rect x="420" y="110" width="176" height="150" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><path d="M 429 130 L 443 200 L 429 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 443 130 L 429 200 L 443 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 445 130 L 459 200 L 445 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 459 130 L 445 200 L 459 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 461 130 L 475 200 L 461 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 475 130 L 461 200 L 475 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 477 130 L 491 200 L 477 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 491 130 L 477 200 L 491 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 493 130 L 507 200 L 493 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><path d="M 507 130 L 493 200 L 507 240" fill="none" stroke="#A63B4A" stroke-width="2" stroke-linejoin="round"/><text x="508.0" y="282" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#A63B4A" text-anchor="middle">10 repeats</text><text x="508.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">wide</text><text x="24" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Because the diamond repeat spans a fixed number of stitches, resize in multiples of it, so</text><text x="24" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the lattice lines up cleanly instead of being cut off awkwardly at one edge.</text></svg>