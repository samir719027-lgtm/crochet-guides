<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-labelledby="t d">
  <title id="t">UK ply names and US yarn weight categories for the same thickness</title>
  <desc id="d">A mapping between UK ply names and US weight categories. Fingering or 4-ply is US category 1. Sport or 5-ply is category 2. DK or double knitting is often sold as 8-ply, category 3. Aran or 10-ply is category 4. Worsted or 12-ply is category 5. The ply number counts how many strands are twisted together, which is a different thing from how thick the finished yarn is.</desc>
  <rect width="640" height="316" fill="#FBF8F2"/>
  <rect width="640" height="44" fill="#E4DACB"/>
  <text x="24" y="29" font-family="Work Sans, sans-serif" font-size="15.5" font-weight="600" fill="#2A241E">UK ply is not US category</text>

  <rect x="24" y="60" width="592" height="188" rx="4" fill="#FFFFFF" stroke="#DED5C6"/>

  <rect x="24" y="60" width="592" height="30" rx="4" fill="#E4DACB"/>
  <text x="44" y="80" font-family="Space Mono, monospace" font-size="10.5" fill="#2A241E">UK NAME</text>
  <text x="240" y="80" font-family="Space Mono, monospace" font-size="10.5" fill="#2A241E">UK PLY</text>
  <text x="360" y="80" font-family="Space Mono, monospace" font-size="10.5" fill="#2A241E">US CATEGORY</text>
  <text x="500" y="80" font-family="Space Mono, monospace" font-size="10.5" fill="#2A241E">HOOK (UK)</text>

  <line x1="24" y1="90" x2="616" y2="90" stroke="#DED5C6"/>

  <g font-family="Work Sans, sans-serif" font-size="13.5" fill="#2A241E">
    <text x="44" y="114">Fingering</text><text x="240" y="114" font-family="Space Mono, monospace" font-size="12.5">4-ply</text><text x="360" y="114" font-family="Space Mono, monospace" font-size="12.5">1</text><text x="500" y="114" font-family="Space Mono, monospace" font-size="12.5">2.5 - 3 mm</text>
    <text x="44" y="142">Sport</text><text x="240" y="142" font-family="Space Mono, monospace" font-size="12.5">5-ply</text><text x="360" y="142" font-family="Space Mono, monospace" font-size="12.5">2</text><text x="500" y="142" font-family="Space Mono, monospace" font-size="12.5">3.5 mm</text>
  </g>
  <rect x="24" y="152" width="592" height="30" fill="#FBF0EE"/>
  <g font-family="Work Sans, sans-serif" font-size="13.5" fill="#A63B4A" font-weight="600">
    <text x="44" y="172">DK</text><text x="240" y="172" font-family="Space Mono, monospace" font-size="12.5">8-ply</text><text x="360" y="172" font-family="Space Mono, monospace" font-size="12.5">3</text><text x="500" y="172" font-family="Space Mono, monospace" font-size="12.5">4 mm</text>
  </g>
  <line x1="24" y1="182" x2="616" y2="182" stroke="#DED5C6"/>
  <g font-family="Work Sans, sans-serif" font-size="13.5" fill="#2A241E">
    <text x="44" y="204">Aran</text><text x="240" y="204" font-family="Space Mono, monospace" font-size="12.5">10-ply</text><text x="360" y="204" font-family="Space Mono, monospace" font-size="12.5">4</text><text x="500" y="204" font-family="Space Mono, monospace" font-size="12.5">5 mm</text>
    <text x="44" y="232">Worsted</text><text x="240" y="232" font-family="Space Mono, monospace" font-size="12.5">12-ply</text><text x="360" y="232" font-family="Space Mono, monospace" font-size="12.5">5</text><text x="500" y="232" font-family="Space Mono, monospace" font-size="12.5">5.5 - 6 mm</text>
  </g>

  <line x1="24" y1="264" x2="616" y2="264" stroke="#DED5C6" stroke-width="1"/>
  <text x="24" y="288" font-family="Work Sans, sans-serif" font-size="12.5" fill="#5A5148">Ply counts the strands twisted together, not the finished thickness. An 8-ply yarn can be</text>
  <text x="24" y="306" font-family="Work Sans, sans-serif" font-size="12.5" font-weight="600" fill="#A63B4A">fingering weight if it is spun very fine. Match thickness, never the ply number.</text>
</svg>
