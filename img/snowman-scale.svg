<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing up or down</title><rect width="640" height="342" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing up or down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three ways to change the height</text><rect x="24" y="92" width="176" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="176" height="8" fill="#33586B"/><text x="112.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">THREE BALLS</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Add a middle sphere</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Slightly smaller than</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">the bottom, slightly</text><text x="36" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">larger than the</text><text x="36" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">head</text><rect x="216" y="92" width="176" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="92" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="114" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">TWO BALLS, TALLER</text><text x="228" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Work two extra</text><text x="228" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">increase rounds into</text><text x="228" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">each sphere</text><text x="228" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="228" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Same stitch logic,</text><text x="228" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">more height</text><rect x="408" y="92" width="176" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="92" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="408" y="114" width="176" height="8" fill="#A63B4A"/><text x="496.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BULKY YARN</text><text x="420" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">5.5-6.0mm hook</text><text x="420" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="420" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Roughly doubles the</text><text x="420" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">finished height</text><text x="420" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="420" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">No change to the</text><text x="420" y="230" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stitch logic</text><text x="24" y="304" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">For a tiny tree-ornament version, drop to DK or sport with a 2.5-3.0mm hook and work the</text><text x="24" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">same rounds, packing the stuffing in with the blunt end of a pencil.</text></svg>