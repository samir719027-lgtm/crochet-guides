<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" width="640" height="496" font-family="'Work Sans', -apple-system, sans-serif"><title>Why a project curls at the edges</title><rect width="640" height="496" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why a project curls at the edges</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two causes, one of them a missing turning chain</text><rect x="24" y="232" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="232" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="256" width="280" height="10" fill="#A63B4A"/><text x="38" y="255" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Curling</text><text x="38" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Tighter tension than</text><text x="38" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">the gauge calls for</text><text x="38" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Sc rows with no</text><text x="38" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">turning chain</text><rect x="328" y="232" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="232" width="280" height="34" rx="4" fill="#33586B"/><rect x="328" y="256" width="280" height="10" fill="#33586B"/><text x="342" y="255" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Fixes it</text><text x="342" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Work to gauge, or</text><text x="342" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">go up half a hook size</text><text x="342" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="342" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Chain to your</text><text x="342" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stitch height</text><text x="24" y="474" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Curling is almost always one of these two, so name which one before changing anything else.</text></svg>