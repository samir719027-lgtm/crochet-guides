<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Tube and lid</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Tube and lid</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Sides in one round, top added last</text><rect x="56" y="200" width="150" height="104" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><circle cx="56" cy="200" r="6" fill="#A63B4A"/><circle cx="206" cy="200" r="6" fill="#A63B4A"/><circle cx="56" cy="304" r="6" fill="#A63B4A"/><circle cx="206" cy="304" r="6" fill="#A63B4A"/><text x="131" y="190" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="middle">SIDE TUBE, one continuous round</text><text x="131" y="260" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">mark all 4</text><text x="131" y="278" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="middle">corners</text><path d="M 250 200 h 26 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#5A5148" stroke-width="2"/><rect x="300" y="212" width="150" height="80" rx="4" fill="#33586B" opacity="0.16" stroke="#33586B"/><rect x="344" y="234" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#A63B4A" stroke-width="2"/><text x="375" y="204" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#33586B" text-anchor="middle">TOP PANEL, separate</text><text x="375" y="250" font-family="Fraunces, Georgia, serif" font-size="11.5" font-weight="600" fill="#A63B4A" text-anchor="middle">about 4 x 1.5in</text><text x="375" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">pull-through opening</text><path d="M 375 296 v 26 m -6 -8 l 6 8 l 6 -8" fill="none" stroke="#5A5148" stroke-width="2"/><text x="375" y="340" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">align all 4 corners,</text><text x="375" y="356" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">then seam flat</text><text x="24" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Chain around the base perimeter of your actual box and work even in sc for its height,</text><text x="24" y="424" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">marking each of the 4 corners. The opening is worked several rounds deep so its edge does</text><text x="24" y="440" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">not fray in daily use.</text></svg>