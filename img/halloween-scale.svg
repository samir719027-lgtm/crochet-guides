<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" width="640" height="486" font-family="'Work Sans', -apple-system, sans-serif"><title>Scaling the toys up or down</title><rect width="640" height="486" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Scaling the toys up or down</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Change yarn and hook together, keep the gap</text><rect x="24" y="236" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="236" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="260" width="290" height="10" fill="#33586B"/><text x="38" y="259" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Yarn label says 5.0mm</text><text x="38" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Working at 4.0-4.5mm</text><text x="38" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Tighter fabric closes</text><text x="38" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">the gaps between</text><text x="38" y="372" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stitches</text><rect x="338" y="236" width="290" height="160" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="236" width="290" height="34" rx="4" fill="#D8A23C"/><rect x="338" y="260" width="290" height="10" fill="#D8A23C"/><text x="352" y="259" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Firm tension too</text><text x="352" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Keep tension firm</text><text x="352" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Even when the toy is</text><text x="352" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">squeezed, nothing</text><text x="352" y="372" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">pokes through</text><text x="24" y="448" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Scaling changes the yarn and the hook together, but the gap between hook and label stays the</text><text x="24" y="464" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">same.</text></svg>