<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 614" width="640" height="614" font-family="'Work Sans', -apple-system, sans-serif"><title>Two rounds, five petals</title><rect width="640" height="614" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Two rounds, five petals</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Ten stitches in the centre, one skip between petals</text><rect x="24" y="320" width="142" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="338" r="11" fill="#A63B4A"/><text x="42" y="342" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="342" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Chain 3</text><text x="36" y="364" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Start the petal</text><text x="36" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">from round 1</text><path d="M 170 356.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="182" y="320" width="142" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="200" cy="338" r="11" fill="#A63B4A"/><text x="200" y="342" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="220" y="342" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">dc, 3 tr, dc</text><text x="194" y="364" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The petal&#x27;s height</text><text x="194" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and shape</text><path d="M 328 356.0 h 4 m -4 -5 l 5 5 -5 5" fill="none" stroke="#A63B4A" stroke-width="1.8" stroke-linecap="round"/><rect x="340" y="320" width="142" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="358" cy="338" r="11" fill="#A63B4A"/><text x="358" y="342" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="378" y="342" font-family="Fraunces, Georgia, serif" font-size="10.0" font-weight="600" fill="#2A241E" text-anchor="start">Chain 3, slip stitch</text><text x="352" y="364" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Back into that same</text><text x="352" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stitch to close</text><rect x="24" y="422" width="142" height="72" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="440" r="11" fill="#A63B4A"/><text x="42" y="444" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="444" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Skip 1</text><text x="36" y="466" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Move to the next</text><text x="36" y="480" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">round 1 stitch</text><text x="24" y="576" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One petal is chain 3, a dc, three trebles, a dc, chain 3, and a slip stitch back into the</text><text x="24" y="592" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">same round 1 stitch.</text></svg>