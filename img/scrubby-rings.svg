<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" font-family="'Work Sans', -apple-system, sans-serif"><title>Concentric colour rings</title><rect width="640" height="318" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Concentric colour rings</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A colour change per round makes clean rings for free</text><circle cx="344" cy="150" r="78" fill="none" stroke="#33586B" stroke-width="14" opacity="0.85"/><circle cx="344" cy="150" r="62" fill="none" stroke="#D8A23C" stroke-width="14" opacity="0.85"/><circle cx="344" cy="150" r="46" fill="none" stroke="#A63B4A" stroke-width="14" opacity="0.85"/><circle cx="344" cy="150" r="30" fill="none" stroke="#E4DACB" stroke-width="14" opacity="1.0"/><circle cx="344" cy="150" r="22" fill="#E4DACB"/><text x="344" y="154" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">6 sts</text><text x="344" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="middle">change colour at the start of each round</text><text x="340" y="250" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">concentric rings, no extra technique</text><text x="24" y="296" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Rounds grow 6 to 30 stitches, then close with a slip stitch and a long tail for hanging.</text></svg>