<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" font-family="'Work Sans', -apple-system, sans-serif"><title>Count the row, every row</title><rect width="640" height="368" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Count the row, every row</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The single habit that catches most of these</text><rect x="24.0" y="92" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="92" width="4" height="64" rx="2" fill="#33586B"/><text x="40.0" y="114" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Count at the end of each row</text><text x="40.0" y="130" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">catches a skipped stitch</text><text x="40.0" y="143" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">before it is several rows</text><rect x="228.0" y="92" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="92" width="4" height="64" rx="2" fill="#A63B4A"/><text x="244.0" y="114" font-family="Fraunces, Georgia, serif" font-size="9.5" font-weight="600" fill="#2A241E" text-anchor="start">Name the cause, not the symptom</text><text x="244.0" y="130" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">&#x27;I skipped the first</text><text x="244.0" y="143" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">stitch&#x27; beats &#x27;my work has</text><rect x="432.0" y="92" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="92" width="4" height="64" rx="2" fill="#D8A23C"/><text x="448.0" y="114" font-family="Fraunces, Georgia, serif" font-size="11.0" font-weight="600" fill="#2A241E" text-anchor="start">Read the row before joining</text><text x="448.0" y="130" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">compare the number to the</text><text x="448.0" y="143" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">pattern while the row is</text><text x="24" y="186" font-family="'Space Mono', monospace" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">What counting looks like on a live row</text><rect x="24" y="206" width="592" height="62" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="39" y="222" width="30" height="30" rx="3" fill="none" stroke="#A63B4A" stroke-width="2"/><text x="54" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#A63B4A" text-anchor="middle">1</text><rect x="85" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="100" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">2</text><rect x="131" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="146" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">3</text><rect x="177" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="192" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">4</text><rect x="223" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="238" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">5</text><rect x="269" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="284" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">6</text><rect x="315" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="330" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">7</text><rect x="361" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="376" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">8</text><rect x="407" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="422" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">9</text><rect x="453" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="468" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">10</text><rect x="499" y="222" width="30" height="30" rx="3" fill="none" stroke="#33586B" stroke-width="2"/><text x="514" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#33586B" text-anchor="middle">11</text><rect x="545" y="222" width="30" height="30" rx="3" fill="none" stroke="#D8A23C" stroke-width="2"/><text x="560" y="257" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#D8A23C" text-anchor="middle">12</text><text x="36" y="242" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#A63B4A" text-anchor="middle">start</text><text x="24" y="316" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A skipped stitch is almost always the first or last stitch of the row, which is exactly</text><text x="24" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">where the count earns its keep.</text></svg>