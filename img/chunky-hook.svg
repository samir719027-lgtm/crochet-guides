<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Work Sans', -apple-system, sans-serif"><title>Choosing hook size</title><rect width="640" height="400" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Choosing hook size</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Dense or drapey, not exact</text><rect x="24.0" y="236" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="236" width="4" height="54" rx="2" fill="#A63B4A"/><text x="40.0" y="258" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Looks gappy</text><text x="40.0" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Size down to 9mm; the</text><text x="40.0" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">fabric should be dense and</text><rect x="228.0" y="236" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="236" width="4" height="54" rx="2" fill="#22404F"/><text x="244.0" y="258" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Fighting the yarn</text><text x="244.0" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Size up to 12mm rather than</text><text x="244.0" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">forcing a tight stitch</text><rect x="432.0" y="236" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="236" width="4" height="54" rx="2" fill="#D8A23C"/><text x="448.0" y="258" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Comfort over gauge</text><text x="448.0" y="274" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">At this weight, sore hands</text><text x="448.0" y="287" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">matter more than hitting an</text><text x="24" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Jumbo weight 7 grows even faster but is sold in narrower colour ranges and needs an even</text><text x="24" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">larger hook. Worth trying only after a weight 6 throw.</text></svg>