<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing for the family</title><rect width="640" height="288" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing for the family</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Chain length is the only number that changes</text><line x1="132" y1="210" x2="526" y2="210" stroke="#DDD4C6" stroke-width="1.2"/><text x="182.5" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Toddler</text><rect x="142" y="144" width="81" height="66" fill="#22404F" opacity="0.68"/><text x="182.5" y="227" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">ch 18-19</text><text x="281.5" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">School-age</text><rect x="241" y="136" width="81" height="74" fill="#22404F" opacity="0.72"/><text x="281.5" y="227" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">ch 20-21</text><text x="380.5" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Teen / small adult</text><rect x="340" y="129" width="81" height="81" fill="#22404F" opacity="0.76"/><text x="380.5" y="227" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">ch 22-23</text><text x="479.5" y="106" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="middle">Larger adult</text><rect x="439" y="118" width="81" height="92" fill="#22404F" opacity="0.82"/><text x="479.5" y="227" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">ch 24-26</text><text x="24" y="266" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Starting points - always measure the actual wearer.</text></svg>