<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298" font-family="'Work Sans', -apple-system, sans-serif"><title>Does material matter as much as size?</title><rect width="640" height="298" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Does material matter as much as size?</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Size wins, by a wide margin</text><text x="24" y="221" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Metric size match</text><rect x="194" y="209" width="358" height="16" rx="2" fill="#E4DACB"/><rect x="194" y="209" width="358" height="16" rx="2" fill="#33586B"/><text x="616" y="221" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="end">essential</text><text x="24" y="251" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Same brand, new material</text><rect x="194" y="239" width="358" height="16" rx="2" fill="#E4DACB"/><rect x="194" y="239" width="54" height="16" rx="2" fill="#E4DACB"/><text x="616" y="251" font-family="'Space Mono', monospace" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="end">nice to have</text></svg>