<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 602" width="640" height="602" font-family="'Work Sans', -apple-system, sans-serif"><title>How much to buy</title><rect width="640" height="602" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How much to buy</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Under 100 yards for anything small</text><rect x="24" y="342" width="290" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="342" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="366" width="290" height="10" fill="#33586B"/><text x="38" y="365" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Basic acrylic</text><text x="38" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">A few dollars a skein</text><text x="38" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="438" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Covers multiple small</text><text x="38" y="458" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">toys</text><text x="38" y="478" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="498" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">One of the most</text><text x="38" y="518" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">forgiving project types</text><rect x="338" y="342" width="290" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="342" width="290" height="34" rx="4" fill="#D8A23C"/><rect x="338" y="366" width="290" height="10" fill="#D8A23C"/><text x="352" y="365" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Mercerized cotton</text><text x="352" y="398" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Costs more per skein</text><text x="352" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="438" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Still goes a long way,</text><text x="352" y="458" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">because amigurumi</text><text x="352" y="478" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">needs so little</text><text x="352" y="498" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="518" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Worth trying for a</text><text x="352" y="538" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">first nicer yarn</text><text x="24" y="564" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Amigurumi is one of the easiest projects to spend a little more on without a big financial</text><text x="24" y="580" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">commitment, because there is so little yarn in it.</text></svg>