<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="'Work Sans', -apple-system, sans-serif"><title>Quick reference</title><rect width="640" height="450" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Quick reference</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Worsted weight at a typical gauge</text><rect x="24.0" y="340" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="340" width="4" height="54" rx="2" fill="#D8A23C"/><text x="40.0" y="362" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Adjust for gauge</text><text x="40.0" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Up for a denser stitch or</text><text x="40.0" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">smaller hook, down for an</text><rect x="228.0" y="340" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="340" width="4" height="54" rx="2" fill="#33586B"/><text x="244.0" y="362" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Patterns come first</text><text x="244.0" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Always check a pattern&#x27;s</text><text x="244.0" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">own materials list; it</text><rect x="432.0" y="340" width="184" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="340" width="4" height="54" rx="2" fill="#22404F"/><text x="448.0" y="362" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">This is planning only</text><text x="448.0" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">The table is for rough</text><text x="448.0" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">estimating when no specific</text></svg>