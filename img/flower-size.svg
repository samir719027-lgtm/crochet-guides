<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" width="640" height="472" font-family="'Work Sans', -apple-system, sans-serif"><title>Making the flower bigger or smaller</title><rect width="640" height="472" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Making the flower bigger or smaller</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The first-round count sets the size</text><rect x="24.0" y="330" width="184" height="68" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="330" width="4" height="68" rx="2" fill="#A63B4A"/><text x="40.0" y="352" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">More stitches</text><text x="40.0" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">each petal gets more</text><text x="40.0" y="381" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">breathing room, so the</text><rect x="228.0" y="330" width="184" height="68" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="330" width="4" height="68" rx="2" fill="#D8A23C"/><text x="244.0" y="352" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Fewer stitches</text><text x="244.0" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">a tighter, more button-like</text><text x="244.0" y="381" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">bloom</text><rect x="432.0" y="330" width="184" height="68" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="330" width="4" height="68" rx="2" fill="#33586B"/><text x="448.0" y="352" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Skip evenly</text><text x="448.0" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">whatever you do, or the</text><text x="448.0" y="381" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">flower comes out lopsided</text><text x="24" y="450" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">You can also grow the petals themselves by adding an extra treble in the middle of each one.</text></svg>