<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" font-family="'Work Sans', -apple-system, sans-serif"><title>Strip vs corner bookmark</title><rect width="640" height="404" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Strip vs corner bookmark</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two shapes, two different jobs</text><rect x="24" y="112" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="112" width="280" height="34" rx="4" fill="#33586B"/><rect x="24" y="136" width="280" height="10" fill="#33586B"/><text x="38" y="135" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">FLAT STRIP</text><rect x="68" y="174" width="150" height="7" fill="#E4DACB"/><rect x="68" y="187" width="150" height="7" fill="#E4DACB"/><rect x="68" y="200" width="150" height="7" fill="#E4DACB"/><rect x="68" y="213" width="150" height="7" fill="#E4DACB"/><rect x="68" y="226" width="150" height="7" fill="#E4DACB"/><rect x="68" y="239" width="150" height="7" fill="#E4DACB"/><rect x="68" y="252" width="150" height="7" fill="#E4DACB"/><rect x="68" y="265" width="150" height="7" fill="#E4DACB"/><rect x="68" y="278" width="150" height="7" fill="#E4DACB"/><text x="48" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Wins on speed. Fits any book.</text><rect x="328" y="112" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="112" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="328" y="136" width="280" height="10" fill="#A63B4A"/><text x="342" y="135" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">CORNER BOOKMARK</text><path d="M 424 182 L 478 236 L 424 290 Z" fill="#E4DACB" stroke="#DDD4C6"/><path d="M 448 164 q 40 6 44 44" fill="none" stroke="#A63B4A" stroke-width="2" stroke-dasharray="4 4"/><path d="M 542 156 v 66 h -66" fill="none" stroke="#DDD4C6" stroke-width="2"/><path d="M 542 156 q 12 12 12 30" fill="none" stroke="#A63B4A" stroke-width="2"/><text x="508" y="242" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">holds the page</text><text x="352" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Slips over the corner, so it</text><text x="352" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">will not slide out.</text><text x="24" y="366" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Both are worth knowing: the strip is faster and more elegant, the corner bookmark grips the</text><text x="24" y="382" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">page.</text></svg>