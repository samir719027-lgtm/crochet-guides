<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 299" width="640" height="299" font-family="'Work Sans', -apple-system, sans-serif"><title>Base rounds 1-9</title><rect width="640" height="299" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Base rounds 1-9</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The 6-stitch growth that builds a flat circle</text><rect x="24" y="92" width="600" height="28" fill="#22404F"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Rounds</text><text x="124" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Stitches</text><text x="234" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What to do</text><rect x="24" y="120" width="600" height="27" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">1</text><text x="124" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">6</text><text x="234" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Magic ring, 6 sc</text><line x1="24" y1="147" x2="624" y2="147" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="147" width="600" height="27" fill="#E4DACB"/><text x="34" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">2</text><text x="124" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">12</text><text x="234" y="164" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Inc in every stitch</text><line x1="24" y1="174" x2="624" y2="174" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="174" width="600" height="27" fill="#FFFFFF"/><text x="34" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">3-4</text><text x="124" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">18-24</text><text x="234" y="191" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">[sc n, inc] continuing</text><line x1="24" y1="201" x2="624" y2="201" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="201" width="600" height="27" fill="#E4DACB"/><text x="34" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">5-9</text><text x="124" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">30-72</text><text x="234" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Keep adding 6 per round</text><line x1="24" y1="228" x2="624" y2="228" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="228" width="600" height="27" fill="#FFFFFF"/><text x="34" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">10-24</text><text x="124" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">72</text><text x="234" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Sc every stitch, no increases</text><line x1="24" y1="255" x2="624" y2="255" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="600" height="163" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="277" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The base stays flat as long as increases spread evenly.</text></svg>