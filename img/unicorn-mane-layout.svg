<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 608" width="640" height="608" font-family="'Work Sans', -apple-system, sans-serif"><title>Where the fringe goes</title><rect width="640" height="608" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Where the fringe goes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Head, neck, then a shorter tail</text><rect x="280" y="100" width="140" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="298" cy="118" r="11" fill="#33586B"/><text x="298" y="122" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="318" y="122" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Head first</text><text x="292" y="144" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">work the fringe</text><text x="292" y="158" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">line along the top</text><rect x="280" y="212" width="140" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="298" cy="230" r="11" fill="#33586B"/><text x="298" y="234" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="318" y="234" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Down the neck</text><text x="292" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">in a single line to</text><text x="292" y="270" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the back</text><rect x="280" y="324" width="140" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="298" cy="342" r="11" fill="#33586B"/><text x="298" y="346" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="318" y="346" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Tail cluster</text><text x="292" y="368" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">smaller and denser</text><text x="292" y="382" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">at the back of the</text><rect x="280" y="436" width="140" height="82" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="298" cy="454" r="11" fill="#33586B"/><text x="298" y="458" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="318" y="458" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Trim</text><text x="292" y="480" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">a little at a time,</text><text x="292" y="494" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">checking the shape</text><text x="24" y="570" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A unicorn&#x27;s tail is proportionally shorter and denser than its mane, which is why it gets a</text><text x="24" y="586" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">cluster rather than the same line worked down the back.</text></svg>