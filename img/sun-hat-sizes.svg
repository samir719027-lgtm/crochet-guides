<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" font-family="'Work Sans', -apple-system, sans-serif"><title>Sizing for 0-12 months</title><rect width="640" height="354" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Sizing for 0-12 months</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Round counts, not stitch counts</text><rect x="24.0" y="222" width="592" height="56" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="222" width="4" height="56" rx="2" fill="#33586B"/><text x="40.0" y="244" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">No chin strap, on purpose</text><text x="40.0" y="260" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">anything worn around a baby&#x27;s neck is a strangulation risk</text><text x="24" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Baby head sizes vary more than most other measurements at this age, so treat these as</text><text x="24" y="316" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">starting points and check against your own baby&#x27;s head circumference if you have it. A sun</text><text x="24" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">hat works best for supervised outdoor time.</text></svg>