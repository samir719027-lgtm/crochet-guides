<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Work Sans', -apple-system, sans-serif"><title>Adapting video tutorials</title><rect width="640" height="330" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Adapting video tutorials</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Two low-tech ways to un-flip the screen</text><rect x="24" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="280" height="34" rx="4" fill="#33586B"/><rect x="24" y="120" width="280" height="10" fill="#33586B"/><text x="38" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">MIRROR TRICK</text><text x="38" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Hold the phone</text><text x="38" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">or tablet up to</text><text x="38" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a mirror and</text><text x="38" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">watch the</text><text x="38" y="232" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">reflection.</text><rect x="328" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="96" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="328" y="120" width="280" height="10" fill="#A63B4A"/><text x="342" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">REPLAY SLOW</text><text x="342" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Slow the video</text><text x="342" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">and match your</text><text x="342" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">mirror hands,</text><text x="342" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stitch by</text><text x="342" y="232" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">stitch.</text><text x="24" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Right-handed tutorials stay usable - you just flip the picture.</text></svg>