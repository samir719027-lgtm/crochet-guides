<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Work Sans', -apple-system, sans-serif"><title>Yarn for decor vs. kitchen</title><rect width="640" height="330" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Yarn for decor vs. kitchen</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Material follows where the piece lives</text><rect x="24" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="280" height="34" rx="4" fill="#33586B"/><rect x="24" y="120" width="280" height="10" fill="#33586B"/><text x="38" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">KITCHEN = 100% COTTON</text><text x="38" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Absorbent, machine-</text><text x="38" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">washable, won&#x27;t melt</text><text x="38" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">or scorch near heat.</text><text x="38" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Firmer to work with.</text><rect x="328" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="96" width="280" height="34" rx="4" fill="#D8A23C"/><rect x="328" y="120" width="280" height="10" fill="#D8A23C"/><text x="342" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">DECOR = YOUR CALL</text><text x="342" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Wool and blends for</text><text x="342" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">warmth and drape; acrylic</text><text x="342" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">for cheap, easy-care</text><text x="342" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">pieces.</text><text x="24" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Anything near heat or water gets cotton. The rest follows the room.</text></svg>