<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Pockets that actually work</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Pockets that actually work</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Three edges sewn, the top left open</text><rect x="24.0" y="340" width="286" height="76" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="340" width="4" height="76" rx="2" fill="#33586B"/><text x="40.0" y="362" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Never sew all four</text><text x="40.0" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Even neaten the top edge partway and the slot</text><text x="40.0" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">narrows until a card is hard to remove</text><rect x="330.0" y="340" width="286" height="76" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="340" width="4" height="76" rx="2" fill="#33586B"/><text x="346.0" y="362" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Sew from the wrong side</text><text x="346.0" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Or use a whip stitch in the gaps between</text><text x="346.0" y="391" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">stitches, so nothing shows on the front</text></svg>