<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="'Work Sans', -apple-system, sans-serif"><title>Planning your stripes</title><rect width="640" height="270" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Planning your stripes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Colour can land anywhere without an alignment</text><rect x="24" y="116" width="130" height="58" rx="4" fill="#33586B" stroke="#DDD4C6"/><text x="24" y="194" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Forest</text><text x="24" y="212" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">a deep cool stripe</text><rect x="166" y="116" width="130" height="58" rx="4" fill="#D8A23C" stroke="#DDD4C6"/><text x="166" y="194" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Marigold</text><text x="166" y="212" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">a sunny contrast</text><rect x="308" y="116" width="130" height="58" rx="4" fill="#A63B4A" stroke="#DDD4C6"/><text x="308" y="194" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Berry</text><text x="308" y="212" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">a warm mid-stripe</text><rect x="450" y="116" width="130" height="58" rx="4" fill="#E4DACB" stroke="#DDD4C6"/><text x="450" y="194" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Undyed</text><text x="450" y="212" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="start">brings it together</text><text x="24" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Change colour at the start of any row - the wave never notices.</text></svg>