<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" font-family="'Work Sans', -apple-system, sans-serif"><title>How the body becomes a cone</title><rect width="640" height="382" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">How the body becomes a cone</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">24 stitches, then nothing but even rounds</text><circle cx="120.0" cy="144.0" r="3.4" fill="#33586B"/><circle cx="133.5" cy="145.8" r="3.4" fill="#33586B"/><circle cx="146.0" cy="151.0" r="3.4" fill="#33586B"/><circle cx="156.8" cy="159.2" r="3.4" fill="#33586B"/><circle cx="165.0" cy="170.0" r="3.4" fill="#33586B"/><circle cx="170.2" cy="182.5" r="3.4" fill="#33586B"/><circle cx="172.0" cy="196.0" r="3.4" fill="#33586B"/><circle cx="170.2" cy="209.5" r="3.4" fill="#33586B"/><circle cx="165.0" cy="222.0" r="3.4" fill="#33586B"/><circle cx="156.8" cy="232.8" r="3.4" fill="#33586B"/><circle cx="146.0" cy="241.0" r="3.4" fill="#33586B"/><circle cx="133.5" cy="246.2" r="3.4" fill="#33586B"/><circle cx="120.0" cy="248.0" r="3.4" fill="#33586B"/><circle cx="106.5" cy="246.2" r="3.4" fill="#33586B"/><circle cx="94.0" cy="241.0" r="3.4" fill="#33586B"/><circle cx="83.2" cy="232.8" r="3.4" fill="#33586B"/><circle cx="75.0" cy="222.0" r="3.4" fill="#33586B"/><circle cx="69.8" cy="209.5" r="3.4" fill="#33586B"/><circle cx="68.0" cy="196.0" r="3.4" fill="#33586B"/><circle cx="69.8" cy="182.5" r="3.4" fill="#33586B"/><circle cx="75.0" cy="170.0" r="3.4" fill="#33586B"/><circle cx="83.2" cy="159.2" r="3.4" fill="#33586B"/><circle cx="94.0" cy="151.0" r="3.4" fill="#33586B"/><circle cx="106.5" cy="145.8" r="3.4" fill="#33586B"/><text x="120" y="196" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="600" fill="#33586B" text-anchor="middle">24</text><rect x="228" y="150" width="388" height="50" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><text x="242" y="171" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Rounds 1-4</text><text x="242" y="187" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">6 - 12 - 18 - 24 sts, increasing the whole way up</text><path d="M 422 200 v 12" stroke="#DDD4C6" stroke-width="1.5"/><rect x="228" y="212" width="388" height="50" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><text x="242" y="233" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Rounds 5-16</text><text x="242" y="249" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">work even in sc, no further increases, stuff firmly</text><path d="M 422 262 v 12" stroke="#DDD4C6" stroke-width="1.5"/><rect x="228" y="274" width="388" height="50" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><text x="242" y="295" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Final round</text><text x="242" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">sc2tog evenly to close the bottom slightly</text><text x="120" y="278" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">widens, then holds</text><text x="24" y="328" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">No increases after round 4, yet the tube still widens visually into a cone because the</text><text x="24" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">rounds are worked without decreasing, and the stuffing pushes the closed base narrower than</text><text x="24" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the top.</text></svg>