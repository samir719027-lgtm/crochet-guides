<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" width="640" height="294" font-family="'Work Sans', -apple-system, sans-serif"><title>US vs UK terms</title><rect width="640" height="294" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">US vs UK terms</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The same stitch, renamed in each system</text><rect x="24" y="92" width="592" height="28" fill="#22404F"/><text x="34" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">US abbr.</text><text x="130" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">UK abbr.</text><text x="226" y="111" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">What changed</text><rect x="24" y="120" width="592" height="30" fill="#FFFFFF"/><text x="34" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">sc</text><text x="130" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dc</text><text x="226" y="137" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">single in US, double in UK</text><line x1="24" y1="150" x2="616" y2="150" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="150" width="592" height="30" fill="#E4DACB"/><text x="34" y="167" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">hdc</text><text x="130" y="167" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">htr</text><text x="226" y="167" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">half double / half treble</text><line x1="24" y1="180" x2="616" y2="180" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="180" width="592" height="30" fill="#FFFFFF"/><text x="34" y="197" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dc</text><text x="130" y="197" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">tr</text><text x="226" y="197" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">double / treble</text><line x1="24" y1="210" x2="616" y2="210" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="210" width="592" height="30" fill="#E4DACB"/><text x="34" y="227" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">tr</text><text x="130" y="227" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">dtr</text><text x="226" y="227" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">treble / double treble</text><line x1="24" y1="240" x2="616" y2="240" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="592" height="148" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The stitch you make is identical. Only the name and the letter move.</text></svg>