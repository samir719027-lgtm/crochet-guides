<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" font-family="'Work Sans', -apple-system, sans-serif"><title>Not a variation on the newborn hat</title><rect width="640" height="342" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Not a variation on the newborn hat</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Six rounds in common, then a fork</text><rect x="24" y="92" width="284" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="284" height="34" rx="4" fill="#33586B"/><rect x="24" y="116" width="284" height="10" fill="#33586B"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">NEWBORN HAT</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a shrinking crown</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">straight into a stretchy</text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">ribbed or plain band</text><text x="38" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">built to hold warmth</text><text x="38" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">against a very young head</text><rect x="332" y="92" width="284" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="332" y="92" width="284" height="34" rx="4" fill="#A63B4A"/><rect x="332" y="116" width="284" height="10" fill="#A63B4A"/><text x="346" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">SUN HAT</text><text x="346" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">the same first 6 rounds</text><text x="346" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">then increasing resumes</text><text x="346" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">after a short straight</text><text x="346" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">section</text><text x="346" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="346" y="248" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a flared brim in light</text><text x="346" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">cotton, nearly twice the</text><text x="346" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">crown circumference</text><text x="24" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">They share a foundation and nothing else. The finished object, the yarn weight and the</text><text x="24" y="304" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">season they are each meant for are all different, and the two patterns do not share stitch</text><text x="24" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">counts past the crown.</text></svg>