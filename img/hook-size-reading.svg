<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 425" width="640" height="425" font-family="'Work Sans', -apple-system, sans-serif"><title>Reading a hook you already own</title><rect width="640" height="425" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Reading a hook you already own</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The three systems printed on the same shaft</text><rect x="24" y="216" width="592" height="52" rx="4" fill="#33586B"/><text x="320.0" y="248" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Which system is the pattern using?</text><path d="M 320.0 268 V 284" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 116.66666666666667 284 V 302" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="24.0" y="302" width="185" height="91" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24.0" y="302" width="4" height="91" rx="2" fill="#33586B"/><text x="40.0" y="328" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Letter sizes</text><text x="40.0" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">G-6, 7, 8, 9</text><text x="40.0" y="363" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">US and Canadian</text><text x="40.0" y="378" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">patterns</text><path d="M 320.0 268 V 284" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 320.0 284 V 302" stroke="#DDD4C6" stroke-width="1.5" 