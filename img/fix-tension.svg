<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="'Work Sans', -apple-system, sans-serif"><title>Tension drifts looser as you go</title><rect width="640" height="350" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Tension drifts looser as you go</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Break before it drifts, not after</text><rect x="24.0" y="180" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="180" width="4" height="66" rx="2" fill="#33586B"/><text x="40.0" y="202" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Break every 20-30 min</text><text x="40.0" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">put the work down before</text><text x="40.0" y="231" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">your hands drift</text><rect x="228.0" y="180" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="180" width="4" height="66" rx="2" fill="#D8A23C"/><text x="244.0" y="202" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Reset your grip</text><text x="244.0" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">consciously re-grip when</text><text x="244.0" y="231" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">you pick it back up</text><rect x="432.0" y="180" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="180" width="4" height="66" rx="2" fill="#A63B4A"/><text x="448.0" y="202" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Don&#x27;t pull later</text><text x="448.0" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">fixing it by tugging</text><text x="448.0" y="231" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">finished rows makes it</text><text x="24" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Tension loosening as you go is your grip relaxing naturally over a sitting, not a change in</text><text x="24" y="314" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">your yarn or hook.</text></svg>