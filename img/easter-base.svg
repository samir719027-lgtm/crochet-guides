<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" width="640" height="524" font-family="'Work Sans', -apple-system, sans-serif"><title>The base: six increases a round</title><rect width="640" height="524" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The base: six increases a round</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">6, 12, 18, 24, 30, 36, 42</text><rect x="24" y="330" width="150" height="96" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="330" width="150" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="354" width="150" height="10" fill="#A63B4A"/><text x="38" y="353" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">It cups</text><text x="38" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Your increases are</text><text x="38" y="406" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">too far apart</text><rect x="190" y="330" width="150" height="96" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="190" y="330" width="150" height="34" rx="4" fill="#D8A23C"/><rect x="190" y="354" width="150" height="10" fill="#D8A23C"/><text x="204" y="353" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">It ruffles</text><text x="204" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Your increases are</text><text x="204" y="406" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">too close</text><text x="24" y="472" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The walls will only ever be as tidy as the circle they grow out of, so this round is where</text><text x="24" y="488" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">beginners trip up and where frogging back is the fix.</text></svg>