<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" font-family="'Work Sans', -apple-system, sans-serif"><title>A matching set of four</title><rect width="640" height="256" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">A matching set of four</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Why even tension matters more than colour choice</text><circle cx="114" cy="150" r="44" fill="#33586B" opacity="0.7"/><circle cx="114" cy="150" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="244" cy="150" r="44" fill="#D8A23C" opacity="0.7"/><circle cx="244" cy="150" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="374" cy="150" r="44" fill="#A63B4A" opacity="0.7"/><circle cx="374" cy="150" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><circle cx="504" cy="150" r="44" fill="#22404F" opacity="0.7"/><circle cx="504" cy="150" r="44" fill="none" stroke="#DDD4C6" stroke-width="2"/><text x="344" y="84" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#2A241E" text-anchor="middle">a set of four, finished the same way</text><text x="24" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Same tension on all four and the same edge round make a set look intentional.</text></svg>