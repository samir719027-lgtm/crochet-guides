<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="'Work Sans', -apple-system, sans-serif"><title>Closure and pom-pom</title><rect width="640" height="320" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Closure and pom-pom</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">An angled wrap, reinforced twice over</text><rect x="410.0" y="166" width="206" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="410.0" y="166" width="4" height="64" rx="2" fill="#33586B"/><text x="426.0" y="188" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Reinforce the buttons</text><text x="426.0" y="204" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">doubled thread through a felt</text><text x="426.0" y="217" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">backing disc, not yarn alone</text><text x="24" y="266" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Sew the pom-pom through its centre from several angles rather than wrapping a single strand</text><text x="24" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">around it, so individual strands cannot work loose with handling and washing. Trim it short</text><text x="24" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and even.</text></svg>