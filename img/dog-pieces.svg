<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="'Work Sans', -apple-system, sans-serif"><title>The pieces</title><rect width="640" height="450" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The pieces</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Seven parts, one continuous technique</text><rect x="24" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="186" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="186" height="8" fill="#33586B"/><text x="117.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">HEAD</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 to 36 sts over 6 rounds,</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">5 even, then 5 decrease</text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rounds to 6</text><rect x="224" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="92" width="186" height="30" rx="4" fill="#D8A23C"/><rect x="224" y="114" width="186" height="8" fill="#D8A23C"/><text x="317.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">MUZZLE</text><text x="236" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">cream, worked separately,</text><text x="236" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">12 sts, stuffed firmly</text><text x="236" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">before closing</text><rect x="424" y="92" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="92" width="186" height="30" rx="4" fill="#33586B"/><rect x="424" y="114" width="186" height="8" fill="#33586B"/><text x="517.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">BODY</text><text x="436" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">6 to 30 sts, 4 even rounds</text><text x="436" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">at the teardrop&#x27;s widest</text><text x="436" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">point, then taper</text><rect x="24" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="234" width="186" height="30" rx="4" fill="#22404F"/><rect x="24" y="256" width="186" height="8" fill="#22404F"/><text x="117.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">LEGS x4</text><text x="36" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tan, 6 to 12 sts, 3 even</text><text x="36" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">rounds, stuffed lightly</text><text x="36" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">and flattened</text><rect x="224" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="224" y="234" width="186" height="30" rx="4" fill="#A63B4A"/><rect x="224" y="256" width="186" height="8" fill="#A63B4A"/><text x="317.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">EARS x2</text><text x="236" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">flat, 3 to 5 sts, BLO if</text><text x="236" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">you want more structure;</text><text x="236" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">finished length about 2.5in</text><rect x="424" y="234" width="186" height="124" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="424" y="234" width="186" height="30" rx="4" fill="#22404F"/><rect x="424" y="256" width="186" height="8" fill="#22404F"/><text x="517.0" y="254" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">TAIL</text><text x="436" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">tan, 5 sc, 3 even rounds,</text><text x="436" y="297" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">stuffed lightly</text><text x="436" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="24" y="396" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The muzzle is the only part worked and stuffed entirely before it ever touches the head.</text><text x="24" y="412" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Everything else is continuous rounds or flat rows.</text></svg>