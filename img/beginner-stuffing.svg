<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="'Work Sans', -apple-system, sans-serif"><title>Stuffing and closing</title><rect width="640" height="450" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Stuffing and closing</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Firm, but not stretched</text><rect x="24" y="244" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="262" r="11" fill="#33586B"/><text x="42" y="266" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="266" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Cut a long tail</text><text x="36" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Leave enough to weave</text><text x="36" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">through the remaining</text><path d="M 204 282.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="244" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="262" r="11" fill="#33586B"/><text x="238" y="266" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="266" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Front loops only</text><text x="232" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Thread it through the</text><text x="232" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">front loops of the</text><path d="M 400 282.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="416" y="244" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="434" cy="262" r="11" fill="#33586B"/><text x="434" y="266" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="454" y="266" font-family="Fraunces, Georgia, serif" font-size="10.5" font-weight="600" fill="#2A241E" text-anchor="start">Cinch like a drawstring</text><text x="428" y="288" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Pull to close them</text><text x="428" y="302" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">together</text><rect x="24" y="350" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="368" r="11" fill="#33586B"/><text x="42" y="372" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="372" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Lock it</text><text x="36" y="394" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Take one more stitch</text><text x="36" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">through the closure</text><path d="M 204 388.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="350" width="176" height="76" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="368" r="11" fill="#33586B"/><text x="238" y="372" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="258" y="372" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Bury it</text><text x="232" y="394" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Run the needle back</text><text x="232" y="408" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">through the body and out</text></svg>