<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 188" width="640" height="188" font-family="'Work Sans', -apple-system, sans-serif"><title>Reading charts as a lefty</title><rect width="640" height="188" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Reading charts as a lefty</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The most handed-agnostic thing in the craft</text><circle cx="32" cy="92" r="6" fill="#2A241E"/><text x="46" y="96" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Slip stitch - a filled dot</text><circle cx="172" cy="92" r="6" fill="#2A241E"/><text x="186" y="96" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Single crochet - cross or plus</text><circle cx="32" cy="116" r="6" fill="#A63B4A"/><text x="46" y="120" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Double crochet - T with one bar</text><circle cx="172" cy="116" r="6" fill="#33586B"/><text x="186" y="120" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Charts show the front of the work</text><text x="24" y="166" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">No chart symbol contains information about which hand you use.</text></svg>