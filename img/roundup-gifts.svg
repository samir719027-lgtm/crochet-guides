<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="'Work Sans', -apple-system, sans-serif"><title>Gifting for the holidays</title><rect width="640" height="500" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Gifting for the holidays</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Useful accessories make the best gifts</text><rect x="24" y="92" width="592" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="4" height="88" rx="2" fill="#33586B"/><text x="42" y="116" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Genuinely useful as a gift</text><text x="42" y="136" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Beanie, cowl, fingerless gloves and slippers</text><text x="42" y="151" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">are winter accessories most people are happy to receive, and none takes</text><text x="42" y="166" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">more than a few evenings, so several people on your list is realistic.</text><rect x="24" y="196" width="592" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="196" width="4" height="88" rx="2" fill="#D8A23C"/><text x="42" y="220" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Smaller add-on gifts</text><text x="42" y="240" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A fall pumpkin or a mug cozy pairs well with something bigger, wrapped</text><text x="42" y="255" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">together as a little seasonal set rather than given on its own.</text><rect x="24" y="300" width="592" height="88" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="300" width="4" height="88" rx="2" fill="#A63B4A"/><text x="42" y="324" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Plan around a fixed date</text><text x="42" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A holiday gathering changes which project you prioritise. A chunky throw</text><text x="42" y="359" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">or poncho is still reachable in the weeks before, but start anything larger well</text><text x="42" y="374" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">before the season gets busy.</text><text x="24" y="414" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The roundup is chosen on timing as much as on the finished object: a poncho is useful</text><text x="24" y="430" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">year-round in some climates but becomes the right project the moment the mornings turn</text><text x="24" y="446" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">crisp.</text></svg>