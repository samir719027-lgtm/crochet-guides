<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" width="640" height="456" font-family="'Work Sans', -apple-system, sans-serif"><title>Adjusting for foot width</title><rect width="640" height="456" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#D8A23C"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Adjusting for foot width</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Length gets the attention, width decides the fit</text><rect x="24" y="196" width="290" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="196" width="290" height="34" rx="4" fill="#33586B"/><rect x="24" y="220" width="290" height="10" fill="#33586B"/><text x="38" y="219" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Live</text><text x="38" y="252" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Try the sock on partway</text><text x="38" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">through the gusset</text><text x="38" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">The part most sensitive</text><text x="38" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">to an individual</text><text x="38" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">foot&#x27;s proportions</text><rect x="338" y="196" width="290" height="170" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="338" y="196" width="290" height="34" rx="4" fill="#D8A23C"/><rect x="338" y="220" width="290" height="10" fill="#D8A23C"/><text x="352" y="219" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">Making for someone else</text><text x="352" y="252" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Trace their foot on paper</text><text x="352" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="352" y="292" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Measure the length and</text><text x="352" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">the widest point,</text><text x="352" y="332" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">and compare both</text><text x="352" y="352" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">against your swatch</text><text x="24" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Length alone misses a genuinely too-narrow or too-wide result, because foot proportions vary</text><text x="24" y="434" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">enough between people that shoe size does not settle it.</text></svg>