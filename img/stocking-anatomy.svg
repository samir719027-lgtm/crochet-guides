<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286" font-family="'Work Sans', -apple-system, sans-serif"><title>Stocking anatomy</title><rect width="640" height="286" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Stocking anatomy</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Where the curve, cuff, and initial go</text><path d="M 300 116 L 388 116 L 388 206 C 388 236 410 236 428 252 C 440 264 432 220 404 220 L 300 220 C 300 246 314 226 314 206 Z" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="296" y="114" width="96" height="30" rx="6" fill="#A63B4A" opacity="0.6" stroke="#DDD4C6"/><text x="344" y="134" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#FFFFFF" text-anchor="middle">cuff - initial here</text><path d="M 300 220 C 300 246 314 226 314 206 L 314 220" fill="none" stroke="#D8A23C" stroke-width="3"/><text x="326" y="210" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#2A241E" text-anchor="middle">heel</text><text x="402" y="210" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#2A241E" text-anchor="middle">toe</text><text x="402" y="224" font-family="'Space Mono', monospace" font-size="10" font-weight="400" fill="#5A5148" text-anchor="middle">foot curve</text><text x="24" y="264" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Two matching panels: cuff, straight leg, heel curve, foot, toe.</text></svg>