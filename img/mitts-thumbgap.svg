<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="'Work Sans', -apple-system, sans-serif"><title>Where the thumb gap goes</title><rect width="640" height="290" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Where the thumb gap goes</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The single detail that makes these mitts</text><rect x="274" y="70" width="140" height="150" rx="40" fill="#EDE6D9" stroke="#DDD4C6"/><path d="M 414 150 h 34 v 34 h -34" fill="none" stroke="#E4DACB" stroke-width="2" stroke-dasharray="4 3"/><text x="422" y="164" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#A63B4A" text-anchor="start">ch 4 gap</text><text x="422" y="180" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#A63B4A" text-anchor="start">= thumb</text><rect x="274" y="186" width="140" height="34" rx="8" fill="#D8A23C" opacity="0.55" stroke="#DDD4C6"/><text x="344" y="208" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">cuff</text><circle cx="296" cy="96" r="4" fill="#33586B" opacity="0.7"/><circle cx="312" cy="96" r="4" fill="#33586B" opacity="0.7"/><circle cx="328" cy="96" r="4" fill="#33586B" opacity="0.7"/><circle cx="344" cy="96" r="4" fill="#33586B" opacity="0.7"/><circle cx="360" cy="96" r="4" fill="#33586B" opacity="0.7"/><circle cx="376" cy="96" r="4" fill="#33586B" opacity="0.7"/><circle cx="392" cy="96" r="4" fill="#33586B" opacity="0.7"/><text x="344" y="86" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#33586B" text-anchor="middle">finger stitches</text><text x="24" y="268" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Round 6 skips 4 stitches for a ch-4 thumb gap, then the fingers are worked above it.</text></svg>