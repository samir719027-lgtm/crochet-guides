<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 608" width="640" height="608" font-family="'Work Sans', -apple-system, sans-serif"><title>Dividing 24 into 8 tentacles</title><rect width="640" height="608" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Dividing 24 into 8 tentacles</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The whole trick of the pattern</text><rect x="292" y="108" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="310" cy="126" r="11" fill="#33586B"/><text x="310" y="130" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="330" y="130" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Work 3 sts only</text><text x="304" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">10 rounds even, then</text><text x="304" y="166" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">white for 2 more</text><rect x="292" y="218" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="310" cy="236" r="11" fill="#33586B"/><text x="310" y="240" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="330" y="240" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Slip stitch 2</text><text x="304" y="262" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the curl comes from</text><text x="304" y="276" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">here</text><rect x="292" y="328" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="310" cy="346" r="11" fill="#33586B"/><text x="310" y="350" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="330" y="350" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rejoin the next</text><text x="304" y="372" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">unworked stitch on</text><text x="304" y="386" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the mantle</text><rect x="292" y="438" width="150" height="80" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="310" cy="456" r="11" fill="#33586B"/><text x="310" y="460" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="330" y="460" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Repeat to 8</text><text x="304" y="482" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">moving around the</text><text x="304" y="496" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">mantle in order</text><text x="24" y="570" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Ignore the other 21 stitches rather than closing the round. Move around the mantle in order</text><text x="24" y="586" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and all eight tentacles stay the same length.</text></svg>