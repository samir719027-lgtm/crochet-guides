<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Attaching the trunk</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Attaching the trunk</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Lightly stuffed, and curved rather than straight</text><rect x="24.0" y="300" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="300" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="322" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Check from above</text><text x="40.0" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Lay the head flat and look straight down</text><text x="40.0" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">before sewing anything on</text><rect x="330.0" y="300" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="300" width="4" height="54" rx="2" fill="#33586B"/><text x="346.0" y="322" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Stuff as you go</text><text x="346.0" y="338" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Small even pieces, rather than all at once at</text><text x="346.0" y="351" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the end</text><text x="24" y="384" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A lopsided elephant is almost always uneven stuffing or off-centre ear and trunk placement,</text><text x="24" y="400" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">not a fault in the pattern. Both sides match far more reliably once the head is laid flat</text><text x="24" y="416" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and checked from directly above.</text></svg>