<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" font-family="'Work Sans', -apple-system, sans-serif"><title>Your first hook</title><rect width="640" height="242" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Your first hook</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">What a beginner actually needs to buy</text><rect x="24" y="96" width="176" height="64" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#33586B"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Pick one</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Clover Amour or Tulip</text><text x="36" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Etimo, 4.0mm</text><path d="M 204 128.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="220" y="96" width="176" height="64" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="238" cy="114" r="11" fill="#33586B"/><text x="238" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="258" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Add a second</text><text x="232" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-