<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Work Sans', -apple-system, sans-serif"><title>Good first projects</title><rect width="640" height="520" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Good first projects</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Build up in size as counting gets reliable</text><rect x="24.0" y="350" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="350" width="4" height="80" rx="2" fill="#33586B"/><text x="40.0" y="372" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Count the width first</text><text x="40.0" y="388" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Squares across the chart,</text><text x="40.0" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">plus the chains the</text><rect x="228.0" y="350" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="350" width="4" height="80" rx="2" fill="#33586B"/><text x="244.0" y="372" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Check for border rows</text><text x="244.0" y="388" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Most charts frame the</text><text x="244.0" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">design in plain mesh;</text><rect x="432.0" y="350" width="184" height="80" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="350" width="4" height="80" rx="2" fill="#33586B"/><text x="448.0" y="372" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Silhouettes read best</text><text x="448.0" y="388" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">A heart, a leaf, an animal</text><text x="448.0" y="401" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">outline. Fine internal</text><text x="24" y="460" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A foundation chain that is even one square off throws every row above it out of alignment</text><text x="24" y="476" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">with the intended picture, so it is worth counting before the first row rather than after</text><text x="24" y="492" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">the twentieth.</text></svg>