"#2A241E" text-anchor="start">4</text><text x="174" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="264" y="218" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">[sc 2, inc] around</text><line x1="24" y1="228" x2="616" y2="228" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="228" width="592" height="27" fill="#FFFFFF"/><text x="34" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Body</text><text x="104" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">5-18</text><text x="174" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">24</text><text x="264" y="245" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Sc every st - 14 body rounds</text><line x1="24" y1="255" x2="616" y2="255" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="255" width="592" height="27" fill="#E4DACB"/><text x="34" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Neck</text><text x="104" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">19-23</text><text x="174" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">taper</text><text x="264" y="272" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">decreases; check against bottle</text><line x1="24" y1="282" x2="616" y2="282" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="92" width="592" height="190" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="304" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Check the body height against your bottle before the neck decreases.</text></svg>