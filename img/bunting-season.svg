<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" font-family="'Work Sans', -apple-system, sans-serif"><title>Choosing for the season, and safety</title><rect width="640" height="386" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Choosing for the season, and safety</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Weight is a decision, not a default</text><rect x="24" y="92" width="284" height="146" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="284" height="34" rx="4" fill="#D8A23C"/><rect x="24" y="116" width="284" height="10" fill="#D8A23C"/><text x="38" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">WARMER MONTHS</text><text x="38" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a lighter DK-weight cotton</text><text x="38" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="38" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">keeps a bunting from</text><text x="38" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">overheating a baby</text><text x="38" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">in a warm room</text><rect x="332" y="92" width="284" height="146" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="332" y="92" width="284" height="34" rx="4" fill="#33586B"/><rect x="332" y="116" width="284" height="10" fill="#33586B"/><text x="346" y="115" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">GENUINE WINTER</text><text x="346" y="148" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">a real worsted or chunky</text><text x="346" y="168" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">wool-blend</text><text x="346" y="188" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="346" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">actual warmth, not</text><text x="346" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">assumed warmth</text><rect x="24" y="254" width="592" height="72" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24" y="254" width="4" height="72" rx="2" fill="#A63B4A"/><text x="42" y="280" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Neither substitutes well for the other</text><text x="42" y="299" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A cotton-blend yarn can shrink slightly with repeated laundering, which sometimes pulls a</text><text x="42" y="313" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">button&#x27;s backing stitching tighter or looser than it started, so re-check the buttons and</text><text x="42" y="327" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">tug-test the pom-pom after washing.</text><text x="24" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">This item is intended for supervised use. If you plan to use it at bedtime, follow standard</text><text x="24" y="364" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">safe-sleep guidance and use a certified sleep sack instead.</text></svg>