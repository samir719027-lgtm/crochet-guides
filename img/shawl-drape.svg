<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458" font-family="'Work Sans', -apple-system, sans-serif"><title>Why drape matters more than density</title><rect width="640" height="458" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Why drape matters more than density</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">A shawl and a blanket want opposites</text><rect x="24.0" y="306" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="306" width="4" height="64" rx="2" fill="#D8A23C"/><text x="40.0" y="328" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Go up a hook</text><text x="40.0" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">if the fabric is too stiff</text><text x="40.0" y="357" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">to move</text><rect x="228.0" y="306" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="306" width="4" height="64" rx="2" fill="#33586B"/><text x="244.0" y="328" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">DK or light worsted</text><text x="244.0" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">the best balance of drape</text><text x="244.0" y="357" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">and structure</text><rect x="432.0" y="306" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="306" width="4" height="64" rx="2" fill="#A63B4A"/><text x="448.0" y="328" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Fibre matters too</text><text x="448.0" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">wool, wool blend or bamboo</text><text x="448.0" y="357" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">drapes softer than acrylic</text><text x="24" y="420" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The two can use the same basic stitches and still need almost opposite fabric, which is why</text><text x="24" y="436" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">this gauge is written loose on purpose.</text></svg>