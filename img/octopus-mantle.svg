<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 572" width="640" height="572" font-family="'Work Sans', -apple-system, sans-serif"><title>The mantle, round by round</title><rect width="640" height="572" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The mantle, round by round</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">30 at the widest, 24 at the rim</text><rect x="268" y="96" width="160" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="114" r="11" fill="#33586B"/><text x="286" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="306" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Rounds 1-5</text><text x="280" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">6, 12, 18, 24, 30 sts,</text><text x="280" y="154" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">increasing each round</text><rect x="268" y="200" width="160" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="218" r="11" fill="#33586B"/><text x="286" y="222" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="306" y="222" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">5 even rounds</text><text x="280" y="244" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">30 sts each round, no</text><text x="280" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">shaping, stuff firmly</text><rect x="268" y="304" width="160" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="322" r="11" fill="#33586B"/><text x="286" y="326" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="306" y="326" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">[sc 3, dec]</text><text x="280" y="348" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">back to 24, top up the</text><text x="280" y="362" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">stuffing</text><rect x="268" y="408" width="160" height="74" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="286" cy="426" r="11" fill="#33586B"/><text x="286" y="430" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="306" y="430" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">One even round</text><text x="280" y="452" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">24 sts, do not fasten</text><text x="280" y="466" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">off</text><text x="24" y="534" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">That last even round of 24 is the one that matters. 24 divides into 8 groups of 3, which is</text><text x="24" y="550" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">where all eight tentacles come from, so nothing is closed with a decrease here.</text></svg>