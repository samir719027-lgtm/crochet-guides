<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338" font-family="'Work Sans', -apple-system, sans-serif"><title>Ways to use it</title><rect width="640" height="338" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Ways to use it</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Sew it, glue it, or string a garland</text><rect x="24" y="92" width="176" height="156" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="92" width="176" height="30" rx="4" fill="#33586B"/><rect x="24" y="114" width="176" height="8" fill="#33586B"/><text x="112.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">SEW ON</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Hat, headband or bag</text><text x="36" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="36" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Needle and thread</text><text x="36" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">through the centre</text><text x="36" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">and around the</text><text x="36" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">outer petals</text><rect x="216" y="92" width="176" height="156" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="216" y="92" width="176" height="30" rx="4" fill="#D8A23C"/><rect x="216" y="114" width="176" height="8" fill="#D8A23C"/><text x="304.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">GLUE ON</text><text x="228" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Plain metal hair clip</text><text x="228" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">or a brooch pin back</text><text x="228" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="228" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Fast, and turns the</text><text x="228" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">motif into a</text><text x="228" y="215" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">wearable</text><rect x="408" y="92" width="176" height="156" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="408" y="92" width="176" height="30" rx="4" fill="#A63B4A"/><rect x="408" y="114" width="176" height="8" fill="#A63B4A"/><text x="496.0" y="112" font-family="'Space Mono', monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">STRING TOGETHER</text><text x="420" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">Several flowers with</text><text x="420" y="155" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">short chains between</text><text x="420" y="170" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start"></text><text x="420" y="185" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">A garland or</text><text x="420" y="200" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#2A241E" text-anchor="start">bunting</text><text x="24" y="300" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Sewing through the centre and around the outer petals is what stops the flower twisting</text><text x="24" y="316" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">loose as it is worn.</text></svg>