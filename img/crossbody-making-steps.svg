<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="'Work Sans', -apple-system, sans-serif"><title>Making the bag</title><rect width="640" height="340" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Making the bag</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The five building steps</text><rect x="24" y="96" width="120" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="42" cy="114" r="11" fill="#33586B"/><text x="42" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="118" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Front panel</text><text x="36" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Rows of sc in worsted</text><path d="M 148 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap="round"/><rect x="164" y="96" width="120" height="70" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><circle cx="182" cy="114" r="11" fill="#33586B"/><text x="182" y="118" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="202" y="118" font-family="Fraunces, Georgia, serif" font-size="13.0" font-weight="600" fill="#2A241E" text-anchor="start">Back panel</text><text x="176" y="140" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Worked to match</text><path d="M 288 131.0 h 8 m -4 -5 l 5 5 -5 5" fill="none" stroke="#33586B" stroke-width="1.8" stroke-linecap=