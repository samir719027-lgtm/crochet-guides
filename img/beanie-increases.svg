<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" font-family="'Work Sans', -apple-system, sans-serif"><title>Crown increases at a glance</title><rect width="640" height="316" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Crown increases at a glance</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">6 to 48 stitches over eight even rounds</text><ellipse cx="144" cy="205.836" rx="14.52" ry="10.4544" fill="#33586B" opacity="0.75"/><text x="144" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Round 1</text><text x="144" y="256" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">6 sts</text><ellipse cx="274" cy="204.072" rx="17.04" ry="12.268799999999999" fill="#33586B" opacity="0.75"/><text x="274" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Round 2</text><text x="274" y="256" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">12 sts</text><ellipse cx="404" cy="200.544" rx="22.08" ry="15.897599999999999" fill="#D8A23C" opacity="0.75"/><text x="404" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Round 4</text><text x="404" y="256" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">24 sts</text><ellipse cx="534" cy="193.488" rx="32.16" ry="23.155199999999997" fill="#D8A23C" opacity="0.75"/><text x="534" y="238" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">Round 8</text><text x="534" y="256" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#5A5148" text-anchor="middle">48 sts</text><text x="24" y="294" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Each increase round adds exactly 6 stitches and keeps the crown flat.</text></svg>