<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" font-family="'Work Sans', -apple-system, sans-serif"><title>Gifts to make yourself</title><rect width="640" height="334" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Gifts to make yourself</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Projects that fit anyone you crochet for</text><rect x="24" y="96" width="592" height="52" rx="4" fill="#33586B"/><text x="320.0" y="128" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Crocheting the gift? Pick a size-free make:</text><path d="M 320.0 148 V 164" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 116.66666666666667 164 V 182" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="24.0" y="182" width="185" height="108" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24.0" y="182" width="4" height="108" rx="2" fill="#33586B"/><text x="40.0" y="208" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Granny coasters</text><text x="40.0" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Finishes in an</text><text x="40.0" y="243" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">evening or two.</text><text x="40.0" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Round version:</text><text x="40.0" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">coasters pattern.</text><path d="M 320.0 148 V 164" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 320.0 164 V 182" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="227.33333333333334" y="182" width="185" height="108" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="227.33333333333334" y="182" width="4" height="108" rx="2" fill="#D8A23C"/><text x="243.33333333333334" y="208" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Simple scarf</text><text x="243.33333333333334" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">One size fits</text><text x="243.33333333333334" y="243" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">everyone and is</text><text x="243.33333333333334" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">forgiving under a</text><text x="243.33333333333334" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">deadline.</text><path d="M 320.0 148 V 164" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><path d="M 523.3333333333334 164 V 182" stroke="#DDD4C6" stroke-width="1.5" fill="none"/><rect x="430.6666666666667" y="182" width="185" height="108" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="430.6666666666667" y="182" width="4" height="108" rx="2" fill="#A63B4A"/><text x="446.6666666666667" y="208" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#2A241E" text-anchor="start">Amigurumi keychain</text><text x="446.6666666666667" y="228" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Small, personal,</text><text x="446.6666666666667" y="243" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">and quick to</text><text x="446.6666666666667" y="258" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">finish or</text><text x="446.6666666666667" y="273" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">repeat.</text><text x="24" y="312" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">None of these depend on knowing the recipient&#x27;s measurements.</text></svg>