<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-labelledby="t d">
  <title id="t">Counting rows in flat work and rounds in a spiral</title>
  <desc id="d">On the left, flat rows are counted along the side edge and numbered in a simple sequence, so every row is easy to find. On the right, a spiral rounds as one continuous piece with no real edge, so stitch markers in the first stitch of each round are needed to find the round number later.</desc>
  <rect width="640" height="316" fill="#FBF8F2"/>
  <rect width="640" height="44" fill="#E4DACB"/>
  <text x="24" y="29" font-family="Work Sans, sans-serif" font-size="15.5" font-weight="600" fill="#2A241E">Rows stack. Rounds spiral.</text>

  <text x="24" y="74" font-family="Space Mono, monospace" font-size="11" fill="#33586B">FLAT ROWS</text>
  <text x="344" y="74" font-family="Space Mono, monospace" font-size="11" fill="#A63B4A">IN THE ROUND</text>

  <rect x="24" y="86" width="272" height="164" rx="4" fill="#FFFFFF" stroke="#DED5C6"/>
  <g stroke="#B9AE9C" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="52" y1="112" x2="268" y2="112"/>
    <line x1="52" y1="134" x2="268" y2="134"/>
    <line x1="52" y1="156" x2="268" y2="156"/>
    <line x1="52" y1="178" x2="268" y2="178"/>
    <line x1="52" y1="200" x2="268" y2="200"/>
    <line x1="52" y1="222" x2="268" y2="222"/>
  </g>
  <g font-family="Space Mono, monospace" font-size="10" fill="#33586B" text-anchor="end">
    <text x="44" y="116">1</text><text x="44" y="138">2</text><text x="44" y="160">3</text>
    <text x="44" y="182">4</text><text x="44" y="204">5</text><text x="44" y="226">6</text>
  </g>
  <path d="M272 112 L278 119 L272 126" stroke="#33586B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="244" font-family="Work Sans, sans-serif" font-size="11.5" fill="#5A5148">Side edge is a ruler.</text>

  <rect x="344" y="86" width="272" height="164" rx="4" fill="#FFFFFF" stroke="#DED5C6"/>
  <circle cx="470" cy="166" r="72" fill="none" stroke="#B9AE9C" stroke-width="2"/>
  <circle cx="470" cy="166" r="58" fill="none" stroke="#B9AE9C" stroke-width="2"/>
  <circle cx="470" cy="166" r="44" fill="none" stroke="#B9AE9C" stroke-width="2"/>
  <circle cx="470" cy="166" r="30" fill="none" stroke="#B9AE9C" stroke-width="2"/>
  <circle cx="470" cy="166" r="16" fill="none" stroke="#B9AE9C" stroke-width="2"/>
  <g>
    <circle cx="470" cy="94" r="4.6" fill="#A63B4A"/>
    <circle cx="542" cy="166" r="4.6" fill="#A63B4A"/>
    <circle cx="470" cy="238" r="4.6" fill="#A63B4A"/>
  </g>
  <g font-family="Space Mono, monospace" font-size="9.5" fill="#A63B4A">
    <text x="480" y="92">R1</text>
    <text x="552" y="170">R2</text>
    <text x="424" y="256">R3</text>
  </g>
  <text x="360" y="244" font-family="Work Sans, sans-serif" font-size="11.5" fill="#5A5148">Markers = round number</text>

  <line x1="24" y1="268" x2="616" y2="268" stroke="#DED5C6" stroke-width="1"/>
  <text x="24" y="292" font-family="Work Sans, sans-serif" font-size="12.5" fill="#5A5148">In a spiral there is no row edge to count against, so the marker you put in the first stitch is your only record of where a round starts.</text>
  <text x="24" y="310" font-family="Work Sans, sans-serif" font-size="12.5" font-weight="600" fill="#A63B4A">Move the marker every round. Never move it two rounds later, or the count is off.</text>
</svg>
