<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" font-family="'Work Sans', -apple-system, sans-serif"><title>Decreasing back to a square</title><rect width="640" height="328" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Decreasing back to a square</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The mirror image of the increase</text><rect x="32" y="104" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="80" y="104" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="128" y="104" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="176" y="104" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="224" y="104" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="272" y="104" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="32" y="136" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="80" y="136" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="128" y="136" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="176" y="136" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="224" y="136" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="272" y="136" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="32" y="168" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="80" y="168" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="128" y="168" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="176" y="168" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="224" y="168" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="272" y="168" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="32" y="200" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="80" y="200" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="128" y="200" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="176" y="200" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="224" y="200" width="46" height="30" rx="3" fill="#33586B" stroke="#DDD4C6"/><rect x="272" y="200" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="32" y="232" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="80" y="232" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="128" y="232" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="176" y="232" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="224" y="232" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><rect x="272" y="232" width="46" height="30" rx="3" fill="none" stroke="#DDD4C6"/><text x="198" y="190" font-family="'Space Mono', monospace" font-size="12" font-weight="400" fill="#22404F" text-anchor="middle">widening</text><text x="54" y="204" font-family="'Space Mono', monospace" font-size="10.5" font-weight="400" fill="#5A5148" text-anchor="middle">start</text><path d="M 232 108 L 332 194" stroke="#A63B4A" stroke-width="2" fill="none" stroke-dasharray="5 4"/><text x="338" y="208" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="start">turn the corner</text><text x="338" y="224" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">and decrease</text><text x="338" y="240" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">back to a square</text><text x="24" y="290" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Decreasing rows mirror the increase rows, which is what brings the diagonal back to a clean</text><text x="24" y="306" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">square.</text></svg>