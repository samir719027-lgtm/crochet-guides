<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" font-family="'Work Sans', -apple-system, sans-serif"><title>Adjusting for different hands</title><rect width="640" height="328" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Adjusting for different hands</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Stitches or rounds, not both</text><rect x="24.0" y="270" width="592" height="58" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="270" width="4" height="58" rx="2" fill="#33586B"/><text x="40.0" y="292" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Don&#x27;t change both</text><text x="40.0" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">adjusting the stitch count and the rounds together can throw off gusset placement</text></svg>