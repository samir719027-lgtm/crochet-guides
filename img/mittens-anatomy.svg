<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" width="640" height="278" font-family="'Work Sans', -apple-system, sans-serif"><title>The mitten at a glance</title><rect width="640" height="278" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The mitten at a glance</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Where the ribbing ends and the hand begins</text><path d="M 298 120 C 298 62 314 52 344 52 C 374 52 390 62 390 120 L 390 190 L 298 190 Z" fill="#EDE6D9" stroke="#DDD4C6" stroke-width="2"/><line x1="300" y1="146" x2="388" y2="146" stroke="#A63B4A" stroke-width="2" opacity="0.6"/><line x1="298" y1="94" x2="390" y2="94" stroke="#33586B" stroke-width="2" opacity="0.6"/><text x="344" y="120" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">cuff</text><text x="344" y="180" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#A63B4A" text-anchor="middle">hand</text><text x="374" y="70" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#33586B" text-anchor="start">tip</text><text x="344" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#2A241E" text-anchor="middle">cuff: 15 sts, 6 BLO rounds</text><text x="24" y="256" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Ribbed cuff, plain hand, closed tip - three zones in one tube.</text></svg>