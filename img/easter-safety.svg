<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" width="640" height="438" font-family="'Work Sans', -apple-system, sans-serif"><title>Filling and caring for it</title><rect width="640" height="438" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Filling and caring for it</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">No loose parts under three</text><rect x="24.0" y="282" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="282" width="4" height="66" rx="2" fill="#33586B"/><text x="40.0" y="304" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Wash</text><text x="40.0" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">spot clean, or hand wash</text><text x="40.0" y="333" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">cool</text><rect x="228.0" y="282" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="282" width="4" height="66" rx="2" fill="#33586B"/><text x="244.0" y="304" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Reshape</text><text x="244.0" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">while it is still damp</text><rect x="432.0" y="282" width="184" height="66" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="282" width="4" height="66" rx="2" fill="#33586B"/><text x="448.0" y="304" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Dry upright</text><text x="448.0" y="320" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">stuff with a towel so the</text><text x="448.0" y="333" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">sides do not lean</text><text x="24" y="400" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">An Easter basket is one of the few gifts that is also its own wrapping, which is why a stack</text><text x="24" y="416" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">of them from February onward is never wasted.</text></svg>