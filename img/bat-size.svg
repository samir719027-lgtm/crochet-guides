<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Work Sans', -apple-system, sans-serif"><title>Adjusting the size</title><rect width="640" height="470" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Adjusting the size</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Wings are meant to look oversized</text><rect x="24" y="272" width="592" height="28" fill="#33586B"/><text x="34" y="291" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Change</text><text x="138" y="291" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Body</text><text x="382" y="291" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.4">Wings</text><rect x="24" y="300" width="592" height="30" fill="#FFFFFF"/><text x="34" y="317" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Larger</text><text x="138" y="317" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">+1-2 even rounds in the body</text><text x="382" y="317" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Start the wing chain 2-4 longer</text><line x1="24" y1="330" x2="616" y2="330" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="330" width="592" height="30" fill="#E4DACB"/><text x="34" y="347" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Smaller</text><text x="138" y="347" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">-1 even round in the body</text><text x="382" y="347" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Start the wing chain 2 shorter</text><line x1="24" y1="360" x2="616" y2="360" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="360" width="592" height="30" fill="#FFFFFF"/><text x="34" y="377" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">Unchanged</text><text x="138" y="377" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">The ear shaping and taper</text><text x="382" y="377" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#2A241E" text-anchor="start">A fixed sequence at any body size</text><line x1="24" y1="390" x2="616" y2="390" stroke="#DDD4C6" stroke-width="1"/><rect x="24" y="272" width="592" height="118" fill="none" stroke="#DDD4C6" stroke-width="1"/><text x="24" y="418" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A wing chain that feels too long against the body when you first look at it is very likely</text><text x="24" y="434" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">correct. Hold it up before sewing rather than scaling both pieces down together.</text></svg>