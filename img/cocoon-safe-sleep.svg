<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="'Work Sans', -apple-system, sans-serif"><title>Safe sleep</title><rect width="640" height="460" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#33586B"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Safe sleep</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">Cuddles and photos, not a crib</text><rect x="24.0" y="260" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="260" width="4" height="54" rx="2" fill="#33586B"/><text x="40.0" y="282" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Watch the buttons</text><text x="40.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Sew each of the 4 buttons very securely and</text><text x="40.0" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">check them periodically</text><rect x="330.0" y="260" width="286" height="54" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="330.0" y="260" width="4" height="54" rx="2" fill="#33586B"/><text x="346.0" y="282" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Lay flat to dry</text><text x="346.0" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">Heat can felt or shrink some fibres, and a</text><text x="346.0" y="311" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">bulky wet piece takes a day to dry evenly</text><text x="24" y="344" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">A handmade cocoon like this one is a short, supervised comfort rather than an everyday sleep</text><text x="24" y="360" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">item. That is a normal and satisfying way to use it.</text></svg>