<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Work Sans', -apple-system, sans-serif"><title>Durability &amp; straps</title><rect width="640" height="330" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#22404F"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">Durability &amp; straps</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">The part of the bag that fails first</text><rect x="24" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="24" y="96" width="280" height="34" rx="4" fill="#A63B4A"/><rect x="24" y="120" width="280" height="10" fill="#A63B4A"/><text x="38" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">SINGLE STRAND</text><text x="38" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">A normal strap</text><text x="38" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">for an adult bag.</text><text x="38" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Kids yank, swing,</text><text x="38" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">and overload</text><text x="38" y="232" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">theirs.</text><rect x="328" y="96" width="280" height="190" rx="4" fill="#FFFFFF" stroke="#DDD4C6"/><rect x="328" y="96" width="280" height="34" rx="4" fill="#33586B"/><rect x="328" y="120" width="280" height="10" fill="#33586B"/><text x="342" y="119" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0.3">DOUBLE STRAND</text><text x="342" y="152" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">Two strands held</text><text x="342" y="172" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">together for the</text><text x="342" y="192" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">whole strap -</text><text x="342" y="212" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">about double the</text><text x="342" y="232" font-family="'Work Sans', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#2A241E" text-anchor="start">thickness.</text><text x="24" y="308" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Straps fail before the body does; stack the yarn.</text></svg>