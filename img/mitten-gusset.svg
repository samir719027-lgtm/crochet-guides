<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" font-family="'Work Sans', -apple-system, sans-serif"><title>The gusset increase</title><rect width="640" height="336" rx="4" fill="#FBF8F2"/><rect x="0" y="0" width="640" height="4" fill="#A63B4A"/><text x="24" y="36" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#2A241E" text-anchor="start">The gusset increase</text><text x="24" y="58" font-family="'Work Sans', -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5A5148" text-anchor="start">One plain stitch between the two increases</text><rect x="24.0" y="196" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="24.0" y="196" width="4" height="64" rx="2" fill="#33586B"/><text x="40.0" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">+2 sts a round</text><text x="40.0" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">5-6 rounds total</text><rect x="228.0" y="196" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="228.0" y="196" width="4" height="64" rx="2" fill="#33586B"/><text x="244.0" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Until 8-9 sts</text><text x="244.0" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">is the gusset width</text><rect x="432.0" y="196" width="184" height="64" rx="4" fill="#EDE6D9" stroke="#DDD4C6"/><rect x="432.0" y="196" width="4" height="64" rx="2" fill="#33586B"/><text x="448.0" y="218" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#2A241E" text-anchor="start">Check placement</text><text x="448.0" y="234" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">try it on, shift by a round</text><text x="448.0" y="247" font-family="'Work Sans', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5A5148" text-anchor="start">or two</text><text x="24" y="282" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">Working the two increases side by side instead would make the thumb opening a lopsided slit.</text><text x="24" y="298" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">The single stitch between the increase points is what becomes a clean, round base for the</text><text x="24" y="314" font-family="'Work Sans', -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#5A5148" text-anchor="start">thumb.</text></svg>